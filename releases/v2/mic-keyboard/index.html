<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麦克风与键盘 · Sipplay v2</title><style>
:root{color-scheme:dark;background:#0a0c10;color:#f5f2fa;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:30px 16px}main{display:flex;flex-direction:column;align-items:center;width:100%}h1{font-size:18px;font-weight:550;margin:0 0 12px}.hint{color:#8e8e98;margin:0;text-align:center;line-height:1.6;font-size:13px}.zoom{display:grid;place-items:center;width:224px;height:224px;margin-top:12px}.zoom sipplay-mic-keyboard-toggle{transform:scale(4)}.caption{color:#76717e;font-size:11px;margin:0 0 22px}.original{display:flex;align-items:center;gap:16px;color:#99949f;font-size:12px}output{font-size:12px;color:#c5c0cc;margin-top:20px}.notes{max-width:310px;line-height:1.7;color:#77717e;font-size:11px;text-align:center;margin:14px 0 0}.states{display:flex;gap:6px;margin-top:22px;padding:4px;border:1px solid #2e2c35;border-radius:12px;background:#131218}.states button{border:0;border-radius:8px;padding:9px 18px;font:inherit;font-size:12px;color:#8e8997;background:transparent;cursor:pointer}.states button[aria-pressed=true]{background:#302738;color:#f6e3ff}.states button:focus-visible{outline:1px solid #d7b3ed;outline-offset:1px}
.downloads{display:flex;gap:18px;margin-top:22px}.downloads a{color:#bcb4c5;font-size:12px;text-decoration:none;border-bottom:1px solid #51475b;padding-bottom:3px}.compact body{height:220px;min-height:0;padding:0;overflow:hidden}.compact main{height:220px}.compact h1,.compact .hint,.compact .caption,.compact .original,.compact .states,.compact output,.compact .notes,.compact .downloads{display:none}.compact .zoom{height:220px;margin:0}</style><script>if(new URLSearchParams(location.search).has("compact"))document.documentElement.classList.add("compact");</script></head><body><main><h1>麦克风 ↔ 键盘</h1><p class="hint">点击图标切换，或选择下方状态</p><div class="zoom"><sipplay-mic-keyboard-toggle label="切换图标（放大预览）"></sipplay-mic-keyboard-toggle></div><p class="caption">4× 细节预览</p><div class="original"><sipplay-mic-keyboard-toggle label="切换图标（原始尺寸）"></sipplay-mic-keyboard-toggle><span>原始尺寸 · 30 × 30</span></div><div class="states" role="group" aria-label="图标状态"><button type="button" data-value="mic" aria-pressed="true">麦克风</button><button type="button" data-value="keyboard" aria-pressed="false">键盘</button></div><output aria-live="polite">麦克风</output><p class="notes">话筒收拢为按键，支架收成空格键<br>约 0.42 秒 · 可连续反向切换</p><nav class="downloads" aria-label="下载与接入"><a download href="./mic-keyboard.html">下载 HTML</a><a download href="./source.zip">下载源码包</a><a href="./USAGE.md">接入说明</a></nav></main><script type="module">
import {animate} from '../vendor/motion-components.js';
import {defineMicKeyboardToggle} from './mic-keyboard-toggle.js?v=1';
defineMicKeyboardToggle(animate);
const icons=[...document.querySelectorAll('sipplay-mic-keyboard-toggle')];
function choose(value){for(const icon of icons)if(icon.value!==value)icon.value=value;for(const button of document.querySelectorAll('[data-value]'))button.setAttribute('aria-pressed',String(button.dataset.value===value));document.querySelector('output').textContent=value==='keyboard'?'键盘':'麦克风';}
document.addEventListener('motion-change',e=>{if(icons.includes(e.target))choose(e.detail.value);});
for(const button of document.querySelectorAll('[data-value]'))button.addEventListener('click',()=>choose(button.dataset.value));
</script></body></html>
