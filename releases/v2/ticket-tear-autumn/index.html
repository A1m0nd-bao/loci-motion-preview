<style>
:root{
  color-scheme:dark;
  --bg:#140c0e;
  --ink:#fff4e8;
  --muted:#c4a49a;
  --card:#1c1014;
  --line:#4a2a30;
  --accent:#fc630d;
  --accent2:#e23726;
  --cream:#fff0d4;
  background:var(--bg);
  color:var(--ink);
  font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 16px;background:
  radial-gradient(ellipse at 50% 18%, #3a1a16 0%, #140c0e 55%, #0b0708 100%);}
main{width:min(100%,640px);text-align:center}
h1{font-size:19px;font-weight:650;margin:0 0 10px;letter-spacing:.01em;color:#ffe7d2}
.hint{font-size:13px;line-height:1.7;color:var(--muted);margin:0}
.stage{
  height:450px;display:grid;place-items:center;margin-top:22px;padding:26px;
  border:1px solid #5a3034;border-radius:24px;overflow:hidden;
  background:radial-gradient(ellipse at center,#4a241c 0%,#1a0f12 68%);
  box-shadow:inset 0 1px 0 rgba(255,200,150,.08), 0 18px 50px rgba(0,0,0,.35);
}
.ticket{position:relative;width:min(541px, calc(100% * 541 / 521));aspect-ratio:541/289;perspective:1000px}
.part{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;transform-origin:0% 55.949481%;will-change:auto}
.top{clip-path:none;z-index:2}
.stub{clip-path:none;z-index:1}
.stub img{display:block;width:100%;height:100%;clip-path:none;-webkit-clip-path:none;}
.paper-edge,.paper-bend{display:none}
.tear-line{
  position:absolute;top:55.949481%;left:2%;width:96%;height:1px;z-index:3;pointer-events:none;
  transform-origin:right center;transform:scaleX(0);opacity:0;
  background:linear-gradient(90deg,#ffbd5b66,#fff4d9cc 72%,#ffe6a040);
  filter:drop-shadow(0 0 3px #ffb15a66);
}
.ticket.tearing .top{animation:hold 1.25s both;transform-origin:0% 55.949481%}
.ticket.tearing .tear-line{animation:tear-line 1.25s both}
.ticket.torn .stub{opacity:0;transform:none}
@keyframes hold{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.35%) rotate(-.3deg);animation-timing-function:cubic-bezier(.22,1,.36,1)}}
@keyframes tear-line{0%,8%{opacity:0;transform:scaleX(0)}14%{opacity:.45}62%{opacity:.4;transform:scaleX(1)}70%,100%{opacity:0;transform:scaleX(1)}}
.bend-canvas{position:absolute;left:0;top:0;width:100%;height:auto;display:none;pointer-events:none}
.ticket.tearing .stub{animation:none}
.ticket.tearing .stub img{opacity:0}
.ticket.tearing .bend-canvas{display:block}
.redeem-input{
  position:absolute;left:5.25%;top:73.81%;width:67.84%;height:15.22%;
  box-sizing:border-box;border:0;border-radius:8px;padding:0 2.4%;
  background:#2a1218;color:#fff1df;font:clamp(8px,1.7vw,12px) -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  z-index:4;outline:none;
}
.redeem-input::placeholder{color:#b49398}
.redeem-input:focus{box-shadow:0 0 0 1px #e86b34}
.redeem-button{
  position:absolute;left:74.57%;top:73.81%;width:19.78%;height:15.22%;
  border:0;padding:0;background:transparent;cursor:pointer;z-index:4;outline:none;
  display:flex;align-items:center;justify-content:center;
}
.redeem-button .redeem-active-svg{
  width:100%;height:100%;display:block;opacity:0;transform:scale(.96);
  transition:opacity .18s cubic-bezier(.2,0,0,1),transform .18s cubic-bezier(.2,0,0,1),filter .18s ease;
  pointer-events:none;
}
.redeem-button.active .redeem-active-svg{opacity:1;transform:scale(1);filter:drop-shadow(0 2px 8px rgba(255,140,40,.35))}
.redeem-button.active:hover .redeem-active-svg{transform:scale(1.02);filter:drop-shadow(0 3px 12px rgba(255,160,60,.5))}
.redeem-button.active:active .redeem-active-svg{transform:scale(.97)}
.ticket.tearing .redeem-input,.ticket.tearing .redeem-button,.ticket.torn .redeem-input,.ticket.torn .redeem-button{visibility:hidden}
.part.top{pointer-events:none;z-index:2}
.part.top .slot-item,.part.top .quota-text-group,.part.top .slot-hit{pointer-events:auto;cursor:pointer}
.quota-text-group{pointer-events:auto;cursor:pointer;user-select:none;outline:none!important}
.quota-svg-text{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:12px;font-weight:700;fill:#87391F;letter-spacing:.01em;user-select:none;
  pointer-events:auto;cursor:pointer;outline:none!important;transform-origin:155px 124.5px;transition:opacity .15s ease;
}
.quota-text-group:hover .quota-svg-text{opacity:.82}
.quota-num{font-weight:800;transition:fill .2s ease}
.quota-svg-text.pop{animation:num-bounce .36s cubic-bezier(.34,1.56,.64,1) both}
@keyframes num-bounce{0%{transform:scale(1)}40%{transform:scale(1.28);fill:#fc630d}75%{transform:scale(.95)}100%{transform:scale(1);fill:#87391F}}
.slot-groove{fill:#612E61;fill-opacity:.15;transition:fill-opacity .2s ease}
.slot-item:hover .slot-groove{fill-opacity:.32}
.slot-bar{fill:url(#trackGrad);transform-box:fill-box;transform-origin:left center;transform:scaleX(0);opacity:0;pointer-events:none;
  transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .2s ease,filter .25s ease}
.slot-item.active .slot-bar{transform:scaleX(1);opacity:1}
.slot-item.is-head .slot-bar{filter:drop-shadow(0 0 3px rgba(252,99,13,.85)) drop-shadow(0 0 7px rgba(226,55,38,.45));animation:head-pulse 2s ease-in-out infinite alternate}
@keyframes head-pulse{0%{filter:drop-shadow(0 0 2px rgba(252,99,13,.55))}100%{filter:drop-shadow(0 0 5px rgba(252,99,13,.95)) drop-shadow(0 0 9px rgba(255,189,91,.55))}}
.slot-item.surge .slot-bar{animation:slot-surge .42s cubic-bezier(.34,1.56,.64,1) both}
@keyframes slot-surge{0%{transform:scaleX(0) scaleY(.6);opacity:0}55%{transform:scaleX(1.06) scaleY(1.35);opacity:1}75%{transform:scaleX(.98) scaleY(.94)}100%{transform:scaleX(1) scaleY(1);opacity:1;filter:none}}
.ticket.quota-full .slot-bar{animation:full-shimmer 2.4s ease-in-out infinite alternate}
@keyframes full-shimmer{0%{filter:drop-shadow(0 0 2px rgba(255,189,91,.4))}100%{filter:drop-shadow(0 0 4px rgba(255,190,120,.8)) drop-shadow(0 0 8px rgba(252,99,13,.7))}}
.copy-code-btn{cursor:pointer;pointer-events:auto;transform-origin:443px 77px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),filter .18s ease;user-select:none;outline:none!important;-webkit-tap-highlight-color:transparent!important}
.copy-code-btn:focus,.copy-code-btn:focus-visible,.copy-code-btn:active{outline:none!important;box-shadow:none!important}
.copy-code-btn:hover{filter:drop-shadow(0 4px 14px rgba(252,99,13,.45));transform:scale(1.02)}
.copy-code-btn:active{transform:scale(.96)}
.copy-code-btn.copied{filter:drop-shadow(0 4px 16px rgba(78,205,138,.55))}
.debug-panel{
  margin-top:22px;padding:16px 18px;border-radius:16px;text-align:left;
  background:rgba(28,16,20,.92);border:1px solid #5a3034;
}
.debug-panel .ctrl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.debug-panel .ctrl-title{font-size:12px;font-weight:650;color:#ffe7d2}
.debug-panel .ctrl-badge{font-size:11px;color:#e7b39a;background:#2a161a;padding:3px 9px;border-radius:999px;border:1px solid #6a3a3f}

.slider-row{display:flex;align-items:center;gap:10px}
.slider-row label{font-size:12px;color:#c4a49a;white-space:nowrap}
.slider-row input[type=range]{flex:1;accent-color:#fc630d;cursor:pointer;height:5px;background:#3a2226;border-radius:3px}
.btn-step{width:26px;height:26px;padding:0;border:1px solid #6a3a3f;background:#2a161a;color:#ffe7d2;font-size:14px;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.btn-step:hover{background:#3c2226;border-color:#a35540}
.val-pill{font-size:12px;font-weight:650;color:#fff4e8;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.presets-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.presets-label{font-size:11px;color:#a88880}
.btn-preset{font:inherit;font-size:11px;padding:4px 10px;border:1px solid #4a2a30;background:#221416;color:#d9b5a8;border-radius:8px;cursor:pointer}
.btn-preset:hover{background:#3a2226;color:#fff4e8;border-color:#a35540}
.btn-preset.active{background:#6a2e1c;color:#ffe8d2;border-color:#fc630d;font-weight:650}
.controls{display:flex;justify-content:center;gap:10px;margin-top:18px}
.controls button{font:inherit;font-size:12px;padding:10px 18px;border:1px solid #7a4038;border-radius:10px;color:#fff4e8;background:#3a1c1c;cursor:pointer}
.controls button.secondary{background:#1a1012;color:#d2b4aa;border-color:#4a2a30}
.controls button:focus-visible{outline:1px solid #ffbd5b;outline-offset:3px}
.controls button:disabled{opacity:.45;cursor:default}
.status{font-size:12px;color:#c4a49a;min-height:20px;margin:16px 0 0}
.note{font-size:11px;color:#8f6e68;line-height:1.8;margin:10px 0 0}
.release-downloads{display:flex;justify-content:center;gap:18px;margin-top:24px}
.release-downloads a{font-size:12px;color:#d2b4aa;text-decoration:none;border-bottom:1px solid #5a3a38;padding-bottom:3px}
.release-downloads a:hover{color:#fff4e8;border-color:#fc630d}
@media(max-width:560px){
  .stage{height:330px;padding:18px}
  body{padding:20px 12px}
}
@media(prefers-reduced-motion:reduce){
  .ticket.tearing .top,.ticket.tearing .tear-line,.slot-item.is-head .slot-bar,.ticket.quota-full .slot-bar,.quota-svg-text.pop{animation:none}
}
.compact body{width:260px;height:220px;min-height:0;padding:0;overflow:hidden;background:transparent}
.compact main{width:260px;height:220px}
.compact h1,.compact .hint,.compact .debug-panel,.compact .controls,.compact .status,.compact .note,.compact .release-downloads{display:none}
.compact .stage{width:260px;height:220px;margin:0;border:0;border-radius:0;background:transparent;padding:0;display:grid;place-items:center;box-shadow:none}

function createMotionSpring({ stiffness = 320, damping = 25, mass = 0.8, onUpdate, onComplete }) {
  let cur = 0, vel = 0, target = 0, raf = null;
  const w0 = Math.sqrt(stiffness / mass);
  const zeta = damping / (2 * Math.sqrt(stiffness * mass));

      const decay = Math.exp(-zeta * w0 * t);
      const c1 = -delta;
      const c2 = (startVel + zeta * w0 * (-delta)) / (wd || 0.001);
      cur = target + decay * (c1 * Math.cos(wd * t) + c2 * Math.sin(wd * t));
      vel = decay * (-zeta * w0 * (c1 * Math.cos(wd * t) + c2 * Math.sin(wd * t)) +
        (-c1 * wd * Math.sin(wd * t) + c2 * wd * Math.cos(wd * t)));
      onUpdate(cur);
      if (t > 0.05 && Math.abs(cur - target) < 0.002 && Math.abs(vel) < 0.005) {

      } else { raf = requestAnimationFrame(tick); }
    }
    raf = requestAnimationFrame(tick);
  }
  return {
    animateTo,
    set: val => { if (raf) cancelAnimationFrame(raf); cur = val; vel = 0; target = val; onUpdate(val); },
    getCurrent: () => cur
  };

  });
  presetButtons.forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.val, 10) === currentQuota);
  });
}
if (quotaTextGroup) {
  quotaTextGroup.addEventListener('click', (e) => {
    e.stopPropagation();
    const nextVal = currentQuota >= totalQuota ? 0 : currentQuota + 1;
    updateQuota(nextVal);
  });
  quotaTextGroup.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); quotaTextGroup.click(); }
  });
}
quotaSlots.forEach((slot, i) => {
  slot.addEventListener('click', (e) => {
    e.stopPropagation();
    const targetSlot = i + 1;
    if (currentQuota === targetSlot) updateQuota(targetSlot - 1); else updateQuota(targetSlot);
  });
});
if (quotaRange) quotaRange.addEventListener('input', e => updateQuota(e.target.value));
const btnMinus = document.getElementById('stepMinus');
if (btnMinus) btnMinus.addEventListener('click', () => updateQuota(currentQuota - 1));
const btnPlus = document.getElementById('stepPlus');
if (btnPlus) btnPlus.addEventListener('click', () => updateQuota(currentQuota + 1));
presetButtons.forEach(btn => { btn.addEventListener('click', () => updateQuota(btn.dataset.val)); });
if (copyCodeBtn) {
  copyCodeBtn.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    const code = '320146';
    function fallbackCopy(str) {
      try {
        const ta = document.createElement('textarea');
        ta.value = str; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      } catch(err) {}
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).catch(() => fallbackCopy(code));
    } else { fallbackCopy(code); }
    copyCodeBtn.classList.add('copied');
    if (status) status.textContent = '邀请码已复制：' + code;
    setTimeout(() => {
      copyCodeBtn.classList.remove('copied');
      if (status && status.textContent.includes('邀请码已复制')) status.textContent = '输入激活码后点击兑换';
    }, 1600);
  });
}


/* v3.2 notch debug — bind after DOM ready */
(function(){
  function enableDebugFromQuery(){
    try{
      var p=new URLSearchParams(location.search).get('debug');
      if(p && ['notch','1','true'].indexOf(p)>=0){
        document.documentElement.classList.add('debug-notch');
      }
    }catch(e){}
  }
  function bindNotchDebug(){
    document.querySelectorAll('.debug-panel-notch [data-dbg]').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.documentElement.classList.add('debug-notch');
        var stage=document.querySelector('.stage');
        if(!stage) return;
        stage.classList.remove('debug-bg-magenta','debug-bg-lime','debug-bg-blue','debug-bg-black','debug-bg-cyan','debug-bg-moving');
        var v=btn.getAttribute('data-dbg');
        if(v==='cyan') stage.classList.add('debug-bg-cyan');
        else if(v==='moving') stage.classList.add('debug-bg-moving');
        else if(v==='magenta') stage.classList.add('debug-bg-magenta');
        else if(v==='lime') stage.classList.add('debug-bg-lime');
        else if(v==='blue') stage.classList.add('debug-bg-blue');
        else if(v==='black') stage.classList.add('debug-bg-black');
      });
    });
  }
  enableDebugFromQuery();
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', bindNotchDebug);
  else bindNotchDebug();
})();

</script>
