uby0', cx: 328.9, cy: 239.6, ox: 280, oy: 305, delay: 0.08, dur: 0.44, arcH: 26, rot0: -24, scale0: 0.35, floatAmpY: 3.0, floatAmpX: 1.2, freq: 1.45, rotAmp: 1.2, phase: 0.0 },\n        \n        { id: 'ruby2', cx: 284.7, cy: 283.7, ox: 280, oy: 305, delay: 0.16, dur: 0.34, arcH: 14, rot0: -15, scale0: 0.45, floatAmpY: 2.2, floatAmpX: 0.0, freq: 3.10, rotAmp: 0.8, phase: 2.5 },\n        \n        { id: 'ruby7', cx: 400.6, cy: 204.4, ox: 285, oy: 305, delay: 0.22, dur: 0.42, arcH: 30, rot0: -28, scale0: 0.32, floatAmpY: 3.5, floatAmpX: 2.0, freq: 1.80, rotAmp: 1.8, phase: 4.6 },\n        \n        { id: 'ruby6', cx: 383.9, cy: 139.1, ox: 285, oy: 305, delay: 0.30, dur: 0.48, arcH: 40, rot0: 36,  scale0: 0.30, floatAmpY: 4.8, floatAmpX: 3.0, freq: 1.25, rotAmp: 2.5, phase: 3.8 }\n    ];\n\n    const FLYING_SPARKLES = [\n        \n        { id: 'sparkle2', cx: 364.23, cy: 185.60, ox: 285, oy: 295, delay: 0.02, dur: 0.46, arcH: 32, rot0: 55,  scaleOvershoot: 1.50, orbX: 4.5, orbY: 5.0, freqFloat: 1.10, autoTwinkleFreq: 2.4, lightPhaseLag: 1.3, lightExcitation: 0.45, phase: 4.2 },\n        \n        { id: 'sparkle0', cx: 260.98, cy: 236.20, ox: 275, oy: 295, delay: 0.10, dur: 0.38, arcH: 18, rot0: -45, scaleOvershoot: 1.35, orbX: 3.5, orbY: 3.8, freqFloat: 1.50, autoTwinkleFreq: 3.5, lightPhaseLag: 0.7, lightExcitation: 0.30, phase: 0.5 },\n        \n        { id: 'sparkle1', cx: 284.72, cy: 255.30, ox: 280, oy: 305, delay: 0.18, dur: 0.32, arcH: 10, rot0: 35,  scaleOvershoot: 1.40, orbX: 1.2, orbY: 3.0, freqFloat: 2.20, autoTwinkleFreq: 5.8, lightPhaseLag: 0.3, lightExcitation: 0.38, phase: 2.1 }\n    ];\n\n    const clamp = (v, min = 0, max = 1) =\u003e Math.max(min, Math.min(max, v));\n    const easeInCubic = t =\u003e t * t * t;\n    const easeOutCubic = t =\u003e 1 - Math.pow(1 - t, 3);\n    const easeOutBack = (t, s = 1.70158) =\u003e {\n        t -= 1;\n        return t * t * ((s + 1) * t + s) + 1;\n    };\n    const dampedSpring = (t, freq = 16, decay = 8) =\u003e {\n        if (t \u003c 0) return 0;\n        return 1 - Math.exp(-decay * t) * Math.cos(freq * t);\n    };\n\n    const stageRig = $('stageRig');\n    const ambientGlow = $('ambientGlow');\n    const modalTitle = $('modalTitle');\n    const rewardAmount = $('rewardAmount');\n    const REWARD_TIERS = [\n        { tier: 1, price: '3.99', a: 1200, b: 600, c: 1800 },\n        { tier: 2, price: '9.99', a: 3200, b: 1600, c: 4800 },\n        { tier: 3, price: '19.99', a: 7000, b: 3500, c: 10500 },\n        { tier: 4, price: '49.99', a: 20000, b: 10000, c: 30000 },\n        { tier: 5, price: '89.99', a: 38000, b: 19000, c: 57000 },\n        { tier: 6, price: '169.99', a: 75000, b: 0, c: 75000 }\n    ];\n    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const rewardGem = $('rewardGem');\n    const rewardBase = $('rewardBase');\n    const rewardBonus = $('rewardBonus');\n    const rewardBonusWrap = $('rewardBonusWrap');\n    const rewardBadge = $('rewardBadge');\n    const rewardMergeGlow = $('rewardMergeGlow');\n    const numberFormat = new Intl.NumberFormat('en-US');\n    let reward = { ...REWARD_TIERS[1] };\n    let rewardLayout = {};\n    let displayedReward = -1;\n\n    function emitRewardState() {\n        if (window.parent !== window) window.parent.postMessage({ type: 'reward:state', reward: { ...reward }, duration: TOTAL_DUR }, '*');\n    }\n\n    function configureReward(values) {\n        const { a, b, c } = values;\n        if (![a, b, c].every(v =\u003e Number.isSafeInteger(v) \u0026\u0026 v \u003e= 0) || a + b !== c) {\n            throw new RangeError('a、b、c 必须是非负安全整数，且 a + b = c');\n        }\n        reward = { ...values };\n        rewardBase.textContent = numberFormat.format(a);\n        const baseWidth = rewardBase.getComputedTextLength();\n        rewardBase.textContent = numberFormat.format(c);\n        const totalWidth = rewardBase.getComputedTextLength();\n        rewardBonus.textContent = '+' + numberFormat.format(b);\n        const bonusWidth = b \u003e 0 ? rewardBonus.getComputedTextLength() : 0;\n        const gemWidth = 43.2, gap = 12, bonusGap = 14;\n        const fullWidth = gemWidth + gap + baseWidth + (b \u003e 0 ? bonusGap + bonusWidth : 0);\n        const scale = Math.min(1, 444 / fullWidth);\n        rewardLayout = {\n            gemX: 280 - fullWidth / 2,\n            baseX: 280 - fullWidth / 2 + gemWidth + gap,\n            bonusX: 280 - fullWidth / 2 + gemWidth + gap + baseWidth + bonusGap,\n            bonusEnd: 280 + fullWidth / 2,\n            finalGemX: 280 - (gemWidth + gap + totalWidth) / 2,\n            finalBaseX: 280 - (gemWidth + gap + totalWidth) / 2 + gemWidth + gap,\n            scale\n        };\n        rewardBonus.setAttribute('x', rewardLayout.bonusX);\n        displayedReward = -1;\n        rewardAmount.setAttribute('aria-label', b \u003e 0\n            ? `${numberFormat.format(a)} 宝石，加赠 ${numberFormat.format(b)}，合计 ${numberFormat.format(c)}`\n            : `${numberFormat.format(c)} 宝石，无加赠`);\n        emitRewardState();\n    }\n\n    function renderReward(t) {\n        const { a, b, c } = reward;\n        const progress = clamp((t - 1.05) / 0.42);\n        const mergeProgress = b \u003e 0 ? clamp((t - 2.45) / 0.80) : 1;\n        const mergeEase = mergeProgress \u003c 0.5\n            ? 4 * mergeProgress * mergeProgress * mergeProgress\n            : 1 - Math.pow(-2 * mergeProgress + 2, 3) / 2;\n        const countProgress = b \u003e 0 ? easeOutCubic(clamp((t - 2.57) / 0.68)) : 1;\n        const value = Math.round(a + b * countProgress);\n        if (displayedReward !== value) {\n            rewardBase.textContent = numberFormat.format(value);\n            displayedReward = value;\n        }\n        const xGem = rewardLayout.gemX + (rewardLayout.finalGemX - rewardLayout.gemX) * mergeEase;\n        const xBase = rewardLayout.baseX + (rewardLayout.finalBaseX - rewardLayout.baseX) * mergeEase;\n        const settle = b \u003e 0 ? Math.sin(clamp c 0.50 || dt \u003c s.delay) {\n                el.setAttribute('opacity', '0');\n                el.setAttribute('transform', `translate(${(s.ox - s.cx).toFixed(1)}, ${(s.oy - s.cy).toFixed(1)}) scale(0)`);\n                return;\n            }\n\n            const localDt = dt - s.delay;\n            const u = clamp(localDt / s.dur);\n            const spring = dampedSpring(localDt, 13, 7.0);\n            const arc = 4 * u * (1 - u) * s.arcH;\n\n            const flightTx = (s.ox - s.cx) * (1 - spring);\n            const flightTy = (s.oy - s.cy) * (1 - spring) - arc;\n            const flightRot = s.rot0 * Math.exp(-7.5 * localDt) * Math.cos(11 * localDt);\n            const scalePop = easeOutBack(u, 2.0);\n\n            const idleX = Math.cos(tau * s.freqFloat + s.phase) * s.orbX * standbyRamp;\n            const idleY = Math.sin(tau * (s.freqFloat * 1.2) + s.phase) * s.orbY * standbyRamp;\n            const idleRot = Math.sin(tau * 0.9 + s.phase) * 14 * standbyRamp;\n\n            const autoTwinkle = 0.85 + Math.sin(tau * s.autoTwinkleFreq + s.phase) * 0.15;\n\n            const lightWaveAtStar = Math.max(0, Math.sin(tau * lightOmega - s.lightPhaseLag));\n            const lightExcitation = Math.pow(lightWaveAtStar, 2.2) * s.lightExcitation * standbyRamp;\n\n            const totalTwinkleScale = (autoTwinkle + lightExcitation);\n            const totalScale = clamp(scalePop * totalTwinkleScale, 0, 1.85);\n            const curOpacity = clamp(localDt / 0.05);\n\n            el.setAttribute('opacity', curOpacity.toFixed(2));\n            el.setAttribute('transform', \n                `translate(${(flightTx + idleX).toFixed(2)}, ${(flightTy + idleY).toFixed(2)}) ` +\n                `translate(${s.cx}, ${s.cy}) rotate(${(flightRot + idleRot).toFixed(2)}) scale(${totalScale.toFixed(3)}) translate(${-s.cx}, ${-s.cy})`\n            );\n        });\n\n        const cDtL = dt - 0.14;\n        if (t \u003c 0.50 || cDtL \u003c 0) {\n            confettiL.setAttribute(' ect[index] + (endRect[index] - startRect[index]) * lidTravel;\n            $(\"battleOpenTexture\").setAttribute(attributes[index],value);\n            $(\"battleClosedTexture\").setAttribute(attributes[index],value);\n        }\n        const lidAngle = 16 * (1 - lidTravel) * easeOutCubic(clamp((t - .50) / .03));\n        const lidTransform = \"rotate(\" + lidAngle.toFixed(2) + \" 185 290)\";\n        closedLidWrap.setAttribute(\"transform\",lidTransform);\n        openLid.setAttribute(\"transform\",lidTransform);\n        if (t \u003e= .50) { closedLidWrap.setAttribute(\"opacity\",t \u003c .54 ? 1 : 0); openLid.setAttribute(\"opacity\",t \u003c .54 ? 0 : 1); }\n        $(\"textureOpeningFlashLayer\").setAttribute(\"opacity\",clamp((t-.50)/.025)*(1-clamp((t-.54)/.06))*.9);\n        $(\"cavityFlare\").firstElementChild.setAttribute(\"opacity\",t \u003c .50 ? .2 : 1);\n    }\n\n    function tick(timestamp) {\n        if (!lastTimestamp) lastTimestamp = timestamp;\n        const delta = (timestamp - lastTimestamp) / 1000;\n        lastTimestamp = timestamp;\n\n        if (isPlaying) {\n            curTime += delta;\n\n            if (curTime \u003e= TOTAL_DUR) {\n                curTime = ENTRY_DUR + ((curTime - ENTRY_DUR) % STANDBY_DUR);\n            }\n\n            render(curTime);\n        }\n\n        requestAnimationFrame(tick);\n    }\n\n    window.seekMotion = function(t) {\n        if (!Number.isFinite(t)) return;\n        isPlaying = false;\n        curTime = clamp(t, 0, TOTAL_DUR);\n        render(curTime);\n    };\n\n    window.replayMotion = function() {\n        curTime = reducedMotion ? ENTRY_DUR : 0;\n        isPlaying = !reducedMotion;\n        lastTimestamp = null;\n        render(curTime);\n    };\n\n    window.setReward = function(values, options = {}) {\n        configureReward(values);\n        if (options.replay !== false) window.replayMotion();\n        else render(curTime);\n        return { ...reward };\n    };\n\n    window.setRewardTier = f
