<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语音正在输入 · Sipplay v2</title><style>
:root{color-scheme:dark;background:#0a0c10;color:#f5f2fa;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 20px}main{width:min(100%,620px)}header{display:flex;justify-content:space-between;color:#77717e;font-size:11px;letter-spacing:.07em}h1{font-size:24px;letter-spacing:-.035em;font-weight:550;margin:28px 0 10px}.intro{font-size:13px;line-height:1.8;color:#918c99;margin:0}.panel{margin-top:24px;border:1px solid #292630;border-radius:22px;background:#121116;overflow:hidden}.large{height:180px;display:flex;align-items:center;justify-content:center;padding:26px}.large sipplay-voice-input-wave{--voice-wave-width:434px}.caption{color:#706b79;font-size:11px;text-align:center;margin:0 0 24px}.actual{border-top:1px solid #292630;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:132px;padding:20px}.actual span{color:#77717e;font-size:11px}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px}output{font-size:12px;color:#cbc4d3}.actions{display:flex;gap:8px}button{padding:10px 15px;border:1px solid #36303e;background:#211b2a;border-radius:10px;font:inherit;font-size:12px;color:#e3d6ee;cursor:pointer}button:hover{background:#30263b}button:focus-visible,summary:focus-visible{outline:1px solid #e3c4f8;outline-offset:3px}.notes{font-size:11px;line-height:1.8;color:#77717e;margin:22px 0 0}details{border-top:1px solid #292630;margin-top:20px;padding-top:18px;font-size:12px;color:#918c99}summary{cursor:pointer}details img{display:block;max-width:100%;margin:24px auto}
.release-downloads{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin:24px 0}.release-downloads a{font-size:12px;color:#bcb4c5;text-decoration:none;border-bottom:1px solid #51475b;padding-bottom:3px}.compact body{height:220px;min-height:0;padding:0;overflow:hidden}.compact main{width:100%;height:220px}.compact header,.compact h1,.compact .intro,.compact .caption,.compact .actual,.compact .controls,.compact .notes,.compact details,.compact .release-downloads{display:none}.compact .panel{height:220px;margin:0;border:0;border-radius:0;background:#0a0c10}.compact .large{height:220px;padding:20px}.compact .large sipplay-voice-input-wave{--voice-wave-width:217px}</style><script>if(new URLSearchParams(location.search).has("compact"))document.documentElement.classList.add("compact");</script></head><body><main><header><span>SIPPLAY / MOTION</span><span>语音输入 · v2</span></header><h1>语音正在输入</h1><p class="intro">各根声波错峰起落，轻重和快慢跟随说话节奏。</p><section class="panel" aria-label="声波预览"><div class="large"><sipplay-voice-input-wave label="语音输入声波放大预览"></sipplay-voice-input-wave></div><p class="caption">2× 细节预览</p><div class="actual"><sipplay-voice-input-wave label="语音输入声波原始尺寸"></sipplay-voice-input-wave><span>原始尺寸 · 217 × 25</span></div></section><div class="controls"><output aria-live="polite">语音正在输入</output><div class="actions"><button type="button" id="pause">暂停预览</button><button type="button" id="speech">模拟停顿</button></div></div><p class="notes">模拟说话与停顿 · 中线固定<br>当前为动效演示，可在接入时用真实音量驱动。</p><details><summary>查看静态原稿</summary><img src="./reference.svg" width="217" height="25" alt="语音声波静态设计原稿"></details><nav class="release-downloads" aria-label="下载与接入"><a href="./voice-input.html" download>下载 HTML</a><a href="./source.zip" download>下载源码包</a><a href="./USAGE.md">接入说明</a></nav></main><script type="module">
import {defineVoiceInputWave} from './voice-input-wave.js?v=lively3';
defineVoiceInputWave();
const waves=[...document.querySelectorAll('sipplay-voice-input-wave')],pause=document.querySelector('#pause'),speech=document.querySelector('#speech'),status=document.querySelector('output');let paused=false,quiet=false;
function updateStatus(){status.textContent=paused?'预览已暂停':quiet?'等待继续说话':'语音正在输入';}
pause.addEventListener('click',()=>{paused=!paused;for(const wave of waves)paused?wave.pause():wave.play();pause.textContent=paused?'继续预览':'暂停预览';updateStatus();});
speech.addEventListener('click',()=>{quiet=!quiet;for(const wave of waves){wave.toggleAttribute('quiet',quiet);wave.play();}paused=false;pause.textContent='暂停预览';speech.textContent=quiet?'模拟说话':'模拟停顿';updateStatus();});
</script></body></html>
