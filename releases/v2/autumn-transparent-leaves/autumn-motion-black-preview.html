const REF_W=1440,REF_H=900,SLOPE=0.645,SEED=21251,REF_COUNT=30;
const SIZE_MIN=0.52,SIZE_MAX=1.35,COUNT_MIN=12,COUNT_MAX=48;

function computeLayout(width,height){
  const W=Math.max(1,Number(width)||1),H=Math.max(1,Number(height)||1);
  const areaRatio=(W*H)/(REF_W*REF_H);

  const count=Math.min(COUNT_MAX,Math.max(COUNT_MIN,Math.round(REF_COUNT*areaRatio/(sizeScale*sizeScale))));

  const mBottomExit=Math.max(160*sizeScale,maxH*.7);

function measure(){
  const w=viewport.clientWidth,h=viewport.clientHeight;
  if(w>=2&&h>=2)return {w,h};
  return {w:Math.max(1,window.innerWidth||REF_W),h:Math.max(1,window.innerHeight||REF_H)};

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function fit(){
  const {w,h}=measure();

  lastW=w;lastH=h;

function scheduleFit(){

    const keys=[],flutter=[];
    for(let j=0;j<=100;j++){
      const p=j/100,wave=Math.sin(p*Math.PI*2*cycles+phase)-Math.sin(phase);
      const x=x0-travel*p+wave*sway;
      const y=y0+travel*SLOPE*p+Math.sin(p*Math.PI*2*cycles+phase+.8)*9*L.sizeScale;
      const verticalFade=Math.pow(Math.max(0,Math.min(1,(860/REF_H*L.H-y-imgH*.5)/(780/REF_H*L.H))),1.15);
      const horizontalFade=Math.pow(Math.max(0,Math.min(1,(x+imgW*.5-40/REF_W*L.W)/(1280/REF_W*L.W))),1.15);
      const dissolve=Math.min(verticalFade,horizontalFade);
      keys.push({offset:p,transform:`translate3d(${x}px,${y}px,0)`,opacity:Math.min(1,p/.055,(1-p)/.065)*(layer<.25?.52:layer>.78?1:.85)*dissolve});
      flutter.push({offset:p,transform:`rotate(${initialAngle+turn*p+Math.sin(p*Math.PI*2*cycles+phase)*21}deg) scaleX(${.76+.24*Math.sin(p*Math.PI*2*(cycles*.73)+phase)}) rotateX(${Math.sin(p*Math.PI*2*cycles+phase)*18}deg)`});
    }
    const flight=wrap.animate(keys,{duration,iterations:Infinity,easing:'linear'});
    const roll=img.animate(flutter,{duration,iterations:Infinity,easing:'linear'});
    const time=fresh?-i*620:duration*((i*.61803398875+.19)%1);
    flight.currentTime=time;roll.currentTime=time;
    for(const a of [flight,roll]){a.updatePlaybackRate(rate);animations.push(a)}
  }
  sync();
}

new ResizeObserver(scheduleFit).observe(viewport);
window.addEventListener('resize',scheduleFit);
window.addEventListener('orientationchange',scheduleFit);
document.addEventListener('visibilitychange',sync);
reduced.addEventListener('change',e=>{paused=e.matches;sync()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|BUTTON|TEXTAREA/.test(e.target.tagName)){e.preventDefault();paused=!paused;sync()}});
Promise.all(ASSETS.map(asset=>new Promise(resolve=>{const img=new Image();img.onload=resolve;img.onerror=resolve;img.src=asset.src}))).then(()=>fit());
</script>
