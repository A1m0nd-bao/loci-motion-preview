<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图钉选中切换 · Sipplay v2</title><style>
:root{color-scheme:dark;background:#0a0c10;color:#f5f2fa;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:30px 16px}main{text-align:center;width:min(100%,430px)}h1{font-size:19px;font-weight:550;margin:0 0 12px}.hint{font-size:13px;line-height:1.7;color:#a39ca9;margin:0}.stage{height:220px;margin:22px 0 0;border:1px solid #292630;border-radius:22px;background:radial-gradient(ellipse at center,#211e27,#121218 70%);display:grid;place-items:center}.stage sipplay-pin-toggle{transform:scale(4)}.caption{font-size:11px;color:#807985;margin:12px 0 26px}.samples{display:flex;align-items:center;justify-content:center;gap:38px}.sample{display:grid;justify-items:center;gap:8px;font-size:12px;color:#a49ca9}.ref{width:44px;height:44px;display:grid;place-items:center}.status{color:#ded7e0;font-size:13px;margin:25px 0 0;min-height:20px}
.compact body{width:260px;height:220px;min-height:0;padding:0;overflow:hidden}.compact main{width:260px;height:220px}.compact h1,.compact .hint,.compact .caption,.compact .samples,.compact .status,.compact .release-downloads{display:none}.compact .stage{width:260px;height:220px;margin:0;border:0;border-radius:0;background:#0a0c10}.release-downloads{display:flex;justify-content:center;gap:18px;margin-top:24px}.release-downloads a{font-size:12px;color:#bcb4c5}</style><script>if(new URLSearchParams(location.search).has("compact"))document.documentElement.classList.add("compact");</script></head><body><main><h1>图钉选中切换</h1><p class="hint">点击图钉切换 · 已固定状态替换为新版</p><div class="stage"><sipplay-pin-toggle label="切换图钉状态，四倍预览"></sipplay-pin-toggle></div><p class="caption">4× 细节预览</p><div class="samples"><div class="sample"><sipplay-pin-toggle label="切换图钉状态，原始尺寸"></sipplay-pin-toggle><span>原始尺寸 · 18 × 18</span></div><div class="sample"><div class="ref"><img src="./pinned-reference.svg" width="18" height="18" alt="已固定状态原稿"></div><span>已固定原稿</span></div></div><p class="status" aria-live="polite">未固定</p><nav class="release-downloads"><a href="./pin-toggle.html" download>下载 HTML</a><a href="./source.zip" download>下载源码包</a></nav></main><script type="module">
import {animate} from './motion-components.js';
import {definePinToggle} from './pin-toggle.js?v=outline1';
definePinToggle(animate);
const icons=[...document.querySelectorAll('sipplay-pin-toggle')];
document.addEventListener('motion-change',event=>{if(!icons.includes(event.target))return;for(const icon of icons)if(icon!==event.target)icon.active=event.detail.active;document.querySelector('.status').textContent=event.detail.active?'已固定':'未固定';});
</script></body></html>
