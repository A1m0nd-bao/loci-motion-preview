const W=1340,H=1190,DURATION=1400;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const replay=document.getElementById('replay'),hint=document.getElementById('hint');
const query=new URLSearchParams(location.search),qa=query.get('qa')==='1';
document.getElementById('qa').hidden=!qa;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let firstImage=null;
const stationary=document.createElement('canvas');stationary.width=1340;stationary.height=1190;
const partImages={},closedCap=document.createElement('canvas');closedCap.width=W;closedCap.height=H;

const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=x=>{const t=clamp(x);return t*t*(3-2*t);};
const lerp=(a,b,p)=>a+(b-a)*p;
function hop(t,begin,end,height){
 if(t<=begin||t>=end)return 0;return height*Math.sin(Math.PI*(t-begin)/(end-begin));
}
function pose(t){
 let opening=0,press=0;
 if(t>=110&&t<230)press=Math.sin(Math.PI*(t-110)/120);
 else if(t>=230&&t<500){const p=clamp((t-230)/270);opening=1.105*(1-Math.pow(1-p,3));}
 else if(t>=500&&t<660)opening=lerp(1.105,.978,smooth((t-500)/160));
 else if(t>=660&&t<900)opening=lerp(.978,1,smooth((t-660)/240));
 else if(t>=900)opening=1;
 const flash=smooth((t-300)/110)*(1-smooth((t-450)/300));
 const dust=smooth((t-300)/100)*(1-smooth((t-650)/400));
 const airborne=hop(t,230,560,46),landing=hop(t,560,640,3),rebound=hop(t,640,800,5);
 const jumpY=3*press-airborne+landing-rebound;
 const rock=-.008*airborne/46+.003*landing/3;
 return {opening,press,flash,dust,jumpY,rock,gemLift:hop(t,305,810,38)+hop(t,810,1000,6)};
}
function part(id,alpha=1,transform=null){
 if(alpha<=0)return;const a=DATA.layers[id];ctx.save();ctx.globalAlpha=alpha;
 if(transform)transform();ctx.drawImage(partImages[id],a.x,a.y,a.width,a.height);ctx.restore();

function lidPose(opening){
 const slope=75/680,k=-.15+1.15*opening,a=.08*(1-opening);
 ctx.translate(350,675);
 ctx.transform(1+a*slope,slope*(k-1-a*slope),a,k-slope*a,0,0);
 ctx.translate(-350,-675);
}
function bowPose(opening){
 const q=1-opening;ctx.translate(700,360);ctx.rotate(.075*q);ctx.translate(-700+16*q,-360+85*q);
}
function rearRibbon(top,alpha=1,transform=null){
 ctx.save();if(transform)transform();ctx.beginPath();ctx.rect(0,top?0:420,W,top?420:H-420);ctx.clip();part('ribbon_rear',alpha);ctx.restore();

function drawClosed(p,alpha){

}

function drawGems(p,alpha){
 if(alpha<=0)return;
 part('inside_gems',alpha,()=>{
  ctx.translate(800,680-p.gemLift);ctx.rotate(.022*p.gemLift/38);ctx.translate(-800,-680);
 });
}
function movingGlow(p,contents){
 if(contents<=0)return;

 ctx.beginPath();ctx.moveTo(350,680);ctx.lineTo(1205,680);ctx.lineTo(1205,330);ctx.lineTo(350,330);ctx.closePath();ctx.clip();
 ctx.translate(800,590-26*p.flash);ctx.scale(1,.60);

}
function glints(p){
 const stars=[{x:812,y:535,begin:350,end:780},{x:1075,y:650,begin:460,end:910},{x:733,y:690,begin:400,end:840},{x:590,y:650,begin:540,end:990}];
 ctx.save();ctx.globalCompositeOperation='screen';
 for(const star of stars){
  const v=clamp((ms-star.begin)/(star.end-star.begin)),power=Math.sin(Math.PI*v);if(power<=0)continue;
  ctx.save();ctx.translate(800,680-p.gemLift);ctx.rotate(.022*p.gemLift/38);ctx.translate(star.x-800,star.y-680);ctx.rotate(v*.7);ctx.globalAlpha=power*.92;
  const r=3+10*power;ctx.fillStyle='#eeffff';ctx.shadowColor='#9ce8ff';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(1.6,-1.6,r,0);ctx.quadraticCurveTo(1.6,1.6,0,r);ctx.quadraticCurveTo(-1.6,1.6,-r,0);ctx.quadraticCurveTo(-1.6,-1.6,0,-r);ctx.fill();ctx.restore();
 }
 ctx.restore();
}
function energy(p){
 if(p.flash<=0&&p.dust<=0)return;
 ctx.save();ctx.beginPath();ctx.moveTo(360,695);ctx.lineTo(1210,635);ctx.lineTo(1210,240);ctx.lineTo(360,240);ctx.closePath();ctx.clip();
 ctx.globalCompositeOperation='screen';
 if(p.flash>0){
  const g=ctx.createRadialGradient(800,620,0,800,620,315);g.addColorStop(0,`rgba(255,235,167,${p.flash*.72})`);g.addColorStop(.32,`rgba(255,190,66,${p.flash*.34})`);g.addColorStop(1,'rgba(255,170,50,0)');ctx.fillStyle=g;ctx.fillRect(360,240,850,470);
  for(let i=0;i<3;i++){
   const sway=Math.sin(ms*.006+i*2.1)*22,x=590+i*210+sway,y=285+(i%2)*35,w=65+i*10;
   ctx.save();const beam=ctx.createLinearGradient(800,675,x,y);beam.addColorStop(0,`rgba(255,213,111,${p.flash*.33})`);beam.addColorStop(.55,`rgba(255,198,79,${p.flash*.24})`);beam.addColorStop(1,'rgba(255,180,66,0)');ctx.fillStyle=beam;ctx.filter='blur(13px)';
   ctx.beginPath();ctx.moveTo(760,685);ctx.quadraticCurveTo(x-w*.4,430,x-w,y);ctx.quadraticCurveTo(x,y-25,x+w,y);ctx.quadraticCurveTo(x+w*.4,430,840,685);ctx.closePath();ctx.fill();ctx.restore();
  }
 }
 if(p.dust>0){
  const age=clamp((ms-320)/680);
  for(let i=0;i<24;i++){
   const seed=(i*.61803398875)%1,delay=(i%4)*.045,u=clamp((age-delay)/(1-delay));
   const x=585+seed*465+Math.sin(i*3.1)*120*u,y=658-(150+seed*190)*u+55*u*u;
   const alpha=p.dust*Math.sin(Math.PI*u)*(.45+.45*seed);if(alpha<=0)continue;
   const size=1.6+(i%3)*.8;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle=i%3?'#ffdf8a':'#fff1c5';ctx.shadowColor='#ffbd4d';ctx.shadowBlur=8;ctx.fillRect(-size,-size,size*2,size*2);ctx.restore();
  }
 }
 ctx.restore();
}
function impactGround(){

}
function aligned(draw){
 ctx.save();ctx.translate(-85,-85);ctx.scale(1.075,1);draw();ctx.restore();
}
function render(){
 if(!ready)return;const p=pose(ms),reveal=smooth((p.opening-.08)/.27),contents=smooth((p.opening-.18)/.35);

 if(ms===0){ctx.drawImage(firstImage,0,175,1340,1340*512/744);}
 else{
  impactGround();
  ctx.save();ctx.translate(800,960+p.jumpY);ctx.rotate(p.rock);ctx.translate(-800,-960);
  ctx.drawImage(stationary,0,0);
  aligned(()=>{
   rearRibbon(true,reveal,()=>bowPose(p.opening));
   part('lid',reveal,()=>lidPose(p.opening));
   part('body_rear',reveal);part('leaf_rear',reveal);
   movingGlow(p,contents);drawGems(p,contents);energy(p);glints(p);
  });
  drawClosed(p,1-reveal);
  ctx.save();ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(W,H);ctx.lineTo(W,570);ctx.lineTo(1214,571);ctx.lineTo(439.5,649);ctx.lineTo(243,578.5);ctx.lineTo(0,750);ctx.closePath();ctx.clip();ctx.drawImage(stationary,0,0);ctx.restore();
  ctx.restore();
 }
 if(qa){document.getElementById('scrub').value=String(Math.round(ms));document.getElementById('state').textContent=JSON.stringify(state());}
}
function controls(){replay.disabled=!ready||running;replay.textContent=ms>=DURATION?'重新打开':'打开宝箱';hint.textContent=running?'开箱中':ms>=DURATION?'已打开':'点击宝箱激活';canvas.setAttribute('aria-busy',String(running));}
function cancel(){if(raf!==null)cancelAnimationFrame(raf);raf=null;start=null;}
function state(){return {ready,running,ms,...pose(ms),starts,finishes,rafPending:raf!==null,duration:DURATION,bodyScale:1,method:'impact-hop-and-lagged-gems'};}
function seek(value){cancel();running=false;ms=Math.max(0,Math.min(DURATION,Number(value)||0));controls();render();return state();}
function tick(now){raf=null;if(!running)return;if(start===null)start=now-ms;ms=Math.min(DURATION,now-start);if(ms>=DURATION){running=false;finishes++;controls();}render();if(running)raf=requestAnimationFrame(tick);}
function play(){if(!ready||running)return false;cancel();ms=0;starts++;running=true;controls();if(reduced.matches){ms=DURATION;running=false;finishes++;controls();render();}else{render();raf=requestAnimationFrame(tick);}return true;}
const load=url=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('图片加载失败'));img.src=url;});
const readyPromise=Promise.all([load(DATA.first),...Object.entries(DATA.layers).map(async([id,asset])=>{partImages[id]=await load(asset.src);})]).then(([first])=>{
 firstImage=first;
 const poly=[[132,154],[163,128],[172,62],[216,25],[264,20],[305,47],[349,88],[376,68],[399,23],[445,0],[491,0],[528,35],[542,82],[541,111],[575,83],[699,83],[699,199],[674,220],[244,263],[135,224]];
 const path=c=>{c.beginPath();poly.forEach(([x,y],i)=>i?c.lineTo(x*1340/744,y*1340/744+175):c.moveTo(x*1340/744,y*1340/744+175));c.closePath();};
 const c=closedCap.getContext('2d');c.save();path(c);c.clip();c.drawImage(first,0,175,1340,1340*512/744);c.restore();
 const g=stationary.getContext('2d');g.drawImage(first,0,175,1340,1340*512/744);g.save();g.globalCompositeOperation='destination-out';path(g);g.fill();g.restore();
 ready=true;controls();render();if(qa&&query.has('pose'))seek(query.get('pose'));return true;
}).catch(e=>{document.getElementById('error').textContent=e.message;return false;});
canvas.addEventListener('click',play);replay.addEventListener('click',play);

document.getElementById('scrub').addEventListener('input',e=>seek(e.target.value));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)seek(DURATION);});
reduced.addEventListener('change',()=>{if(reduced.matches&&running)seek(DURATION);});

window.chest={ready:readyPromise,activate:play,play,reset:()=>seek(0),seek,state,duration:DURATION};
})();
