*{box-sizing:border-box}html,body{margin:0;background:#101010;color:#f3ece8;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.preview{width:min(960px,100%);margin-inline:auto;padding:12px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:grid;gap:8px;justify-items:center;overflow:clip}

.stage{display:block;border:0;width:100%;height:250px;background:transparent;overflow:hidden}
.status{margin:0;color:#c5aaa4;font-size:12px;text-align:center;line-height:1.5}.status:empty{display:none}
@media(max-width:720px){.stage{height:128px}.preview{padding-top:10px;gap:6px}}

<script>
(()=>{
'use strict';
const frame=document.querySelector('iframe'),buttons=[...document.querySelectorAll('.state')],message=document.querySelector('.status');
const media=matchMedia('(max-width:720px)'),params=new URLSearchParams(location.search);
let state=params.get('state')||(params.get('expired')==='1'?'expired':'pending'),code=params.get('code')||'',mode='',sources=null,observer=null,loading=0;
if(!['pending','redeemed','expired'].includes(state))state='pending';
function selection(){for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.state===state))}
function api(){return frame.contentWindow?.inviteTicket}
function measure(){
 const doc=frame.contentDocument,el=doc?.querySelector('.invite'),ticket=doc?.querySelector('.ticket');if(!el||!ticket)return;
 const phase=el.dataset.phase||'idle',falling=['pending','tearing','centering'].includes(phase),height=ticket.getBoundingClientRect().height;
 frame.style.height=`${Math.ceil(height+8+(falling?(mode==='mobile'?76:138):0))}px`;
}
function sync(){
 const active=api();if(!active)return;const current=active.getState();
 if(current.code)code=current.code;
 if(current.phase==='done'){state='redeemed';selection()}
 measure();
}
async function show(){
 if(!sources)return;const target=media.matches?'mobile':'desktop';if(target===mode)return;
 const current=api()?.getState();if(current?.code)code=current.code;
 if(current?.phase==='done')state='redeemed';
 mode=target;const run=++loading;observer?.disconnect();frame.srcdoc=sources[target];
 frame.onload=()=>{
  function ready(){
   if(run!==loading)return;const active=api();if(!active){frame.contentWindow.requestAnimationFrame(ready);return}
   active.setCode?.(code);active.setState(state);selection();
   observer=new MutationObserver(sync);observer.observe(frame.contentDocument.body,{subtree:true,attributes:true,attributeFilter:['data-phase','data-state','data-expired']});
   frame.contentDocument.addEventListener('input',()=>{code=frame.contentDocument.querySelector('.ticket-input')?.value||''});
   frame.contentWindow.addEventListener('resize',measure);measure();
  }ready();
 };
}
for(const b of buttons)b.addEventListener('click',()=>{state=b.dataset.state;selection();api()?.setState(state);requestAnimationFrame(measure)});
document.querySelector('.replay').addEventListener('click',()=>{state='pending';selection();api()?.replay();requestAnimationFrame(measure)});
media.addEventListener('change',show);window.addEventListener('resize',measure);
async function start(){
 try{
  if(typeof DecompressionStream==='undefined')throw Error('请使用较新版本的 Chrome、Edge 或 Safari 打开此文件');
  const binary=atob(document.getElementById('artwork-package').textContent.trim()),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  sources=JSON.parse(await new Response(stream).text());for(const name of ['desktop','mobile'])sources[name]=sources[name].replace(/__SIPPLAY_ASSET_(\d+)__/g,(_,i)=>sources.images[Number(i)]);await show();
 }catch(error){message.textContent=error.message}
}
window.inviteTicket={setState:s=>{if(['pending','redeemed','expired'].includes(s)){state=s;selection();api()?.setState(s)}},replay:()=>document.querySelector('.replay').click(),getState:()=>api()?.getState()||{state,code,phase:'loading'},getLayout:()=>mode};
selection();start();
})();
</script>
</body>
