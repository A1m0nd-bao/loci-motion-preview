/* During the tear, a continuous mesh bends the printed ticket surface. */
.stub{clip-path:none}.stub img{display:block;width:100%;height:100%;clip-path:url(#stubClip);-webkit-clip-path:url(#stubClip);}
.bend-canvas{position:absolute;left:0;top:0;width:100%;height:auto;display:none;pointer-events:none}
.ticket.tearing .stub{animation:none}.ticket.tearing .stub img{opacity:0}.ticket.tearing .bend-canvas{display:block}.ticket.tearing .paper-edge,.ticket.tearing .paper-bend{display:none}.ticket.torn .stub{opacity:0;transform:none}

.redeem-input{position:absolute;left:3%;top:77.5%;width:70%;height:14%;box-sizing:border-box;border:0;border-radius:3px;padding:0 2.2%;background:#1b1021;color:#f5edf8;font:clamp(7px,1.8vw,11px) sans-serif;z-index:4;outline:none}.redeem-input::placeholder{color:#aa96ab}.redeem-input:focus{box-shadow:0 0 0 1px #c98bc9}
.redeem-button{position:absolute;left:75.62%;top:76.84%;width:21.5%;height:15.44%;border:0;padding:0;background:transparent;cursor:pointer;z-index:4;outline:none;display:flex;align-items:center;justify-content:center}
.redeem-button .redeem-active-svg{width:100%;height:100%;display:block;opacity:0;transform:scale(0.96);transition:opacity .18s cubic-bezier(.2,0,0,1), transform .18s cubic-bezier(.2,0,0,1), filter .18s ease;pointer-events:none}
.redeem-button.active .redeem-active-svg{opacity:1;transform:scale(1);filter:drop-shadow(0 2px 8px rgba(255,255,255,0.22))}
.redeem-button.active:hover .redeem-active-svg{transform:scale(1.02);filter:drop-shadow(0 3px 12px rgba(255,255,255,0.4))}
.redeem-button.active:active .redeem-active-svg{transform:scale(0.97)}

/* Quota SVG Text & Dynamic Animated Slots */

.quota-svg-text tspan#quotaCurrentText{display:inline-block;transform-box:fill-box;transform-origin:center center}

.part.top{pointer-events:none;z-index:2}
.part.top .slot-item{pointer-events:auto;cursor:pointer}
.part.top .quota-text-group{pointer-events:auto;cursor:pointer}
.part.top .slot-hit{pointer-events:auto;cursor:pointer}
.quota-text-group{pointer-events:auto;cursor:pointer;user-select:none;outline:none!important}
.quota-text-group:focus,.quota-text-group:active{outline:none!important}
.quota-svg-text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:10.5px;font-weight:600;fill:#542457;letter-spacing:0.02em;user-select:none;pointer-events:auto;cursor:pointer;outline:none!important;transform-origin:496px 123.5px;transition:opacity .15s ease}
.quota-text-group:hover .quota-svg-text{opacity:0.82}
.quota-num{font-weight:700;transition:fill .2s ease}
.quota-svg-text.pop{animation:num-bounce .36s cubic-bezier(0.34,1.56,0.64,1) both}
@keyframes num-bounce{0%{transform:scale(1)}40%{transform:scale(1.28);fill:#e23b5d}75%{transform:scale(0.95)}100%{transform:scale(1);fill:#542457}}

.slot-groove{fill:#612E61;fill-opacity:0.15;transition:fill-opacity .2s ease}
.slot-item:hover .slot-groove{fill-opacity:0.32}
.slot-bar{fill:url(#trackGrad);transform-box:fill-box;transform-origin:left center;transform:scaleX(0);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(0.34,1.56,0.64,1),opacity .2s ease,filter .25s ease}
.slot-item.active .slot-bar{transform:scaleX(1);opacity:1}
.slot-item.is-head .slot-bar{filter:drop-shadow(0 0 3px rgba(236,90,80,0.85)) drop-shadow(0 0 7px rgba(237,121,237,0.5));animation:head-pulse 2s ease-in-out infinite alternate}
@keyframes head-pulse{0%{filter:drop-shadow(0 0 2px rgba(236,90,80,0.6)) drop-shadow(0 0 4px rgba(237,121,237,0.3))}100%{filter:drop-shadow(0 0 5px rgba(236,90,80,0.95)) drop-shadow(0 0 9px rgba(237,121,237,0.65))}}
.slot-item.surge .slot-bar{animation:slot-surge .42s cubic-bezier(0.34,1.56,0.64,1) both}
@keyframes slot-surge{0%{transform:scaleX(0) scaleY(0.6);opacity:0}55%{transform:scaleX(1.06) scaleY(1.35);opacity:1;filter:drop-shadow(0 0 5px rgba(255,255,255,0.9)) drop-shadow(0 0 8px rgba(236,90,80,0.8))}75%{transform:scaleX(0.98) scaleY(0.94)}100%{transform:scaleX(1) scaleY(1);opacity:1;filter:none}}
.ticket.quota-full .slot-bar{animation:full-shimmer 2.4s ease-in-out infinite alternate}
@keyframes full-shimmer{0%{filter:drop-shadow(0 0 2px rgba(237,121,237,0.4))}100%{filter:drop-shadow(0 0 4px rgba(255,190,120,0.8)) drop-shadow(0 0 8px rgba(236,90,80,0.7))}}

/* Quota Controller Card */
.quota-controller-card{margin-top:20px;padding:16px 20px;background:#18131d;border:1px solid #372c3d;border-radius:16px;text-align:left}
.ctrl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ctrl-title{font-size:12px;font-weight:600;color:#e8daf0;letter-spacing:-0.01em}
.ctrl-badge{font-size:11px;color:#c0a7cc;background:#2b1e32;padding:3px 9px;border-radius:999px;border:1px solid #4a3455}
.ctrl-body{display:flex;flex-direction:column;gap:12px}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row label{font-size:12px;color:#a899ad;white-space:nowrap}
.slider-row input[type=range]{flex:1;accent-color:#d48bd4;cursor:pointer;height:5px;background:#2f2336;border-radius:3px}
.btn-step{width:26px;height:26px;padding:0;border:1px solid #4d3857;background:#24182b;color:#f3d7f7;font-size:14px;border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:all .15s ease}
.btn-step:hover{background:#382544;border-color:#744f83}
.val-pill{font-size:12px;font-weight:600;color:#fcebfd;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.presets-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.presets-label{font-size:11px;color:#8f8094}
.btn-preset{font:inherit;font-size:11px;padding:4px 10px;border:1px solid #3a2d40;background:#1f1724;color:#baa9c0;border-radius:8px;cursor:pointer;transition:all .15s ease}
.btn-preset:hover{background:#32213b;color:#f5ebf8;border-color:#5a3f69}
.btn-preset.active{background:#4b2756;color:#ffeaff;border-color:#9e57ad;font-weight:600}

.copy-code-btn{cursor:pointer;pointer-events:auto;transform-origin:433px 77px;transition:transform .18s cubic-bezier(0.34,1.56,0.64,1),filter .18s ease;user-select:none;outline:none!important;-webkit-tap-highlight-color:transparent!important}
.copy-code-btn:focus,.copy-code-btn:focus-visible,.copy-code-btn:active{outline:none!important;box-shadow:none!important}
.copy-code-btn:hover{filter:drop-shadow(0 4px 14px rgba(236,90,80,0.45));transform:scale(1.02)}
.copy-code-btn:active{transform:scale(0.96)}
.copy-code-btn.copied{filter:drop-shadow(0 4px 16px rgba(78,205,138,0.55))}

.release-downloads{display:flex;justify-content:center;gap:18px;margin-top:24px}
.release-downloads a{font-size:12px;color:#bcb4c5;text-decoration:none;border-bottom:1px solid #51475b;padding-bottom:3px}
.release-downloads a:hover{color:#f5ebf8;border-color:#d48bd4}
.compact body{width:260px;height:220px;min-height:0;padding:0;overflow:hidden;background:transparent}
.compact main{width:260px;height:220px}
.compact h1,.compact .hint,.compact .quota-controller-card,.compact .controls,.compact .status,.compact .note,.compact .release-downloads{display:none}
.compact .stage{width:260px;height:220px;margin:0;border:0;border-radius:0;background:transparent;padding:0;display:grid;place-items:center}
.compact .ticket{transform:scale(0.46);transform-origin:center center}

function draw(t){

  const separation=Math.max(0,n-front);
  const bend=Math.pow(separation,1.55)*(1-.35*release);
  const y=152+66*bend+release*112;
  const h=133*(1-.11*bend);
  ctx.drawImage(
    texture,
    x*dpr, 152*dpr, w*dpr, 133*dpr,
    (x+release*10*n)*dpr, y*dpr, (w+0.35)*dpr, h*dpr

 ctx.globalAlpha=1;
}

function tick(now){if(!start)start=now;const t=Math.min((now-start)/1250,1);draw(t);if(t<1)frame=requestAnimationFrame(tick);else finish()}

function redeemCode(){
  if(ticket.classList.contains('tearing')||ticket.classList.contains('torn'))return;
  tearButton.disabled=true;
  status.textContent='正在撕下副券';
  if(!codeInput.value.trim()){tearButton.disabled=false;status.textContent='请先输入激活码';codeInput.focus();return}
  if(reduced.matches){finish();return}
  if(!textureReady){tearButton.disabled=false;status.textContent='票券正在加载，请稍后再试';return}
  
  prepareTexture();
  tex.fillStyle='#1b1021';
  tex.fillRect(16*dpr,221*dpr,361*dpr,40*dpr);
  tex.fillStyle='#f5edf8';
  const baseFontSize=parseFloat(getComputedStyle(codeInput).fontSize)||10;
  const ticketScale=ticket.getBoundingClientRect().width?(521/ticket.getBoundingClientRect().width):1;
  const codeFont=Math.round(baseFontSize*ticketScale*dpr);
  tex.font=`600 ${codeFont}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
  tex.textBaseline='middle';
  tex.save();
  tex.beginPath();
  tex.rect(23*dpr,221*dpr,345*dpr,40*dpr);
  tex.clip();
  tex.fillText(codeInput.value,27*dpr,241*dpr);
  tex.restore();

  if(codeInput.value.trim()){
    tex.save();
    tex.fillStyle='#ffffff';
    if(tex.roundRect){
      tex.beginPath();
      tex.roundRect(394*dpr,219*dpr,112*dpr,44*dpr,8*dpr);
      tex.fill();
    } else {
      const rx=394*dpr,ry=219*dpr,rw=112*dpr,rh=44*dpr,rad=8*dpr;
      tex.beginPath();
      tex.moveTo(rx+rad,ry);
      tex.arcTo(rx+rw,ry,rx+rw,ry+rh,rad);
      tex.arcTo(rx+rw,ry+rh,rx,ry+rh,rad);
      tex.arcTo(rx,ry+rh,rx,ry,rad);
      tex.arcTo(rx,ry,rx+rw,ry,rad);
      tex.closePath();
      tex.fill();
    }
    tex.translate(394*dpr,219*dpr);
    tex.scale(dpr,dpr);
    tex.fillStyle='#000000';
    tex.fill(redeemPath);
    tex.restore();
  }

  start=0;
  draw(0);
  ticket.classList.add('tearing');
  frame=requestAnimationFrame(tick);
}

codeInput.addEventListener('input',()=>{
  redeem.classList.toggle('active',codeInput.value.trim().length>0);
});
redeem.addEventListener('click',redeemCode);
tearButton.addEventListener('click',redeemCode);
codeInput.addEventListener('keydown',e=>{if(e.key==='Enter')redeemCode()});
document.querySelector('#reset').addEventListener('click',()=>{
  cancelAnimationFrame(frame);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ticket.classList.remove('tearing','torn');
  tearButton.disabled=false;
  codeInput.value='';
  redeem.classList.remove('active');
  status.textContent='输入激活码后点击兑换';
  updateQuota(3);
});

/* Motion-Spec Spring Physics & Quota Logic */
// Standalone Motion.dev Spring Physics Engine (Instant execution, 0 latency, 0 external dependencies)
function createMotionSpring({ stiffness = 320, damping = 25, mass = 0.8, onUpdate, onComplete }) {
  let cur = 0, vel = 0, target = 0, raf = null;
  const w0 = Math.sqrt(stiffness / mass);
  const zeta = damping / (2 * Math.sqrt(stiffness * mass));
  const wd = w0 * Math.sqrt(Math.max(0, 1 - zeta * zeta));

  function animateTo(newTarget, delayMs = 0) {
    if (raf) cancelAnimationFrame(raf);
    target = newTarget;
    const startVal = cur;
    const startVel = vel;
    const startTime = performance.now() + delayMs;

    function tick(now) {
      if (now < startTime) {
        raf = requestAnimationFrame(tick);
        return;
      }
      const t = Math.max(0, (now - startTime) / 1000);
      const delta = target - startVal;
      const decay = Math.exp(-zeta * w0 * t);
      const c1 = -delta;
      const c2 = (startVel + zeta * w0 * (-delta)) / (wd || 0.001);

      cur = target + decay * (c1 * Math.cos(wd * t) + c2 * Math.sin(wd * t));
      vel = decay * (-zeta * w0 * (c1 * Math.cos(wd * t) + c2 * Math.sin(wd * t)) +
        (-c1 * wd * Math.sin(wd * t) + c2 * wd * Math.cos(wd * t)));

      onUpdate(cur);

      if (t > 0.05 && Math.abs(cur - target) < 0.002 && Math.abs(vel) < 0.005) {
        cur = target;
        vel = 0;
        onUpdate(target);
        if (onComplete) onComplete();
      } else {
        raf = requestAnimationFrame(tick);
      }
    }
    raf = requestAnimationFrame(tick);
  }

  return {
    animateTo,
    set: val => {
      if (raf) cancelAnimationFrame(raf);
      cur = val; vel = 0; target = val; onUpdate(val);
    },
    getCurrent: () => cur
  };
}

let currentQuota = 3;
const totalQuota = 10;
const quotaTextGroup = document.getElementById('quotaTextGroup');
const quotaSvgText = document.getElementById('quotaSvgText');
const quotaCurrentText = document.getElementById('quotaCurrentText');
const quotaSlots = document.querySelectorAll('.slot-item');
const quotaRange = document.getElementById('quotaRange');
const valPill = document.getElementById('valPill');
const ctrlStatus = document.getElementById('ctrlStatus');
const presetButtons = document.querySelectorAll('.btn-preset');
const copyCodeBtn = document.getElementById('copyCodeBtn');

// Initialize slot animators using Motion spring solver
const slotAnimators = Array.from(quotaSlots).map((slot, i) => {
  const bar = slot.querySelector('.slot-bar');
  const spring = createMotionSpring({
    stiffness: 320,
    damping: 25,
    mass: 0.8,
    onUpdate: (val) => {
      const s = Math.max(0, Math.min(1.08, val));
      if (s <= 0.002) {
        bar.style.opacity = '0';
        bar.style.transform = 'scaleX(0)';
      } else {
        bar.style.opacity = String(Math.min(1, s * 1.5));
        bar.style.transform = `scaleX(${s})`;
      }
    }
  });

  if (i < currentQuota) {
    spring.set(1);
    slot.classList.add('active');
  } else {
    spring.set(0);
    slot.classList.remove('active');
  }
  return spring;
});

// Dynamic stepped counter with subtle Motion spring pop
let counterTimer = null;
function animateCounter(from, to, durationMs) {
  if (counterTimer) clearInterval(counterTimer);
  if (from === to) {
    if (quotaCurrentText) quotaCurrentText.textContent = to;
    return;
  }
  const steps = Math.abs(to - from);
  const interval = Math.max(24, Math.floor(durationMs / steps));
  let cur = from;
  const dir = to > from ? 1 : -1;

  counterTimer = setInterval(() => {
    cur += dir;
    if (quotaCurrentText) {
      quotaCurrentText.textContent = cur;
      quotaSvgText.classList.remove('pop');
      void quotaSvgText.offsetWidth;
      quotaSvgText.classList.add('pop');
    }
    if (cur === to) {
      clearInterval(counterTimer);
      counterTimer = null;
    }
  }, interval);
}

function updateQuota(val) {
  const target = Math.max(0, Math.min(totalQuota, parseInt(val, 10) || 0));
  const diff = target - currentQuota;
  const prev = currentQuota;
  currentQuota = target;

  if (quotaRange) quotaRange.value = currentQuota;
  if (valPill) valPill.textContent = `${currentQuota} / ${totalQuota}`;
  if (ctrlStatus) {
    ctrlStatus.textContent = currentQuota === totalQuota
      ? '名额已达上限 (10/10)'
      : (currentQuota === 0 ? '名额未开放 (0/10)' : `已用 ${currentQuota} / 总计 ${totalQuota}`);
  }

  ticket.classList.toggle('quota-full', currentQuota === totalQuota);

  const animDuration = Math.min(550, Math.abs(diff) * 45 + 160);
  animateCounter(prev, target, animDuration);

  // Motion Stagger Wave Propagation
  slotAnimators.forEach((animator, i) => {
    const slot = quotaSlots[i];
    slot.classList.toggle('active', i < target);

    let delay = 0;
    if (diff > 0) {
      if (i >= prev && i < target) {
        delay = (i - prev) * 38; // 38ms stagger per slot
      }
    } else if (diff < 0) {
      if (i >= target && i < prev) {
        delay = (prev - 1 - i) * 28; // rapid inward retract
      }
    }

    if (i < target) {
      animator.animateTo(1, delay);
    } else {
      animator.animateTo(0, delay);
    }
  });

  presetButtons.forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.val, 10) === currentQuota);
  });
}

// 1. Click directly on "3 / 10" text -> cycles to next quota count
if (quotaTextGroup) {
  quotaTextGroup.addEventListener('click', (e) => {
    e.stopPropagation();
    const nextVal = currentQuota >= totalQuota ? 0 : currentQuota + 1;
    updateQuota(nextVal);
  });
}

// 2. Click on each slot (with generous 28px hit areas)
quotaSlots.forEach((slot, i) => {
  slot.addEventListener('click', (e) => {
    e.stopPropagation();
    const targetSlot = i + 1;
    if (currentQuota === targetSlot) {
      updateQuota(targetSlot - 1);
    } else {
      updateQuota(targetSlot);
    }
  });
});

// 3. Controller bindings
if (quotaRange) {
  quotaRange.addEventListener('input', e => updateQuota(e.target.value));
}
const btnMinus = document.getElementById('stepMinus');
if (btnMinus) {
  btnMinus.addEventListener('click', () => updateQuota(currentQuota - 1));
}
const btnPlus = document.getElementById('stepPlus');
if (btnPlus) {
  btnPlus.addEventListener('click', () => updateQuota(currentQuota + 1));
}
presetButtons.forEach(btn => {
  btn.addEventListener('click', () => updateQuota(btn.dataset.val));
});

// 4. Copy Code Button: No black box outline, reliable clipboard copy + fallback
if (copyCodeBtn) {
  copyCodeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const code = '320146';

    // Reliable clipboard copy
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).catch(() => fallbackCopy(code));
    } else {
      fallbackCopy(code);
    }

    function fallbackCopy(str) {
      try {
        const ta = document.createElement('textarea');
        ta.value = str;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch(err) {}
    }

    copyCodeBtn.classList.add('copied');
    if (status) status.textContent = '邀请码已复制：' + code;

    setTimeout(() => {
      copyCodeBtn.classList.remove('copied');
      if (status && status.textContent.includes('邀请码已复制')) {
        status.textContent = '输入激活码后点击兑换';
      }
    }, 1600);
  });
}
