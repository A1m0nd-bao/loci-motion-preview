<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>if(new URLSearchParams(location.search).has("compact"))document.documentElement.classList.add("compact");</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reward Celebration - Backglow Enrichment v1</title>
  <style>
    :root {
      --bg-dark: #0A0C13;
      --panel-bg: rgba(18, 22, 34, 0.92);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent-pink: #FF3B70;
      --accent-blue: #3A86FF;
      --text-white: #FFFFFF;
      --text-dim: #8E9BAE;

      /* ===== Backglow tunables (visual QA knobs) ===== */
      --glow-ambient-entry: 1.1s;
      --glow-ambient-breathe: 3.6s;
      --glow-ambient-core-op-min: 0.55;
      --glow-ambient-core-op-max: 0.92;
      --glow-ambient-mid-op-min: 0.70;
      --glow-ambient-mid-op-max: 0.95;
      --glow-ambient-outer-op-min: 0.35;
      --glow-ambient-outer-op-max: 0.62;
      --glow-ambient-core-scale-min: 0.90;
      --glow-ambient-core-scale-max: 1.06;
      --glow-ambient-mid-scale-min: 0.94;
      --glow-ambient-mid-scale-max: 1.04;
      --glow-ambient-outer-scale-min: 0.96;
      --glow-ambient-outer-scale-max: 1.08;
      --glow-ray-op-min: 0.62;
      --glow-ray-op-max: 0.96;
      --glow-ray-scale-y-min: 0.94;
      --glow-ray-scale-y-max: 1.08;
      --glow-pedestal-op-min: 0.78;
      --glow-pedestal-op-max: 0.98;
      --glow-pedestal-scale-min: 0.94;
      --glow-pedestal-scale-max: 1.05;
      --glow-drift-px: 3.2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 主舞台容器：精准锁定 644x644 原生画布 */
    .stage-container {
      width: min(90vw, 644px);
      height: min(90vw, 644px);
      max-height: 82vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    svg.reward-stage {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    /* =========================================================
       1. 背景圆光 — 三层错相呼吸 + 柔和外晕流动
       保留原 Lottie 亮起扩张语义；常态改为多层有机变化
       ========================================================= */
    .ambient-glow-stack {
      transform-box: view-box;
      transform-origin: 322px 322px;
      pointer-events: none;
    }
    .ambient-round-glow {
      transform-box: view-box;
      transform-origin: 322px 322px;
      will-change: transform, opacity;
    }
    .animate .ambient-layer-core {
      animation: ambientCoreEntry var(--glow-ambient-entry) cubic-bezier(0.16, 1, 0.3, 1) both,
                 ambientCoreBreathe var(--glow-ambient-breathe) ease-in-out var(--glow-ambient-entry) infinite;
    }
    .animate .ambient-layer-mid {
      animation: ambientMidEntry calc(var(--glow-ambient-entry) * 1.05) cubic-bezier(0.16, 1, 0.3, 1) 0.05s both,
                 ambientMidBreathe calc(var(--glow-ambient-breathe) * 1.12) ease-in-out calc(var(--glow-ambient-entry) + 0.12s) infinite;
    }
    .animate .ambient-layer-outer {
      animation: ambientOuterEntry calc(var(--glow-ambient-entry) * 1.15) cubic-bezier(0.16, 1, 0.3, 1) 0.08s both,
                 ambientOuterBreathe calc(var(--glow-ambient-breathe) * 1.28) ease-in-out calc(var(--glow-ambient-entry) + 0.2s) infinite;
    }
    @keyframes ambientCoreEntry {
      0% { opacity: 0; transform: scale(0.18); }
      60% { opacity: 0.96; transform: scale(1.04); }
      100% { opacity: var(--glow-ambient-core-op-max); transform: scale(1.0); }
    }
    @keyframes ambientMidEntry {
      0% { opacity: 0; transform: scale(0.14); }
      65% { opacity: 0.94; transform: scale(1.03); }
      100% { opacity: var(--glow-ambient-mid-op-max); transform: scale(1.0); }
    }
    @keyframes ambientOuterEntry {
      0% { opacity: 0; transform: scale(0.12) rotate(0deg); }
      70% { opacity: 0.7; transform: scale(1.05) rotate(4deg); }
      100% { opacity: var(--glow-ambient-outer-op-max); transform: scale(1.0) rotate(0deg); }
    }
    @keyframes ambientCoreBreathe {
      0%, 100% {
        opacity: var(--glow-ambient-core-op-min);
        transform: scale(var(--glow-ambient-core-scale-min));
      }
      45% {
        opacity: var(--glow-ambient-core-op-max);
        transform: scale(var(--glow-ambient-core-scale-max));
      }
      72% {
        opacity: calc((var(--glow-ambient-core-op-min) + var(--glow-ambient-core-op-max)) / 2);
        transform: scale(1.01);
      }
    }
    @keyframes ambientMidBreathe {
      0%, 100% {
        opacity: var(--glow-ambient-mid-op-min);
        transform: scale(var(--glow-ambient-mid-scale-min));
      }
      50% {
        opacity: var(--glow-ambient-mid-op-max);
        transform: scale(var(--glow-ambient-mid-scale-max));
      }
    }
    @keyframes ambientOuterBreathe {
      0%, 100% {
        opacity: var(--glow-ambient-outer-op-min);
        transform: scale(var(--glow-ambient-outer-scale-min)) rotate(-3deg);
      }
      33% {
        opacity: calc(var(--glow-ambient-outer-op-max) * 0.92);
        transform: scale(1.03) rotate(2deg);
      }
      66% {
        opacity: var(--glow-ambient-outer-op-max);
        transform: scale(var(--glow-ambient-outer-scale-max)) rotate(-1.5deg);
      }
    }

    /* 顶部标题 "Rewards Claimed" */
    .title-group {
      transform-box: fill-box;
      transform-origin: center center;
    }
    .animate .title-group {
      animation: titleDropIn 0.48s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes titleDropIn {
      0% { opacity: 0; transform: translateY(-16px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1.0); }
    }

    /* =========================================================
       2. 宝石本体入场 (对应 Lottie「亮起」宝石 3~15帧: 77.2% -> 100%)
       ========================================================= */
    .gem-entity {
      transform-box: fill-box;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }
    .animate .gem-entity {
      animation: gemLottieEntry 0.34s cubic-bezier(0.18, 0.92, 0.32, 1.22) 0.06s both;
    }
    @keyframes gemLottieEntry {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.77);
      }
      70% {
        opacity: 1;
        transform: translateY(-2px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1.0);
      }
    }

    /* 底座光斑：双层错相呼吸，更贴合暖光起伏 */
    .base-pedestal {
      transform-box: fill-box;
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .base-pedestal.pedestal-soft {
      animation: pedestalSoftBreathe 3.24s ease-in-out infinite;
    }
    .base-pedestal.pedestal-core {
      animation: pedestalCoreBreathe 2.7s ease-in-out 0.90s infinite;
    }
    /* 兼容旧 class-only 路径 */
    .base-pedestal:not(.pedestal-soft):not(.pedestal-core) {
      animation: pedestalCoreBreathe 2.7s ease-in-out infinite;
    }
    @keyframes pedestalSoftBreathe {
      0%, 100% {
        opacity: calc(var(--glow-pedestal-op-min) * 0.92);
        transform: scale(var(--glow-pedestal-scale-min));
      }
      56% {
        opacity: var(--glow-pedestal-op-max);
        transform: scale(calc(var(--glow-pedestal-scale-max) * 1.02));
      }
    }
    @keyframes pedestalCoreBreathe {
      0%, 100% {
        opacity: var(--glow-pedestal-op-min);
        transform: scale(calc(var(--glow-pedestal-scale-min) + 0.01));
      }
      48% {
        opacity: var(--glow-pedestal-op-max);
        transform: scale(var(--glow-pedestal-scale-max));
      }
      78% {
        opacity: calc((var(--glow-pedestal-op-min) + var(--glow-pedestal-op-max)) / 2);
        transform: scale(1.01);
      }
    }

    /* =========================================================
       3. 射线：入场后接续错相浮动（修复原 .animate 盖掉常态浮动）
       加入轻微 scaleY 脉动，模拟光束有机流动，避免闪白
       ========================================================= */
    .authentic-ray {
      transform-box: fill-box;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }
    .ray-1 { animation: rayFloat1 2.7s ease-in-out 1.05s infinite; }
    .ray-2 { animation: rayFloat2 2.7s ease-in-out 1.35s infinite; }
    .ray-3 { animation: rayFloat3 2.7s ease-in-out 1.65s infinite; }
    .ray-4 { animation: rayFloat4 2.7s ease-in-out 1.95s infinite; }
    .ray-5 { animation: rayFloat5 2.7s ease-in-out 2.25s infinite; }

    .animate .authentic-ray.ray-1 {
      animation: rayEntry 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.38s both,
                 rayFloat1 2.7s ease-in-out 1.05s infinite;
    }
    .animate .authentic-ray.ray-2 {
      animation: rayEntry 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.42s both,
                 rayFloat2 2.7s ease-in-out 1.35s infinite;
    }
    .animate .authentic-ray.ray-3 {
      animation: rayEntry 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both,
                 rayFloat3 2.7s ease-in-out 1.65s infinite;
    }
    .animate .authentic-ray.ray-4 {
      animation: rayEntry 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.44s both,
                 rayFloat4 2.7s ease-in-out 1.95s infinite;
    }
    .animate .authentic-ray.ray-5 {
      animation: rayEntry 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.46s both,
                 rayFloat5 2.7s ease-in-out 2.25s infinite;
    }
    @keyframes rayEntry {
      0% { opacity: 0; transform: scaleY(0.4) scaleX(0.96); }
      100% { opacity: 0.88; transform: scaleY(1.0) scaleX(1.0); }
    }
    @keyframes rayFloat1 {
      0%, 100% {
        transform: translate(0, 0) scaleY(var(--glow-ray-scale-y-min)) scaleX(1);
        opacity: var(--glow-ray-op-min);
      }
      46% {
        transform: translate(calc(var(--glow-drift-px) * -1.1), calc(var(--glow-drift-px) * -0.7)) scaleY(var(--glow-ray-scale-y-max)) scaleX(1.03);
        opacity: var(--glow-ray-op-max);
      }
      74% {
        transform: translate(calc(var(--glow-drift-px) * -0.4), calc(var(--glow-drift-px) * -0.35)) scaleY(1.01) scaleX(0.99);
        opacity: calc((var(--glow-ray-op-min) + var(--glow-ray-op-max)) / 2);
      }
    }
    @keyframes rayFloat2 {
      0%, 100% {
        transform: translate(0, 0) scaleY(var(--glow-ray-scale-y-min)) scaleX(1);
        opacity: calc(var(--glow-ray-op-min) + 0.04);
      }
      50% {
        transform: translate(calc(var(--glow-drift-px) * -0.65), calc(var(--glow-drift-px) * -1.05)) scaleY(calc(var(--glow-ray-scale-y-max) * 0.98)) scaleX(1.02);
        opacity: var(--glow-ray-op-max);
      }
    }
    @keyframes rayFloat3 {
      0%, 100% {
        transform: translate(0, 0) scaleY(0.96) scaleX(1);
        opacity: calc(var(--glow-ray-op-min) + 0.06);
      }
      54% {
        transform: translate(0, calc(var(--glow-drift-px) * -1.25)) scaleY(var(--glow-ray-scale-y-max)) scaleX(1.01);
        opacity: var(--glow-ray-op-max);
      }
    }
    @keyframes rayFloat4 {
      0%, 100% {
        transform: translate(0, 0) scaleY(var(--glow-ray-scale-y-min)) scaleX(1);
        opacity: calc(var(--glow-ray-op-min) + 0.04);
      }
      48% {
        transform: translate(calc(var(--glow-drift-px) * 0.7), calc(var(--glow-drift-px) * -1.0)) scaleY(calc(var(--glow-ray-scale-y-max) * 0.99)) scaleX(1.02);
        opacity: var(--glow-ray-op-max);
      }
    }
    @keyframes rayFloat5 {
      0%, 100% {
        transform: translate(0, 0) scaleY(var(--glow-ray-scale-y-min)) scaleX(1);
        opacity: var(--glow-ray-op-min);
      }
      44% {
        transform: translate(calc(var(--glow-drift-px) * 1.1), calc(var(--glow-drift-px) * -0.7)) scaleY(var(--glow-ray-scale-y-max)) scaleX(1.03);
        opacity: var(--glow-ray-op-max);
      }
      78% {
        transform: translate(calc(var(--glow-drift-px) * 0.45), calc(var(--glow-drift-px) * -0.3)) scaleY(1.02) scaleX(0.99);
        opacity: calc((var(--glow-ray-op-min) + var(--glow-ray-op-max)) / 2);
      }
    }

    /* =========================================================
       4. 前层星芒：入场后接续错相明灭（同样修复被 entry 覆盖）
       ========================================================= */
    .diamond-star {
      transform-box: fill-box;
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .star-1 { animation: starTwinkle1 2.6s ease-in-out 0.9s infinite; }
    .star-2 { animation: starTwinkle2 3.0s ease-in-out 1.1s infinite; }
    .star-3 { animation: starTwinkle3 2.8s ease-in-out 1.3s infinite; }
    .star-big-1 { animation: bigStarBurst1 2.5s ease-in-out 0.9s infinite; }
    .star-big-2 { animation: bigStarBurst2 2.9s ease-in-out 1.2s infinite; }

    .animate .diamond-star.star-1 {
      animation: starEntry 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both,
                 starTwinkle1 2.6s ease-in-out 0.95s infinite;
    }
    .animate .diamond-star.star-2 {
      animation: starEntry 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both,
                 starTwinkle2 3.0s ease-in-out 1.1s infinite;
    }
    .animate .diamond-star.star-3 {
      animation: starEntry 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both,
                 starTwinkle3 2.8s ease-in-out 1.25s infinite;
    }
    .animate .diamond-star.star-big-1 {
      animation: starEntry 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both,
                 bigStarBurst1 2.5s ease-in-out 0.95s infinite;
    }
    .animate .diamond-star.star-big-2 {
      animation: starEntry 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.42s both,
                 bigStarBurst2 2.9s ease-in-out 1.15s infinite;
    }
    @keyframes starEntry {
      0% { opacity: 0; transform: scale(0.2); }
      70% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.92; transform: scale(1.0); }
    }
    @keyframes starTwinkle1 {
      0%, 100% { opacity: 0.35; transform: scale(0.92); }
      50% { opacity: 1.0; transform: scale(1.08); }
    }
    @keyframes starTwinkle2 {
      0%, 100% { opacity: 1.0; transform: scale(1.08); }
      50% { opacity: 0.30; transform: scale(0.90); }
    }
    @keyframes starTwinkle3 {
      0%, 100% { opacity: 0.40; transform: scale(0.94); }
      50% { opacity: 1.0; transform: scale(1.12); }
    }
    @keyframes bigStarBurst1 {
      0%, 100% { opacity: 0.45; transform: scale(0.95); }
      50% { opacity: 1.0; transform: scale(1.15); }
    }
    @keyframes bigStarBurst2 {
      0%, 100% { opacity: 1.0; transform: scale(1.15); }
      50% { opacity: 0.40; transform: scale(0.95); }
    }

    /* 隐藏 / 卸载暂停背光动画（JS 切换 .glow-paused） */
    .glow-paused .ambient-round-glow,
    .glow-paused .authentic-ray,
    .glow-paused .base-pedestal,
    .glow-paused .diamond-star,
    .glow-paused .gem-entity,
    .glow-paused .title-group,
    .glow-paused .reward-value-group {
      animation-play-state: paused !important;
    }

    /* reduced-motion：保留静态可见背光，去掉持续动画 */
    @media (prefers-reduced-motion: reduce) {
      .animate .ambient-layer-core,
      .animate .ambient-layer-mid,
      .animate .ambient-layer-outer,
      .animate .authentic-ray.ray-1,
      .animate .authentic-ray.ray-2,
      .animate .authentic-ray.ray-3,
      .animate .authentic-ray.ray-4,
      .animate .authentic-ray.ray-5,
      .ray-1, .ray-2, .ray-3, .ray-4, .ray-5,
      .base-pedestal,
      .base-pedestal.pedestal-soft,
      .base-pedestal.pedestal-core,
      .animate .diamond-star.star-1,
      .animate .diamond-star.star-2,
      .animate .diamond-star.star-3,
      .animate .diamond-star.star-big-1,
      .animate .diamond-star.star-big-2,
      .star-1, .star-2, .star-3, .star-big-1, .star-big-2,
      .animate .gem-entity,
      .animate .title-group,
      .animate .reward-value-group {
        animation: none !important;
      }
      .ambient-layer-core { opacity: 0.85; transform: scale(1); }
      .ambient-layer-mid { opacity: 0.88; transform: scale(1); }
      .ambient-layer-outer { opacity: 0.48; transform: scale(1); }
      .authentic-ray { opacity: 0.82; transform: none; }
      .base-pedestal { opacity: 0.9; transform: none; }
      .diamond-star { opacity: 0.75; transform: none; }
      .gem-entity, .title-group, .reward-value-group { opacity: 1; transform: none; }
    }

    /* 奖励数值弹出 (精准定位在宝石下方) */
    .reward-value-group {
      transform-box: fill-box;
      transform-origin: center center;
    }
    .animate .reward-value-group {
      animation: valuePopIn 0.44s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both;
    }
    @keyframes valuePopIn {
      0% { opacity: 0; transform: translateY(12px) scale(0.85); }
      100% { opacity: 1; transform: translateY(0) scale(1.0); }
    }

    /* 极简底部悬浮控制栏 (仅保留红蓝宝石数量输入与重播按键) */
    .control-panel {
      position: fixed;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .input-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-item label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot-ruby {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-pink);
    }
    .dot-sapph {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-blue);
    }

    .input-item input {
      width: 72px;
      padding: 6px 10px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-white);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: all 0.2s;
    }
    .input-item input:focus {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.6);
    }

    .btn-replay {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 18px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #FF3B70, #FF6584);
      color: #FFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 59, 112, 0.35);
      transition: all 0.2s;
    }
    .btn-replay:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(255, 59, 112, 0.5);
    }
    .btn-replay:active {
      transform: translateY(1px);
    }
  
    /* v2 iframe compact preview adaptation & download nav */
    .release-downloads {
      position: fixed;
      bottom: 84px;
      display: flex;
      justify-content: center;
      gap: 18px;
      z-index: 90;
    }
    .release-downloads a {
      font-size: 12px;
      color: #bcb4c5;
      text-decoration: none;
      border-bottom: 1px solid #51475b;
      padding-bottom: 3px;
      transition: all 0.2s ease;
    }
    .release-downloads a:hover {
      color: #f5ebf8;
      border-color: #d48bd4;
    }
    .compact body {
      width: 644px;
      height: 644px;
      min-height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .compact .control-panel,
    .compact .release-downloads {
      display: none !important;
    }
    .compact .stage-container {
      width: 644px;
      height: 644px;
      max-height: none;
      margin: 0;
      padding: 0;
      cursor: default;
    }

  </style>
</head>
<body>

  <!-- 主舞台容器 -->
  <div class="stage-container animate" id="stageContainer" title="点击任意空白区域重新播放动效">
    <svg class="reward-stage" id="rewardStage" viewBox="0 0 644 644" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <!-- 1. 背景多层圆光：核心 / 中层(原) / 外晕，纯矢量无新图 -->
        <radialGradient id="ambient-radial-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(322 322) rotate(90) scale(170)">
          <stop offset="0" stop-color="#FFE6C2" stop-opacity="0.72"/>
          <stop offset="0.45" stop-color="#FFDAA2" stop-opacity="0.38"/>
          <stop offset="1" stop-color="#FFDAA2" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ambient-radial-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(322 322) rotate(90) scale(280)">
          <stop offset="0" stop-color="#FFDAA2" stop-opacity="0.60"/>
          <stop offset="0.2" stop-color="#FFDAA2" stop-opacity="0.50"/>
          <stop offset="0.75" stop-color="#FFDAA2" stop-opacity="0.15"/>
          <stop offset="1" stop-color="#ED78F4" stop-opacity="0.06"/>
        </radialGradient>
        <radialGradient id="ambient-radial-outer" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(322 338) rotate(90) scale(330 300)">
          <stop offset="0" stop-color="#FFD0B8" stop-opacity="0.18"/>
          <stop offset="0.55" stop-color="#E89AF0" stop-opacity="0.10"/>
          <stop offset="1" stop-color="#7AA7FF" stop-opacity="0"/>
        </radialGradient>
        <filter id="ambient-glow-blur" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="22"/>
        </filter>
        <filter id="ambient-core-blur" x="-30%" y="-30%" width="160%" height="160%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
        <filter id="ambient-outer-blur" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="28"/>
        </filter>

        <!-- 2. 底座柔光渐变 (与矢量母稿一致) -->
        <linearGradient id="pedestal-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFC297"/>
          <stop offset="1" stop-color="#DEEFFF"/>
        </linearGradient>

        <!-- 3. 5条专属放射光柱渐变 (由尖端至根部流动，完全杜绝漂移) -->
        <linearGradient id="ray-grad-1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F9C494"/>
          <stop offset="1" stop-color="#FCEFB8"/>
        </linearGradient>

        <linearGradient id="ray-grad-2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F0E2A4"/>
          <stop offset="1" stop-color="#FF995E" stop-opacity="0.7"/>
        </linearGradient>

        <linearGradient id="ray-grad-3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F0E2A4"/>
          <stop offset="1" stop-color="#FFAE5E" stop-opacity="0.7"/>
        </linearGradient>

        <linearGradient id="ray-grad-4" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFC851" stop-opacity="0.7"/>
          <stop offset="1" stop-color="#FFD0A1"/>
        </linearGradient>

        <linearGradient id="ray-grad-5" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFC981" stop-opacity="0.7"/>
          <stop offset="1" stop-color="#FBFF88"/>
        </linearGradient>

        <!-- 4. 高斯模糊与高光滤镜 -->
        <filter id="pedestal-blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="16"/>
        </filter>

        <filter id="ray-blur" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.4"/>
        </filter>

        <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#FFF9D2" flood-opacity="0.9"/>
          <feGaussianBlur stdDeviation="0.25"/>
        </filter>
        <!-- v7: only the two <200 small-art kits use this tighter local blur. -->
        <filter id="small-pedestal-blur" x="-100%" y="-150%" width="300%" height="400%">
          <feGaussianBlur stdDeviation="5.5"/>
        </filter>
      </defs>

      <!-- 0. 多层背景圆光：外晕 → 中层原光 → 核心暖光 -->
      <g class="ambient-glow-stack" aria-hidden="true">
        <g class="ambient-round-glow ambient-layer-outer" filter="url(#ambient-outer-blur)">
          <ellipse cx="322" cy="338" rx="330" ry="300" fill="url(#ambient-radial-outer)"/>
        </g>
        <g class="ambient-round-glow ambient-layer-mid" filter="url(#ambient-glow-blur)">
          <circle cx="322" cy="322" r="280" fill="url(#ambient-radial-glow)"/>
        </g>
        <g class="ambient-round-glow ambient-layer-core" filter="url(#ambient-core-blur)">
          <circle cx="322" cy="322" r="170" fill="url(#ambient-radial-core)"/>
        </g>
      </g>

      <!-- 顶部标题 "Rewards Claimed" -->
      <g class="title-group">
        <text x="322" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Rewards Claimed</text>
      </g>

      <!-- 双奖励模式编组 -->
      <g id="dualModeGroup">
        <!-- 左侧族群 (红宝石) -->
        <g class="reward-cluster cluster-left">
          <g id="leftBloomAnim"></g>
          <image id="rubyImg" class="gem-entity" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
          <g id="leftStarsAnim"></g>
        </g>
        <g class="reward-value-group">
          <text id="rubyAmountText" x="219" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">+100</text>
        </g>

        <!-- 右侧族群 (蓝宝石) -->
        <g class="reward-cluster cluster-right">
          <g id="rightBloomAnim"></g>
          <image id="sapphImg" class="gem-entity" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
          <g id="rightStarsAnim"></g>
        </g>
        <g class="reward-value-group">
          <text id="sapphAmountText" x="430" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">+50</text>
        </g>
      </g>

      <!-- 单奖励居中模式编组 -->
      <g id="singleModeGroup" style="display: none;">
        <g class="reward-cluster cluster-center">
          <g id="centerBloomAnim"></g>
          <image id="singleImg" class="gem-entity" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
          <g id="centerStarsAnim"></g>
        </g>
        <g class="reward-value-group">
          <text id="singleAmountText" x="322" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">+1300</text>
        </g>
      </g>
    </svg>
  </div>

  <!-- 底部极简控制栏 (仅保留红蓝宝石输入与重播按键) -->
  <div class="control-panel">
    <div class="input-item">
      <label><span class="dot-ruby"></span>红宝石</label>
      <input type="number" id="rubyInput" value="100" min="0" max="9999" step="50">
    </div>
    <div class="input-item">
      <label><span class="dot-sapph"></span>蓝宝石</label>
      <input type="number" id="sapphInput" value="50" min="0" max="9999" step="50">
    </div>
    <button class="btn-replay" id="replayBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      重播动效
    </button>
  </div>

    // 坐标变换：根据 displayW / rw 将归一化矢量路径平移并缩放到 stage 坐标
    function transformPath(d, cx, baseY, scale) {
      return d.replace(/([MLHVCSQTAZmlhvcsqtaz])([^MLHVCSQTAZmlhvcsqtaz]*)/g, (match, cmd, args) => {
        const nums = args.trim().split(/[\s,]+/).filter(x => x.length > 0).map(Number);
        if (nums.length === 0) return cmd;
        let res = cmd;
        for (let i = 0; i < nums.length; i += 2) {
          const x = cx + nums[i] * scale;
          const y = baseY + nums[i + 1] * scale;
          res += (i === 0 ? '' : ' ') + x.toFixed(2) + ' ' + y.toFixed(2);
        }
        return res;
      });
    }

    // v7: local adaptation for ruby_small / sapph_small only; all large kits
    // continue through the original renderBackBloomSVG implementation below.
    function renderSmallBackBloomSVG(kitKey, cx, baseY, scale) {
      const kit = modelKits[kitKey];
      // Reuse the two existing soft-light paths. Center their old lobe at the
      // gem's middle (0,-26), rather than retaining its oversized lateral span.
      const compactBase = d => {
        let coordinate = 0;
        const compact = d.replace(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi, value => {
          const n = Number(value);
          const mapped = coordinate++ % 2 === 0 ? (n - 12.244) * 0.50 : -26 + (n + 31.023) * 0.58;
          return mapped.toFixed(4);
        });
        return transformPath(compact, cx, baseY, scale);
      };
      let svg = '<g class="small-gem-backglow" data-kit="' + kitKey +
        '" style="--glow-drift-px:1.25px;--glow-ray-scale-y-min:0.98;--glow-ray-scale-y-max:1.035">';
      if (kit.base && kit.base.length >= 2) {
        svg += '<g opacity="0.34">' +
          '<path class="base-pedestal pedestal-soft" d="' + compactBase(kit.base[1]) + '" fill="#EEA786" filter="url(#small-pedestal-blur)"/>' +
          '<path class="base-pedestal pedestal-core" d="' + compactBase(kit.base[0]) + '" fill="url(#pedestal-grad)" fill-opacity="0.8" filter="url(#small-pedestal-blur)"/></g>';
      }
      svg += '<g opacity="0.48">';
      // Three of the existing five triangles; keep their root edges, pull only
      // the tips halfway back toward their own roots. No new ray artwork.
      [0, 2, 4].forEach(idx => {
        if (!kit.rays || !kit.rays[idx]) return;
        const n = kit.rays[idx].match(/-?\d*\.?\d+/g).map(Number);
        const rootX = (n[2] + n[4]) / 2, rootY = (n[3] + n[5]) / 2;
        const tipX = rootX + (n[0] - rootX) * 0.52;
        const tipY = rootY + (n[1] - rootY) * 0.52;
        const path = 'M' + tipX.toFixed(4) + ' ' + tipY.toFixed(4) +
          'L' + n[2] + ' ' + n[3] + 'L' + n[4] + ' ' + n[5] + 'Z';
        svg += '<path class="authentic-ray ray-' + (idx + 1) + '" d="' + transformPath(path, cx, baseY, scale) +
          '" fill="url(#ray-grad-' + (idx + 1) + ')" filter="url(#ray-blur)"/>';
      });
      return svg + '</g></g>';
    }

    // 后层光效生成：严格根据母稿中的专属底座柔光和放射射线
    function renderBackBloomSVG(kitKey, cx, baseY, scale) {
      const kit = modelKits[kitKey];
      if (!kit) return '';
      if (kitKey === 'ruby_small' || kitKey === 'sapph_small') return renderSmallBackBloomSVG(kitKey, cx, baseY, scale);

      let svg = '';

      // 1. 底座柔光 (两层：层1粉橙柔光，层2渐变聚光)
      if (kit.base && kit.base.length >= 2) {
        const b1 = transformPath(kit.base[1], cx, baseY, scale);
        const b0 = transformPath(kit.base[0], cx, baseY, scale);
        svg += `
          <path class="base-pedestal pedestal-soft" d="${b1}" fill="#EEA786" filter="url(#pedestal-blur)"/>
          <path class="base-pedestal pedestal-core" d="${b0}" fill="url(#pedestal-grad)" fill-opacity="0.8" filter="url(#pedestal-blur)"/>
        `;
      }

      // 2. 放射光柱：宝箱无射线，晶石堆和福袋使用母稿专属射线 (带Lottie灵动微动效)
      const rayGradients = ['#ray-grad-1', '#ray-grad-2', '#ray-grad-3', '#ray-grad-4', '#ray-grad-5'];
      if (kit.rays && kit.rays.length > 0) {
        kit.rays.forEach((rPath, idx) => {
          const shiftedRay = transformPath(rPath, cx, baseY, scale);
          const grad = rayGradients[idx % rayGradients.length];
          svg += `<path class="authentic-ray ray-${idx+1}" d="${shiftedRay}" fill="url(${grad})" filter="url(#ray-blur)"/>`;
        });
      }

      return svg;
    }

    // 前层星芒生成：置于宝石前面，严格匹配母稿小元素位置
    function renderFrontStarsSVG(kitKey, cx, baseY, scale) {
      const kit = modelKits[kitKey];
      if (!kit || !kit.stars) return '';

      let svg = '';
      kit.stars.forEach((sD, idx) => {
        const shiftedStar = transformPath(sD, cx, baseY, scale);
        const isBigStar = (kitKey.includes('pouch') && (idx === 0 || idx === 1));
        const cls = isBigStar ? `star-big-${idx+1}` : `star-${idx+1}`;
        svg += `<path class="diamond-star ${cls}" d="${shiftedStar}" fill="#FDFDF9" filter="url(#star-glow)"/>`;
      });
      return svg;
    }

    // 宝石模型阶梯定义 (完全还原母稿原生优雅尺寸，杜绝超标巨大化；包含 200 以下小红宝石 ruby_1)
    function getRubyModel(val) {
      if (val <= 0) return null;
      if (val < 200) {
        // 红色 200 以下使用小红宝石堆 ruby_1
        return { name: 'ruby_1', kit: 'ruby_small', targetW: 105 };
      }
      if (val < 500) {
        return { name: 'ruby_2', kit: 'ruby_pile', targetW: 135 };
      }
      if (val < 1300) {
        return { name: 'ruby_4', kit: 'ruby_pouch', targetW: 130 };
      }
      return { name: 'ruby_6', kit: 'ruby_chest', targetW: 180 };
    }

    function getSapphModel(val) {
      if (val <= 0) return null;
      if (val < 200) {
        // 蓝色 200 以下使用小蓝宝石堆 sapph_1
        return { name: 'sapph_1', kit: 'sapph_small', targetW: 96 };
      }
      if (val < 500) {
        return { name: 'sapph_2', kit: 'sapph_pile', targetW: 130 };
      }
      return { name: 'sapph_pouch', kit: 'sapph_pouch', targetW: 130 };
    }

    // v8: measured from the unchanged embedded PNG alpha channels (A > 0).
    // Bounds are pixel edges [left, top, right, bottom], not pixel centers.
    const GEM_ALPHA_GEOMETRY = {"ruby_1":{"width":224,"height":120,"alphaBounds":[0,0,224,120]},"ruby_2":{"width":254,"height":151,"alphaBounds":[0,0,254,151]},"ruby_4":{"width":260,"height":243,"alphaBounds":[0,0,260,243]},"ruby_6":{"width":324,"height":266,"alphaBounds":[0,0,324,266]},"sapph_1":{"width":169,"height":104,"alphaBounds":[0,0,169,104]},"sapph_2":{"width":204,"height":119,"alphaBounds":[0,0,204,119]},"sapph_pouch":{"width":260,"height":258,"alphaBounds":[0,0,260,258]}};
    function getGemPlacement(model, cx, baseline) {
      const kit = modelKits[model.kit], png = GEM_ALPHA_GEOMETRY[model.name];
      const width = model.targetW, scale = width / kit.rw;
      const height = kit.rh * scale;
      const meet = Math.min(width / png.width, height / png.height);
      const contentTop = (height - png.height * meet) / 2;
      const alphaBottomInViewport = contentTop + png.alphaBounds[3] * meet;
      const y = baseline - alphaBottomInViewport;
      const previousY = Math.round(baseline - height);
      // Move existing backlight and front sparkles by exactly the image correction;
      // preserve their v7 relative anchors, shapes, timing and small-art treatment.
      return { x: Math.round(cx - width / 2), y, width, height, scale,
        deltaY: y - previousY, lightBaseY: baseline + y - previousY };
    }

    // 锚点与基准线定义：完全贴合设计母稿比例与位置
    const CX_LEFT = 219;
    const CX_RIGHT = 430;
    const CX_CENTER = 322;
    const Y_BASE = 354;

    // DOM 元素引用
    const stageContainer = document.getElementById('stageContainer');
    const dualModeGroup = document.getElementById('dualModeGroup');
    const singleModeGroup = document.getElementById('singleModeGroup');

    const leftBloomAnim = document.getElementById('leftBloomAnim');
    const leftStarsAnim = document.getElementById('leftStarsAnim');
    const rubyImg = document.getElementById('rubyImg');
    const rubyAmountText = document.getElementById('rubyAmountText');

    const rightBloomAnim = document.getElementById('rightBloomAnim');
    const rightStarsAnim = document.getElementById('rightStarsAnim');
    const sapphImg = document.getElementById('sapphImg');
    const sapphAmountText = document.getElementById('sapphAmountText');

    const centerBloomAnim = document.getElementById('centerBloomAnim');
    const centerStarsAnim = document.getElementById('centerStarsAnim');
    const singleImg = document.getElementById('singleImg');
    const singleAmountText = document.getElementById('singleAmountText');

    const rubyInput = document.getElementById('rubyInput');
    const sapphInput = document.getElementById('sapphInput');
    const replayBtn = document.getElementById('replayBtn');

    function updateDisplay(rubyVal, sapphVal) {
      const rVal = parseInt(rubyVal) || 0;
      const bVal = parseInt(sapphVal) || 0;

      const rModel = getRubyModel(rVal);
      const bModel = getSapphModel(bVal);

      if (rModel && bModel) {
        dualModeGroup.style.display = 'inline';
        singleModeGroup.style.display = 'none';

        // 1. 左侧红宝石族群
        const rKit = modelKits[rModel.kit];
        const rScale = rModel.targetW / rKit.rw;
        const rH = rKit.rh * rScale;
        const rx = Math.round(CX_LEFT - rModel.targetW / 2);
        const rPlacement = getGemPlacement(rModel, CX_LEFT, Y_BASE);
        const ry = rPlacement.y;

        leftBloomAnim.innerHTML = renderBackBloomSVG(rModel.kit, CX_LEFT, rPlacement.lightBaseY, rScale);
        leftStarsAnim.innerHTML = renderFrontStarsSVG(rModel.kit, CX_LEFT, rPlacement.lightBaseY, rScale);

        rubyImg.setAttribute('x', rx);
        rubyImg.setAttribute('y', ry);
        rubyImg.setAttribute('width', rModel.targetW);
        rubyImg.setAttribute('height', rH);
        rubyImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', 'data:image/webp;base64,' + gemsB64[rModel.name]);
        rubyAmountText.textContent = '+' + rVal;

        // 2. 右侧蓝宝石族群
        const bKit = modelKits[bModel.kit];
        const bScale = bModel.targetW / bKit.rw;
        const bH = bKit.rh * bScale;
        const bx = Math.round(CX_RIGHT - bModel.targetW / 2);
        const bPlacement = getGemPlacement(bModel, CX_RIGHT, Y_BASE);
        const by = bPlacement.y;

        rightBloomAnim.innerHTML = renderBackBloomSVG(bModel.kit, CX_RIGHT, bPlacement.lightBaseY, bScale);
        rightStarsAnim.innerHTML = renderFrontStarsSVG(bModel.kit, CX_RIGHT, bPlacement.lightBaseY, bScale);

        sapphImg.setAttribute('x', bx);
        sapphImg.setAttribute('y', by);
        sapphImg.setAttribute('width', bModel.targetW);
        sapphImg.setAttribute('height', bH);
        sapphImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', 'data:image/webp;base64,' + gemsB64[bModel.name]);
        sapphAmountText.textContent = '+' + bVal;

      } else {
        dualModeGroup.style.display = 'none';
        singleModeGroup.style.display = 'inline';

        const activeModel = rModel || bModel || getRubyModel(100);
        const activeVal = rModel ? rVal : (bModel ? bVal : 100);
        const aKit = modelKits[activeModel.kit];
        const aScale = activeModel.targetW / aKit.rw;
        const aH = aKit.rh * aScale;
        const sx = Math.round(CX_CENTER - activeModel.targetW / 2);
        const aPlacement = getGemPlacement(activeModel, CX_CENTER, Y_BASE);
        const sy = aPlacement.y;

        centerBloomAnim.innerHTML = renderBackBloomSVG(activeModel.kit, CX_CENTER, aPlacement.lightBaseY, aScale);
        centerStarsAnim.innerHTML = renderFrontStarsSVG(activeModel.kit, CX_CENTER, aPlacement.lightBaseY, aScale);

        singleImg.setAttribute('x', sx);
        singleImg.setAttribute('y', sy);
        singleImg.setAttribute('width', activeModel.targetW);
        singleImg.setAttribute('height', aH);
        singleImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', 'data:image/webp;base64,' + gemsB64[activeModel.name]);
        singleAmountText.textContent = '+' + activeVal;
      }
    }

    function retrigger() {
      stageContainer.classList.remove('animate');
      void stageContainer.offsetWidth; // 强制重绘
      stageContainer.classList.add('animate');
    }

    // 输入与事件监听
    rubyInput.addEventListener('input', () => {
      updateDisplay(rubyInput.value, sapphInput.value);
      retrigger();
    });

    sapphInput.addEventListener('input', () => {
      updateDisplay(rubyInput.value, sapphInput.value);
      retrigger();
    });

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      retrigger();
    });

    stageContainer.addEventListener('click', () => {
      retrigger();
    });

    // 背光：页签隐藏或舞台离开视口时暂停动画；回来后恢复
    function syncGlowPause() {
      const hidden = document.hidden;
      let offscreen = false;
      if (typeof stageContainer.getBoundingClientRect === 'function') {
        const r = stageContainer.getBoundingClientRect();
        offscreen = r.bottom < 0 || r.top > (window.innerHeight || 0) || r.right < 0 || r.left > (window.innerWidth || 0);
      }
      stageContainer.classList.toggle('glow-paused', hidden || offscreen);
    }
    document.addEventListener('visibilitychange', syncGlowPause);
    window.addEventListener('pagehide', () => stageContainer.classList.add('glow-paused'));
    window.addEventListener('pageshow', syncGlowPause);
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        const vis = entries.some((e) => e.isIntersecting && e.intersectionRatio > 0.02);
        if (document.hidden) {
          stageContainer.classList.add('glow-paused');
        } else {
          stageContainer.classList.toggle('glow-paused', !vis);
        }
      }, { threshold: [0, 0.02, 0.1] });
      io.observe(stageContainer);
    }
    syncGlowPause();

    // 初始化渲染
    updateDisplay(rubyInput.value, sapphInput.value);
    retrigger();

    // 画廊紧凑预览模式：循环展示开场庆祝动效
    if (document.documentElement.classList.contains('compact')) {
      setInterval(() => {
        retrigger();
      }, 5500);
    }
  </script>
</body>
</html>
