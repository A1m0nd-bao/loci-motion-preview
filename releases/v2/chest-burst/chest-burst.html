<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原动效：独立宝箱错落展开 (260×300)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .chest-container {
      width: min(85vw, 260px);
      aspect-ratio: 260 / 300;
      height: auto;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.18, 1, 0.32, 1);
    }
    .chest-container:hover {
      transform: translateY(-5px) scale(1.02);
    }
    .chest-container:active {
      transform: translateY(1.5px) scale(0.99);
    }

    /* ========================================================= */
    /* ========== 爆出物：从宝箱中心 (114, 160) 错落爆出展开 ========== */
    /* ========================================================= */

    .burst-item {
      transform-box: view-box;
      transform-origin: 114px 160px;
      opacity: 0;
      pointer-events: none;
    }

    /* 弹出通用动画：从宝箱开口中心 (114px, 160px) 优雅喷薄升起展开并伴随微回弹，无扭曲 */
    .chest-open .burst-item {
      animation: popFromCenter 0.65s cubic-bezier(0.18, 1.2, 0.32, 1) forwards;
    }
    @keyframes popFromCenter {
      0% {
        transform: scale(0.08) translateY(14px);
        opacity: 0;
      }
      40% {
        opacity: 1;
      }
      75% {
        transform: scale(1.05) translateY(-2px);
        opacity: 1;
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    /* 收回通用动画：原路优雅吸回宝箱中心 */
    .chest-close .burst-item {
      animation: retractToCenter 0.3s cubic-bezier(0.4, 0, 0.7, 0.2) forwards;
    }
    @keyframes retractToCenter {
      0% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: scale(0.08) translateY(14px);
        opacity: 0;
      }
    }

    /* 错落出现时序（左右彩带与纸屑错落从中心射出） */
    .chest-open .burst-ribbon-l { animation-delay: 0.08s; } /* 1. 左彩带率先从中心飞出 */
    .chest-open .b-chip-1       { animation-delay: 0.12s; }
    .chest-open .b-chip-4       { animation-delay: 0.16s; }
    .chest-open .burst-ribbon-r { animation-delay: 0.22s; } /* 2. 右彩带错落从中心飞出 */
    .chest-open .b-chip-2       { animation-delay: 0.26s; }
    .chest-open .b-chip-3       { animation-delay: 0.30s; }

    /* ========================================================= */
    /* ========== 箱盖、箱体与细节物理反馈 ========== */
    /* ========================================================= */

    .chest-lid {
      transform-origin: 119.25px 145.39px;
      transform: translate(0px, 0px) rotate(0deg);
    }
    .chest-open .chest-lid {
      animation: lidBounceOpen 0.75s cubic-bezier(0.18, 0.95, 0.3, 1) forwards;
    }
    @keyframes lidBounceOpen {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      12% { transform: translate(0px, 1.8px) rotate(0.6deg); } /* 预备蓄力微压 Anticipation */
      42% { transform: translate(2.5px, -35px) rotate(-11.5deg) scale(1.03); } /* 爆发弹起 Spring Up */
      70% { transform: translate(1.3px, -23.5px) rotate(-7.0deg) scale(0.99); }
      100% { transform: translate(1.64px, -25.95px) rotate(-8.17deg) scale(1); }
    }
    .chest-close .chest-lid {
      animation: lidBounceClose 0.55s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    @keyframes lidBounceClose {
      0% { transform: translate(1.64px, -25.95px) rotate(-8.17deg); }
      50% { transform: translate(0px, 2px) rotate(0.8deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    .chest-body {
      transform-origin: 115px 240px;
    }
    .chest-open .chest-body {
      animation: bodySquashOpen 0.68s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    @keyframes bodySquashOpen {
      0% { transform: scale(1, 1) translateY(0); }
      14% { transform: scale(1.06, 0.92) translateY(3.5px); } /* 预备蓄力微蹲 Anticipation */
      36% { transform: scale(0.95, 1.07) translateY(-4px); }  /* 向上爆发弹跳 Spring! */
      65% { transform: scale(1.02, 0.98) translateY(1px); }   /* 弹性回落缓冲 */
      100% { transform: scale(1, 1) translateY(0); }          /* 稳稳就位 */
    }
    .chest-close .chest-body {
      animation: bodySquashClose 0.5s ease-out forwards;
    }
    @keyframes bodySquashClose {
      0% { transform: scale(1, 1) translateY(0); }
      48% { transform: scale(1.03, 0.96) translateY(1.5px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    .chest-tag {
      transform-origin: 168px 178px;
    }
    .chest-open .chest-tag {
      animation: tagSwayOpen 0.9s cubic-bezier(0.25, 1, 0.35, 1) forwards;
    }
    @keyframes tagSwayOpen {
      0% { transform: rotate(0deg); }
      28% { transform: rotate(18deg); }
      55% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg); }
    }
    .chest-close .chest-tag {
      animation: tagSwayClose 0.65s cubic-bezier(0.25, 1, 0.35, 1) forwards;
    }
    @keyframes tagSwayClose {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(-10deg); }
      65% { transform: rotate(5deg); }
      100% { transform: rotate(0deg); }
    }

    /* 盒内光芒 */
    .box-inner-glow {
      transform-origin: 114px 165px;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.18, 1.2, 0.32, 1);
      pointer-events: none;
    }
    .chest-open .box-inner-glow {
      opacity: 0.95;
      transform: scale(1);
    }
    .chest-close .box-inner-glow {
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.3s ease;
    }

    /* 顶部控制栏 */
    .top-bar {
      position: fixed;
      top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      background: rgba(18, 16, 26, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(249, 222, 167, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    }
    .status-text {
      color: #F9DEA7;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }


    .hint {
      position: absolute;
      bottom: 36px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      letter-spacing: 1px;
      pointer-events: none;
      transition: opacity 0.3s;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 14px;
      border-radius: 16px;
    }

    .box-star {
      transform-box: fill-box;
      transform-origin: center;
      animation: boxStarFade 2.6s ease-in-out infinite;
    }
    @keyframes boxStarFade {
      0%, 100% { transform: scale(0.72); opacity: 0.35; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .box-dot {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(1);
      opacity: 0.65;
    }
    .chest-open .box-dot {
      animation: boxDotPulse 0.65s cubic-bezier(0.18, 1.35, 0.32, 1) forwards 0.08s;
    }
    @keyframes boxDotPulse {
      0% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(1.1); opacity: 0.9; }
    }
  </style>

  <div class="hint">点击宝箱开启 / 合上</div>

  <script>
    const chestScene = document.getElementById("chestScene");
    let isChestOpen = false;

    function toggleChest() {
      isChestOpen = !isChestOpen;
      chestScene.classList.remove("chest-open", "chest-close");
      void chestScene.offsetWidth;

      if (isChestOpen) {
        chestScene.classList.add("chest-open");
      } else {
        chestScene.classList.add("chest-close");
      }
    }

    document.body.addEventListener("click", toggleChest);
  </script>
