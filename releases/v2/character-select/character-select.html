<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Motion 角色选择</title><style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 16px; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    body > div:first-of-type { width: 100%; max-width: 896px; display: flex; justify-content: flex-end; margin-bottom: 12px; }
    #btn-replay { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #0f172acc; border: 1px solid #334155cc; color: #cbd5e1; border-radius: 12px; font: 600 12px/16px inherit; cursor: pointer; }
    #btn-replay:hover { background: #1e293b; color: white; }
    #btn-replay svg { width: 14px; height: 14px; color: #e879f9; }
    main { width: 100%; max-width: 896px; display: flex; align-items: center; justify-content: center; position: relative; }
    main > div { position: relative; width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid #ffffff1a; background: #000c; box-shadow: 0 25px 50px -12px #0004; }
    #stage-svg { display: block; width: 100%; height: auto; user-select: none; }
    #veil-layer, #purple-bubbles-layer { pointer-events: none; }
    #btn-play { cursor: pointer; }
    #btn-play > g { transition: filter .25s ease, opacity .25s ease; }
    #btn-play[aria-disabled="true"] { cursor: not-allowed; }
    #btn-play[aria-disabled="true"] > g { filter: grayscale(1) brightness(.75); opacity: .55; }
    #btn-play:focus-visible { outline: 2px solid #f0abfc; outline-offset: 4px; }
    .play-toast { position: fixed; bottom: 40px; padding: 10px 20px; border-radius: 999px; background: linear-gradient(90deg, #d946ef, #f43f5e); color: white; font-size: 14px; font-weight: 700; box-shadow: 0 8px 24px #d946ef66; z-index: 50; }
    .compact body > div:first-of-type { display: none; }

    body {
      background: #09080d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .anim-target {
      transform-box: fill-box;
      transform-origin: center center;
    }

    /* 纯单调减速入场，零回弹 */
    @keyframes animBgIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1.0); }
    }
    @keyframes animCharIn {
      0% { opacity: 0; transform: translateY(35px); }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes animTitleIn {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes animButtonIn {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes animCtaIn {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0px); }
    }

    /* 原稿紫色气泡粒子：匀速垂直上升然后消失 */
    .purple-bubble {
      transform-box: fill-box;
      transform-origin: center center;
      animation-name: bubbleRiseLinear;
      animation-timing-function: linear; /* 严格匀速 */
      animation-iteration-count: infinite;
    }
    @keyframes bubbleRiseLinear {
      0% {
        transform: translateY(0px);
        opacity: 0;
      }
      15% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(-75px); /* 匀速垂直上升 */
        opacity: 0;                   /* 消失 */
      }
    }

    /* 按钮选中时的柔和契合光晕 */
    .btn-glow-male {
      filter: drop-shadow(0 0 10px rgba(195, 220, 255, 0.65));
    }
    .btn-glow-female {
      filter: drop-shadow(0 0 10px rgba(235, 130, 185, 0.65));
    }
    .btn-glow-nonbinary {
      filter: drop-shadow(0 0 10px rgba(245, 185, 55, 0.65));
    }
  
    /* v2 iframe compact preview adaptation */
    .release-downloads {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 20px;
    }
    .release-downloads a {
      font-size: 12px;
      color: #bcb4c5;
      text-decoration: none;
      border-bottom: 1px solid #51475b;
      padding-bottom: 3px;
      transition: all 0.2s ease;
    }
    .release-downloads a:hover {
      color: #f5ebf8;
      border-color: #d48bd4;
    }
    .compact body {
      min-height: 0;
      width: 750px;
      height: 504px;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: transparent;
      display: block;
    }
    .compact #btn-replay,
    .compact .release-downloads {
      display: none !important;
    }
    .compact main {
      width: 750px;
      height: 504px;
      max-width: 100%;
      padding: 0;
      margin: 0;
    }
    .compact main > div {
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
    }

      document.getElementById('p1-group-default'),

    const nbGroups = [

      document.getElementById('p2-group-nb'),

    ];

    // =========================================================================
    // 🎛️ 角色专属背景光配置 (4人独立且契合背景场景 · 全员不置灰)
    // =========================================================================
    const CHARACTER_SETS = {
      default: [
        { id: 0, name: '机车男', gender: 'male', glow: 'rgba(195, 220, 255, 0.80)', brightness: 1.18 },
        { id: 1, name: '手机少女', gender: 'female', glow: 'rgba(235, 130, 185, 0.80)', brightness: 1.18 },
        { id: 2, name: '秋千少女', gender: 'female', glow: 'rgba(245, 185, 55, 0.85)', brightness: 1.18 },

      nonBinary: [

      ]
    };

    let currentThemeKey = 'default';

    function getCurrentChars() {
      const activeList = CHARACTER_SETS[currentThemeKey] || CHARACTER_SETS.default;
      const elements = currentThemeKey === 'nonBinary'
        ? [p0CharNb, p1CharNb, p2CharNb, p3CharNb]
        : [p0CharDef, p1CharDef, p2CharDef, p3CharDef];
      return activeList.map((cfg, idx) => ({ el: elements[idx], ...cfg }));
    }

    function switchCharacterSet(targetKey) {
      if (currentThemeKey === targetKey) return;
      currentThemeKey = targetKey;

      if (targetKey === 'nonBinary') {
        defaultGroups.forEach(g => {
          if (g) {
            g.style.opacity = '0';
            g.style.pointerEvents = 'none';
          }
        });
        nbGroups.forEach(g => {
          if (g) {
            g.style.opacity = '1';
            g.style.pointerEvents = 'auto';
          }
        });
      } else {
        nbGroups.forEach(g => {
          if (g) {
            g.style.opacity = '0';
            g.style.pointerEvents = 'none';
          }
        });
        defaultGroups.forEach(g => {
          if (g) {
            g.style.opacity = '1';
            g.style.pointerEvents = 'auto';
          }
        });
      }
    }

    function updatePlayState() {

      btnPlay.setAttribute('aria-disabled', String(!enabled));
      btnPlay.setAttribute('tabindex', enabled ? '0' : '-1');
    }

    function playSequence() {
      updatePlayState();
      const allDefChars = [p0CharDef, p1CharDef, p2CharDef, p3CharDef];
      const allNbChars = [p0CharNb, p1CharNb, p2CharNb, p3CharNb];
      const allDefBgs = [p0BgDef, p1BgDef, p2BgDef, p3BgDef];
      const allNbBgs = [p0BgNb, p1BgNb, p2BgNb, p3BgNb];

      // 1. 初始化两批元素的初始状态
      [...allDefBgs, ...allNbBgs].forEach(el => {
        if (!el) return;
        el.style.opacity = '0';
        el.style.transform = 'scale(0.96)';
        el.style.transition = 'none';
      });

      [...allDefChars, ...allNbChars].forEach(el => {
        if (!el) return;
        el.style.opacity = '0';
        el.style.transform = 'translateY(35px)';
        el.style.transition = 'none';
      });

      [titleLayer, btnMale, btnFemale, btnNonbinary, btnPlay].forEach(el => {
        if (!el) return;
        el.style.opacity = '0';
        el.style.transition = 'none';
      });
      titleLayer.style.transform = 'translateY(-10px)';
      btnMale.style.transform = 'translateY(14px)';
      btnFemale.style.transform = 'translateY(14px)';
      btnNonbinary.style.transform = 'translateY(14px)';
      btnPlay.style.transform = 'translateY(16px)';

      void document.body.offsetHeight;

      const baseDurationBg = 0.45;
      const baseDurationChar = 0.50;
      const baseDurationUI = 0.40;

      // === 第一批: 4组分镜背景与立绘平滑升起 ===
      [0, 1, 2, 3].forEach(idx => {
        const bgDelay = 0.10 + idx * 0.10;
        const charDelay = 0.20 + idx * 0.11;

        setTimeout(() => {
          [allDefBgs[idx], allNbBgs[idx]].forEach(el => {
            if (el) {
              el.style.transition = `opacity ${baseDurationBg}s ${EASING}, transform ${baseDurationBg}s ${EASING}`;
              el.style.opacity = '1';
              el.style.transform = 'scale(1.0)';
            }
          });
        }, bgDelay * 1000);

        setTimeout(() => {
          [allDefChars[idx], allNbChars[idx]].forEach(el => {
            if (el) {
              el.style.transition = `opacity ${baseDurationChar}s ${EASING}, transform ${baseDurationChar}s ${EASING}, filter ${baseDurationChar}s ${EASING}`;
              el.style.opacity = '1';
              el.style.transform = 'translateY(0px)';
            }
          });
        }, charDelay * 1000);
      });

      // === 第二批: 前段标题与选项依次平滑出现 ===
      const secondBatchItems = [
        { el: titleLayer, delay: 0.75 },
        { el: btnMale, delay: 0.85 },
        { el: btnFemale, delay: 0.95 },
        { el: btnNonbinary, delay: 1.05 },
        { el: btnPlay, delay: 1.18, duration: 0.42 }
      ];

      secondBatchItems.forEach(item => {
        setTimeout(() => {
          const dur = item.duration || baseDurationUI;
          item.el.style.transition = `opacity ${dur}s ${EASING}, transform ${dur}s ${EASING}`;
          item.el.style.opacity = '1';
          item.el.style.transform = 'translateY(0px)';
        }, item.delay * 1000);
      });

      setTimeout(() => {
        updateSelectionUI();
      }, 1500);
    }

    function updateSelectionUI() {
      updatePlayState();
      const allChars = getCurrentChars();

      allChars.forEach(c => {
        if (c.el) {
          c.el.style.transition = 'all 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
        }
      });

      btnMale.style.transition = 'all 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      btnFemale.style.transition = 'all 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      btnNonbinary.style.transition = 'all 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

      btnMale.classList.remove('btn-glow-male');
      btnFemale.classList.remove('btn-glow-female');
      btnNonbinary.classList.remove('btn-glow-nonbinary');

      if (selectedGender === null) {
        btnMale.style.opacity = '0.75';
        btnFemale.style.opacity = '0.75';
        btnNonbinary.style.opacity = '0.75';
        btnMale.style.transform = 'scale(1.0)';
        btnFemale.style.transform = 'scale(1.0)';
        btnNonbinary.style.transform = 'scale(1.0)';

        if (b1Circle) b1Circle.setAttribute('fill-opacity', '0.15');
        if (b2Circle) b2Circle.setAttribute('fill-opacity', '0.15');
        if (b3Circle) b3Circle.setAttribute('fill-opacity', '0.15');

        allChars.forEach(c => {
          if (c.el) {
            c.el.style.transform = 'translateY(0px)';
            c.el.style.filter = 'none';
            c.el.style.opacity = '1.0';
          }
        });
        return;
      }

      if (selectedGender === 'male') {
        btnMale.style.opacity = '1.0';
        btnFemale.style.opacity = '0.60';
        btnNonbinary.style.opacity = '0.60';
        btnMale.style.transform = 'scale(1.05)';
        btnFemale.style.transform = 'scale(1.0)';
        btnNonbinary.style.transform = 'scale(1.0)';
        btnMale.classList.add('btn-glow-male');

        if (b1Circle) b1Circle.setAttribute('fill-opacity', '0.50');
        if (b2Circle) b2Circle.setAttribute('fill-opacity', '0.15');
        if (b3Circle) b3Circle.setAttribute('fill-opacity', '0.15');

        allChars.forEach((c, idx) => {
          if (!c.el) return;
          if (idx === activeCharIndex) {
            c.el.style.transform = 'translateY(-6px)';
            c.el.style.filter = `brightness(${c.brightness}) drop-shadow(0 0 16px ${c.glow})`;
            c.el.style.opacity = '1.0';
          } else {
            c.el.style.transform = 'translateY(0px)';
            c.el.style.filter = 'none';
            c.el.style.opacity = '1.0';
          }
        });

      } else if (selectedGender === 'female') {
        btnFemale.style.opacity = '1.0';
        btnMale.style.opacity = '0.60';
        btnNonbinary.style.opacity = '0.60';
        btnFemale.style.transform = 'scale(1.05)';
        btnMale.style.transform = 'scale(1.0)';
        btnNonbinary.style.transform = 'scale(1.0)';
        btnFemale.classList.add('btn-glow-female');

        if (b1Circle) b1Circle.setAttribute('fill-opacity', '0.15');
        if (b2Circle) b2Circle.setAttribute('fill-opacity', '0.50');
        if (b3Circle) b3Circle.setAttribute('fill-opacity', '0.15');

        allChars.forEach((c, idx) => {
          if (!c.el) return;
          if (idx === activeCharIndex) {
            c.el.style.transform = 'translateY(-6px)';
            c.el.style.filter = `brightness(${c.brightness}) drop-shadow(0 0 16px ${c.glow})`;
            c.el.style.opacity = '1.0';
          } else {
            c.el.style.transform = 'translateY(0px)';
            c.el.style.filter = 'none';
            c.el.style.opacity = '1.0';
          }
        });

      } else if (selectedGender === 'non-binary') {
        btnNonbinary.style.opacity = '1.0';
        btnMale.style.opacity = '0.60';
        btnFemale.style.opacity = '0.60';
        btnNonbinary.style.transform = 'scale(1.05)';
        btnMale.style.transform = 'scale(1.0)';
        btnFemale.style.transform = 'scale(1.0)';
        btnNonbinary.classList.add('btn-glow-nonbinary');

        if (b1Circle) b1Circle.setAttribute('fill-opacity', '0.15');
        if (b2Circle) b2Circle.setAttribute('fill-opacity', '0.15');
        if (b3Circle) b3Circle.setAttribute('fill-opacity', '0.50');

        allChars.forEach((c, idx) => {
          if (!c.el) return;
          if (idx === activeCharIndex) {
            c.el.style.transform = 'translateY(-6px)';
            c.el.style.filter = `brightness(${c.brightness}) drop-shadow(0 0 16px ${c.glow})`;
            c.el.style.opacity = '1.0';
          } else {
            c.el.style.transform = 'translateY(0px)';
            c.el.style.filter = 'none';
            c.el.style.opacity = '1.0';
          }
        });
      }
    }

    function onSelectGender(gender) {
      if (gender === 'male') {
        switchCharacterSet('default');
        const maleCandidates = [0, 3];
        let nextIndex = maleCandidates[Math.floor(Math.random() * maleCandidates.length)];
        if (selectedGender === 'male') {
          const others = maleCandidates.filter(i => i !== activeCharIndex);
          nextIndex = others.length ? others[0] : nextIndex;
        }
        selectedGender = 'male';
        activeCharIndex = nextIndex;
      } else if (gender === 'female') {
        switchCharacterSet('default');
        const femaleCandidates = [1, 2];
        let nextIndex = femaleCandidates[Math.floor(Math.random() * femaleCandidates.length)];
        if (selectedGender === 'female') {
          const others = femaleCandidates.filter(i => i !== activeCharIndex);
          nextIndex = others.length ? others[0] : nextIndex;
        }
        selectedGender = 'female';
        activeCharIndex = nextIndex;
      } else if (gender === 'non-binary') {
        switchCharacterSet('nonBinary');
        const nbCandidates = [0, 1, 2, 3];
        let nextIndex = nbCandidates[Math.floor(Math.random() * nbCandidates.length)];
        if (selectedGender === 'non-binary' && activeCharIndex !== null) {
          const others = nbCandidates.filter(i => i !== activeCharIndex);
          nextIndex = others[Math.floor(Math.random() * others.length)];
        }
        selectedGender = 'non-binary';
        activeCharIndex = nextIndex;
      }
      updateSelectionUI();
    }

    function onSelectCharacter(charIndex) {
      activeCharIndex = charIndex;
      if (currentThemeKey === 'nonBinary') {
        selectedGender = 'non-binary';
      } else {
        selectedGender = (charIndex === 0 || charIndex === 3) ? 'male' : 'female';
      }
      updateSelectionUI();
    }

    btnMale.addEventListener('click', () => onSelectGender('male'));
    btnFemale.addEventListener('click', () => onSelectGender('female'));
    btnNonbinary.addEventListener('click', () => onSelectGender('non-binary'));

    // 点击立绘联动
    if (p0CharDef) p0CharDef.addEventListener('click', () => onSelectCharacter(0));
    if (p1CharDef) p1CharDef.addEventListener('click', () => onSelectCharacter(1));
    if (p2CharDef) p2CharDef.addEventListener('click', () => onSelectCharacter(2));
    if (p3CharDef) p3CharDef.addEventListener('click', () => onSelectCharacter(3));

    if (p0CharNb) p0CharNb.addEventListener('click', () => onSelectCharacter(0));
    if (p1CharNb) p1CharNb.addEventListener('click', () => onSelectCharacter(1));
    if (p2CharNb) p2CharNb.addEventListener('click', () => onSelectCharacter(2));
    if (p3CharNb) p3CharNb.addEventListener('click', () => onSelectCharacter(3));

    btnPlay.addEventListener('click', () => {
      if (selectedGender === null) return;
      btnPlay.style.transform = 'scale(0.97)';
      setTimeout(() => btnPlay.style.transform = 'scale(1.0)', 150);

      const allChars = getCurrentChars();
      const toast = document.createElement('div');
      toast.className = 'play-toast';
      toast.setAttribute('role', 'status');
      if (selectedGender) {
        const charName = allChars[activeCharIndex] ? ` - ${allChars[activeCharIndex].name}` : '';
        toast.innerText = `🎮 进入游戏: [${selectedGender.toUpperCase()}${charName}]！`;
      } else {
        toast.innerText = `💡 提示: 请先选择心仪的性别或角色！`;
      }
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    });

    btnPlay.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && selectedGender !== null) {
        event.preventDefault();
        btnPlay.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      }
    });

    document.getElementById('btn-replay').addEventListener('click', () => {
      selectedGender = null;
      activeCharIndex = null;
      switchCharacterSet('default');
      playSequence();
    });

    window.addEventListener('DOMContentLoaded', () => playSequence());
  </script></body></html>
