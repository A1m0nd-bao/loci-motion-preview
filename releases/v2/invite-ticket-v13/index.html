<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>活动页兑换码 · 自适应奖券</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#101010}
    body{display:grid;align-content:center;overflow:auto}
    iframe{display:block;width:100%;height:350px;border:0}
  </style>
</head>
<body>
  <iframe src="./invite-ticket-responsive-v15.html?v=20261124" title="活动页兑换码 v15 · 完整交互预览"></iframe>
  <script>
    const frame=document.querySelector('iframe');
    frame.addEventListener('load',()=>{
      const preview=frame.contentDocument?.querySelector('.preview');
      if(!preview)return;
      const resize=new ResizeObserver(()=>{
        frame.style.height=Math.ceil(preview.getBoundingClientRect().height)+'px';
      });
      resize.observe(preview);
    });
  </script>
</body>
</html>
