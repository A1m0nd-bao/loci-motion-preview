<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <script>
    window.onerror = function(msg, url, line, col, err) {
      const errDiv = document.createElement('div');
      errDiv.id = 'js-runtime-error';
      errDiv.style.cssText = 'position:fixed;top:0;left:0;background:red;color:white;z-index:999999;padding:10px;font-size:14px;max-width:100vw;word-break:break-all;';
      errDiv.textContent = 'JS ERROR: ' + msg + ' at line ' + line + ':' + col;
      document.body.appendChild(errDiv);
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>输入邀请码 - 透明背景矢量动效 (SF Pro)</title>
  <style>
    :root {
      --stage-width: 375px;
      --stage-height: 812px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout wrapper: ensures controls NEVER overlap or obstruct the animation */
    .page-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 100vh;
      padding: 24px 16px 60px;
      box-sizing: border-box;
      gap: 28px;
    }

    /* Desktop View: Wide screens place controls side-by-side on the right, completely clear of animation */
    @media (min-width: 960px) {
      .page-layout {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 60px;
        padding: 40px;
      }
      .controls-panel {
        margin: 0 !important;
        max-width: 440px !important;
        flex-shrink: 0;
      }
    }

    /* Transparent Motion Stage */
    .motion-stage {
      position: relative;
      width: var(--stage-width);
      height: var(--stage-height);
      background: transparent;
      user-select: none;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* ========================================================
       THE INVITATION LETTER CARD (HTML + SF Pro Typography)
       ======================================================== */
    .letter-card {
      position: absolute;
      left: 24px;
      top: 151px;
      width: 327px;
      height: 573px;
      border-radius: 16px;
      background: linear-gradient(180deg, #F2E1C9 0%, #D7B2C9 100%);
      box-shadow: 0 20px 48px -10px rgba(78, 33, 80, 0.25),
                  0 0 0 1px rgba(255, 255, 255, 0.4) inset;
      z-index: 2;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate3d(0, 560px, 0); /* Initial state: deep inside envelope */
      will-change: transform;
    }

    /* Card background wavy curves */
    .card-curves-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Title: Invitation Letter */
    .card-title {
      position: relative;
      z-index: 3;
      margin-top: 48px;
      font-size: 20px;
      font-weight: 700;
      color: #1D1D1F;
      letter-spacing: -0.2px;
      line-height: 1.2;
      text-align: center;
    }

    /* Gift box graphic with 3D sapphires */
    .gift-box-wrap {
      position: relative;
      z-index: 3;
      margin-top: 22px;
      width: 131px;
      height: 107px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gift-box-img {
      width: 131px;
      height: 107px;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(113, 70, 114, 0.2));
    }

    /* Swooping ribbon banner */
    #card-ribbon {
      transform-origin: 187.5px 260.75px;
      transform: rotate(-29deg) scale(0.85);
      opacity: 0;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* Description text */
    .card-desc {
      position: relative;
      z-index: 3;
      margin-top: 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: #4A4A4A;
      text-align: center;
      font-weight: 400;
      letter-spacing: -0.1px;
      width: 260px;
    }
    .card-desc .bold-highlight {
      font-weight: 700;
      color: #1A1A1A;
    }

    /* Input Box Container */
    .input-wrapper {
      position: relative;
      z-index: 4;
      margin-top: 32px;
      width: 278px;
      height: 54px;
    }
    .invite-input {
      width: 100%;
      height: 54px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.05);
      border: 1.5px solid transparent;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #1D1D1F;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      text-align: center;
      box-sizing: border-box;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .invite-input::placeholder {
      color: rgba(0, 0, 0, 0.28);
      font-weight: 600;
      letter-spacing: 2px;
    }
    .invite-input:focus {
      border-color: rgba(237, 120, 244, 0.6);
      background: rgba(255, 255, 255, 0.4);
    }
    .error-row {
      position: absolute;
      top: 58px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      color: #E05252;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .input-wrapper.is-error .invite-input {
      border-color: rgba(255, 107, 107, 0.65);
      background: rgba(255, 107, 107, 0.08);
      color: rgba(180, 140, 150, 0.9);
    }
    .input-wrapper.is-error .error-row {
      opacity: 1;
    }
    .error-icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    /* Redeem Now Button & Speech Bubble */
    .btn-container {
      position: relative;
      z-index: 4;
      width: 278px;
      margin-top: 44px; /* Fixed distance below input; error message occupies the gap */
    }
    .redeem-btn {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      background: linear-gradient(90deg, #ED78F4 0%, #FF6F4E 100%);
      border: none;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(237, 120, 244, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .redeem-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(237, 120, 244, 0.45);
    }
    .redeem-btn:active {
      transform: scale(0.97);
    }
    .speech-bubble {
      position: absolute;
      top: -16px;
      right: 4px;
      background: #FFE4F2;
      color: #8A3A8A;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px 12px 12px 2px;
      box-shadow: 0 4px 12px rgba(113, 70, 114, 0.15);
      display: flex;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s;
      animation: bubbleFloat 2.8s ease-in-out infinite;
    }
    /* Hide speech bubble when error state is active to prevent overlap */
    .input-wrapper.is-error ~ .btn-container .speech-bubble {
      opacity: 0 !important;
      visibility: hidden !important;
      transform: translateY(4px) scale(0.9) !important;
    }
    .bubble-gem-svg {
      width: 12px;
      height: 12px;
    }

    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* ========================================================
       ENVELOPE LAYERS (Z-Index Ordered Overlays)
       ======================================================== */
    .env-svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 375px;
      height: 812px;
      pointer-events: none;
    }

    /* Flap Back (Open Triangle pointing UP) */
    #flap-back {
      transform-origin: 187.5px 560px;
      transform: scaleY(0);
      z-index: 1;
    }

    /* Envelope Back Cavity */
    #env-back {
      z-index: 1;
    }

    /* Envelope Front Triangular Flaps (Occludes bottom of card) */
    #env-front {
      z-index: 3;
    }

    /* Flap Front (User's Exact Vector Top Flap) */
    #flap-front {
      position: absolute;
      left: -8px;
      top: 556.4px;
      width: 391px;
      height: 180px;
      transform-origin: 195.5px 6px;
      transform: scaleY(1);
      z-index: 4;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Wax Seal Stamp */
    #wax-seal {
      position: absolute;
      left: 150.5px;
      top: 672px;
      width: 74px;
      height: 76px;
      z-index: 5;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 0.15s;
    }
    #wax-seal:hover {
      transform: scale(1.05);
    }

    /* ========================================================
       ANIMATION TIMELINE (Hardware-Accelerated CSS Keyframes)
       ======================================================== */
    .animating #wax-seal {
      animation: sealFade 0.42s 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes sealFade {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate3d(0, -8px, 0) scale(0.7);
        pointer-events: none;
      }
    }

    .animating #flap-front {
      animation: flapFrontFold 0.22s 0.42s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes flapFrontFold {
      0% {
        transform: scaleY(1);
        opacity: 1;
      }
      99% {
        transform: scaleY(0.01);
        opacity: 1;
      }
      100% {
        transform: scaleY(0);
        opacity: 0;
      }
    }

    .animating #flap-back {
      animation: flapBackOpen 0.24s 0.64s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes flapBackOpen {
      0% {
        transform: scaleY(0);
        opacity: 0;
      }
      1% {
        transform: scaleY(0.01);
        opacity: 1;
      }
      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    /* Card Slides Up with Spring Overshoot */
    .animating #letter-card {
      animation: cardSlideUp 1.05s 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cardSlideUp {
      0% {
        transform: translate3d(0, 560px, 0);
      }
      68% {
        transform: translate3d(0, -20px, 0);
      }
      84% {
        transform: translate3d(0, 5px, 0);
      }
      100% {
        transform: translate3d(0, 0px, 0);
      }
    }

    /* Ribbon Banner swoops from -29deg to 0deg */
    .animating #card-ribbon {
      animation: ribbonReveal 0.75s 1.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes ribbonReveal {
      0% {
        opacity: 0;
        transform: rotate(-29deg) scale(0.85);
      }
      100% {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }
    }
      100% {
        opacity: 1;
        transform: translateX(-50%) rotate(0deg) scale(1);
      }
    }

    /* Idle subtle floating loop after animation completes */
    .animating.completed #letter-card {
      animation: cardIdleFloat 4s ease-in-out infinite;
    }
    @keyframes cardIdleFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -5px, 0); }
    }

    /* ========================================================
       CONTROL DASHBOARD
       ======================================================== */
    .controls-panel {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 20px;
      padding: 16px 20px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .controls-panel.is-minimized {
      display: none !important;
    }
    .controls-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    
    .controls-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(60, 60, 67, 0.6);
    }
    
    .btn-minimize {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: rgba(60, 60, 67, 0.6);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .btn-minimize:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #1c1c1e;
    }
    
    
    .controls-toggle-pill {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 30px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #1c1c1e;
      cursor: pointer;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      z-index: 200;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .controls-toggle-pill:hover {
      transform: scale(1.04);
    }
    .controls-toggle-pill.visible {
      display: flex !important;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;

    .controls-row:last-child {
      margin-bottom: 0;

    .btn {
      background: rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #1c1c1e;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: rgba(0, 0, 0, 0.1);
      transform: translateY(-1px);
    }
    
    .btn.primary {
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      color: #fff;
      border: none;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    .btn.danger {
      background: rgba(255, 90, 79, 0.12);
      border-color: rgba(255, 90, 79, 0.3);
      color: #d63031;
    }
    
    .btn.success {
      background: rgba(46, 204, 113, 0.12);
      border-color: rgba(46, 204, 113, 0.3);
      color: #27ae60;
    }
    

    .speed-pills {
      display: flex;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      padding: 2px;
    }
    
    .speed-pill {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.6);
      transition: all 0.2s;
    }
    
    .speed-pill.active {
      background: #fff;
      color: #000;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }
    

    .timeline-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    .time-label {
      font-size: 12px;
      font-family: monospace;
      color: rgba(0, 0, 0, 0.6);
      min-width: 42px;
    }
    
    input[type=range] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
      outline: none;
    }
    
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #a855f7;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.85);
      transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      background: rgba(26, 18, 40, 0.95);
      color: #fff;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  
    /* Views inside Letter Card */
    .card-form-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .card-form-view.hide,
    .card-form-view.is-hidden {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .card-form-view.fading-out {
      opacity: 0 !important;
      transform: scale(0.95) !important;
      pointer-events: none !important;
    }

    .card-success-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 3;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
      overflow: hidden;
    }
    .card-success-view.show,
    .card-success-view.is-visible {
      display: block !important;
      opacity: 1 !important;
      transform: scale(1) !important;
      pointer-events: auto !important;
    }

    /* Card Background SVG with Texture */
    .card-bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 327px;
      height: 573px;
      pointer-events: none;
      z-index: 0;
    }

    /* Purple Light Rays Vector Layer (Exact 327x136 SVG) */
    .success-rays-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 327px;
      height: 136px;
      pointer-events: none;
      z-index: 1;
    }
    .card-success-view.show .success-rays-svg g,
    .card-success-view.is-visible .success-rays-svg g {
      animation: rayPulse 4s ease-in-out infinite alternate;
    }
    @keyframes rayPulse {
      0% { opacity: 0.55; }
      100% { opacity: 0.85; }
    }

    /* +100 Badge with Upward Slide & Fade */
    .success-badge {
      position: absolute;
      top: 42px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 3;
      opacity: 1;
      transform: translateY(0);
      }
    .card-success-view.show .success-badge,
    .card-success-view.is-visible .success-badge {
      animation: slideUpFade 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }
    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .success-badge-num {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", sans-serif;
      font-size: 34px;
      font-weight: 700;
      font-style: italic;
      line-height: 1;
      letter-spacing: -0.5px;
      color: #60293E;
    }
    .success-badge-gem {
      width: 25px;
      height: 27px;
      object-fit: contain;
      transform: rotate(6deg);
      filter: drop-shadow(0 2px 6px rgba(21, 101, 192, 0.35));
    }

    /* Cup Lottie Container (Pixel-calibrated to 105px top, 271px bottom) */
    .cup-lottie-container {
      position: absolute;
      top: 29px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 258px;
      z-index: 3;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.2s ease;
    }
    .cup-lottie-container:active {
      transform: translateX(-50%) scale(0.96);
    }
    #cup-lottie {
      width: 100%;
      height: 100%;
    }

    /* Success Description (SF Pro Text) */
    .success-desc {
      position: absolute;
      top: 332px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      line-height: 20px;
      color: rgba(60, 40, 60, 0.65);
      text-align: center;
      z-index: 3;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      }
    .card-success-view.show .success-desc,
    .card-success-view.is-visible .success-desc {
      animation: descFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }
    @keyframes descFadeIn {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }
    }

    

  
    .btn.info {
      background: rgba(237, 120, 244, 0.15);
      border-color: rgba(237, 120, 244, 0.35);
      color: #D6308F;
    }
    
    .btn.active {
      box-shadow: 0 0 0 2px #ED78F4 inset;
      font-weight: 700;
    }

  </style>

    function handleRedeem() {
      const input = document.getElementById('invite-input');
      const inputWrapper = document.getElementById('input-wrapper');
      const val = (input ? input.value : '').replace(/\s+/g, '').toUpperCase();
      
      // If code is empty or wrong, show error state (hides +100 bubble without moving button)
      if (!val || val.length < 4 || val === 'ERROR') {
        inputWrapper.classList.add('is-error');
        const btnError = document.getElementById('btn-state-error');
        const btnNormal = document.getElementById('btn-state-normal');
        if (btnError) btnError.classList.add('active');
        if (btnNormal) btnNormal.classList.remove('active');
        showToast('邀请码无效，请重试');
        return;
      }
      
      // Valid -> animate button and trigger success state
      inputWrapper.classList.remove('is-error');
      const btn = document.getElementById('redeem-btn');
      if (btn) {
        btn.style.transform = 'scale(0.94)';
        setTimeout(() => {
          btn.style.transform = 'scale(1.04)';
          setTimeout(() => {
            btn.style.transform = 'scale(1)';

        }, 90);
      } else {
        switchToSuccessState();
      }
    }

      isPlaying = false;
      playPauseIcon.textContent = '▶ 播放';

      const formView = document.getElementById('card-form-view');
      const successView = document.getElementById('card-success-view');
      if (formView) {
        formView.classList.remove('is-hidden', 'fading-out');
        formView.style.opacity = 1;
        formView.style.transform = 'scale(1)';
        formView.style.pointerEvents = 'auto';
      }
      if (successView) {
        successView.classList.remove('is-visible');
        successView.style.opacity = 0;
        successView.style.transform = 'scale(0.95)';
        successView.style.pointerEvents = 'none';
      }
      const btnNormal = document.getElementById('btn-state-normal');
      const btnError = document.getElementById('btn-state-error');
      const btnSuccess = document.getElementById('btn-state-success');
      if (btnNormal) btnNormal.classList.remove('active');
      if (btnError) btnError.classList.add('active');
      if (btnSuccess) btnSuccess.classList.remove('active');

      inputWrapper.classList.add('is-error');
      inviteInput.value = '';

      applyScrubTime(2.2);
      timeline.value = 2.2;
      timeLabel.textContent = '2.20s';
      showToast('已切换至图1错误状态 (Invalid code)');
    }

    function switchToSuccessState() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      isPlaying = false;
      playPauseIcon.textContent = '▶ 播放';

      const formView = document.getElementById('card-form-view');
      const successView = document.getElementById('card-success-view');
      const btnNormal = document.getElementById('btn-state-normal');
      const btnError = document.getElementById('btn-state-error');
      const btnSuccess = document.getElementById('btn-state-success');
      if (btnNormal) btnNormal.classList.remove('active');
      if (btnError) btnError.classList.remove('active');
      if (btnSuccess) btnSuccess.classList.add('active');

      if (formView) {
        formView.classList.add('hide', 'is-hidden');
        formView.style.opacity = 0;
        formView.style.transform = 'scale(0.95)';
        formView.style.pointerEvents = 'none';
      }
      if (successView) {
        successView.classList.add('show', 'is-visible');
        successView.style.opacity = 1;
        successView.style.transform = 'scale(1)';
        successView.style.pointerEvents = 'auto';
      }

      // Jump card to fully open position on timeline (4.3s = gems settled)
      applyScrubTime(4.3);
      timeline.value = 4.3;
      timeLabel.textContent = '4.30s';

      // Re-trigger upward slide animation for +100 and description
      const badge = document.getElementById('success-badge');
      const desc = document.getElementById('success-desc');
      if (badge) {
        badge.style.animation = 'none';
        badge.offsetHeight;
        badge.style.animation = 'slideUpFade 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards';
      }
      if (desc) {
        desc.style.animation = 'none';
        desc.offsetHeight;
        desc.style.animation = 'descFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards';
      }

      // Show settled cup frame (101) directly on state switch, matching reference exactly
      if (cupAnimInstance && cupLottieReady) {
        cupAnimInstance.goToAndStop(101, true);
      } else {
        window.__pendingFrame = 101;
        initOrPlayCupAnimation();
      }
      showToast('🎉 兑换成功！获得 100 蓝宝石');
    }

    // Full Animation Engine
    function startAnimation() {
      animStartTime = performance.now();
      isPlaying = true;
      playPauseIcon.textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }

    function tick() {
      if (!isPlaying) return;
      const elapsed = (performance.now() - animStartTime) * playbackRate;
      const t = elapsed / 1000;

      if (t >= animDuration / 1000) {
        applyScrubTime(animDuration / 1000);
        timeline.value = (animDuration / 1000).toFixed(2);
        timeLabel.textContent = (animDuration / 1000).toFixed(2) + 's';
        isPlaying = false;
        playPauseIcon.textContent = '▶ 播放';
        return;
      }

      timeline.value = t.toFixed(2);
      timeLabel.textContent = t.toFixed(2) + 's';
      applyScrubTime(t);
      rafId = requestAnimationFrame(tick);
    }

    function replayAnimation() {
      const formView = document.getElementById('card-form-view');
      const successView = document.getElementById('card-success-view');
      if (formView) {
        formView.classList.remove('is-hidden', 'fading-out');
        formView.style.opacity = 1;
        formView.style.transform = 'scale(1)';
        formView.style.pointerEvents = 'auto';
      }
      if (successView) {
        successView.classList.remove('is-visible');
        successView.style.opacity = 0;
        successView.style.transform = 'scale(0.95)';
        successView.style.pointerEvents = 'none';
      }
      inputWrapper.classList.remove('is-error');
      inviteInput.value = 'ERKC6B8A';

      if (rafId) cancelAnimationFrame(rafId);
      applyScrubTime(0);
      timeline.value = 0;
      timeLabel.textContent = '0.00s';

      setTimeout(() => {
        animStartTime = performance.now();
        isPlaying = true;
        playPauseIcon.textContent = '⏸ 暂停';
        rafId = requestAnimationFrame(tick);
      }, 60);
    }

    function togglePlayPause() {
      if (isPlaying) {
        isPlaying = false;
        playPauseIcon.textContent = '▶ 播放';
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        isPlaying = true;
        playPauseIcon.textContent = '⏸ 暂停';
        animStartTime = performance.now() - (parseFloat(timeline.value) * 1000 / playbackRate);
        rafId = requestAnimationFrame(tick);
      }
    }

    function setSpeed(rate, pillElem) {
      playbackRate = rate;
      document.querySelectorAll('.speed-pill').forEach(el => el.classList.remove('active'));
      pillElem.classList.add('active');
      if (isPlaying) {
        animStartTime = performance.now() - (parseFloat(timeline.value) * 1000 / playbackRate);
      }
      showToast('播放倍速: ' + rate + 'x');
    }

    function scrubTimeline(val) {
      if (isPlaying) {
        isPlaying = false;
        playPauseIcon.textContent = '▶ 播放';
        if (rafId) cancelAnimationFrame(rafId);
      }
      const t = parseFloat(val);
      timeLabel.textContent = t.toFixed(2) + 's';
      applyScrubTime(t);
    }

    function applyScrubTime(t) {
      const seal = document.getElementById('wax-seal');
      const flapFront = document.getElementById('flap-front');
      const flapBack = document.getElementById('flap-back');
      const card = document.getElementById('letter-card');
      const ribbon = document.getElementById('card-ribbon');
      const formView = document.getElementById('card-form-view');
      const successView = document.getElementById('card-success-view');
      const redeemBtn = document.getElementById('redeem-btn');
      const inputWrapper = document.getElementById('input-wrapper');
      const btnNormal = document.getElementById('btn-state-normal');
      const btnError = document.getElementById('btn-state-error');
      const btnSuccess = document.getElementById('btn-state-success');

      // 1. Wax seal (0.0s - 0.5s)
      if (t < 0.25) {
        if (seal) {
          seal.style.opacity = 1;
          seal.style.transform = 'translate3d(0, 0, 0) scale(1)';
        }
      } else if (t < 0.6) {
        const p = (t - 0.25) / 0.35;
        if (seal) {
          seal.style.opacity = 1 - p;
          seal.style.transform = `translate3d(0, ${-8 * p}px, 0) scale(${1 - 0.3 * p})`;
        }
      } else {
        if (seal) seal.style.opacity = 0;
      }

      // 2. Flaps: Sequential opening (0.42s - 0.88s)
      if (flapFront && flapBack) {
        if (t < 0.42) {
          flapFront.style.transform = 'scaleY(1)';
          flapFront.style.opacity = 1;
          flapBack.style.transform = 'scaleY(0)';
          flapBack.style.opacity = 0;
        } else if (t < 0.64) {
          // Phase 1: Front flap folds UP to fold line (scaleY 1 -> 0)
          const p1 = (t - 0.42) / 0.22;
          flapFront.style.transform = `scaleY(${Math.max(0, 1 - p1)})`;
          flapFront.style.opacity = p1 >= 0.98 ? 0 : 1;
          flapBack.style.transform = 'scaleY(0)';
          flapBack.style.opacity = 0;
        } else if (t < 0.88) {
          // Phase 2: Back flap unfolds UPWARDS from fold line (scaleY 0 -> 1)
          const p2 = (t - 0.64) / 0.24;
          flapFront.style.transform = 'scaleY(0)';
          flapFront.style.opacity = 0;
          flapBack.style.transform = `scaleY(${Math.min(1, easeOutCubic(p2))})`;
          flapBack.style.opacity = 1;
        } else {
          // Fully opened
          flapFront.style.transform = 'scaleY(0)';
          flapFront.style.opacity = 0;
          flapBack.style.transform = 'scaleY(1)';
          flapBack.style.opacity = 1;
        }
      }

      // 3. Card slide up (0.85s - 1.9s)
      if (card) {
        if (t < 0.85) {
          card.style.transform = 'translate3d(0, 650px, 0)';
          card.style.opacity = 0;
        } else if (t < 1.9) {
          card.style.opacity = 1;
          const p = (t - 0.85) / 1.05;
          let y = 0;
          if (p < 0.68) {
            const p1 = p / 0.68;
            y = 560 * (1 - easeOutCubic(p1)) - 20 * easeOutCubic(p1);
          } else if (p < 0.84) {
            const p2 = (p - 0.68) / 0.16;
            y = -20 + 25 * p2;
          } else {
            const p3 = (p - 0.84) / 0.16;
            y = 5 - 5 * p3;
          }
          card.style.transform = `translate3d(0, ${y}px, 0)`;
        } else {
          card.style.transform = 'translate3d(0, 0px, 0)';
          card.style.opacity = 1;
        }
      }

            // 4. Vector Ribbon (1.35s - 1.95s)
      if (ribbon) {
        if (t < 1.35) {
          ribbon.style.opacity = 0;
          ribbon.style.transform = 'rotate(-29deg) scale(0.85)';
        } else if (t < 1.95) {
          const p = (t - 1.35) / 0.60;
          ribbon.style.opacity = Math.min(1, p * 1.6);
          ribbon.style.transform = `rotate(${-29 * (1 - easeOutBack(p))}deg) scale(${0.85 + 0.15 * p})`;
        } else {
          ribbon.style.opacity = 1;
          ribbon.style.transform = 'rotate(0deg) scale(1)';
        }
      }

      // 5. First Page Content Fade-In Logic (Starts earlier at t=1.00s so gift box is ready before ribbon swoops)
      if (formView) {
        if (t < 1.00) {
          formView.style.opacity = 0;
          formView.style.transform = 'translate3d(0, 16px, 0)';
          formView.style.pointerEvents = 'none';
        } else if (t < 1.45) {
          const p = (t - 1.00) / 0.45;
          const op = easeOutCubic(p);
          formView.style.opacity = op;
          formView.style.transform = `translate3d(0, ${16 * (1 - op)}px, 0)`;
          formView.style.pointerEvents = p > 0.8 ? 'auto' : 'none';
        } else if (t < 2.38) {
          formView.style.opacity = 1;
          formView.style.transform = 'translate3d(0, 0, 0)';
          formView.style.pointerEvents = 'auto';
        }
      }

      // 6. Crossfade to Success State (Starts earlier at 2.25s button pulse, 2.38s - 2.70s fade-out)
      if (t < 2.25) {
        if (successView) {
          successView.classList.remove('is-visible', 'show');
          successView.style.display = 'none';
          successView.style.opacity = 0;
          successView.style.transform = 'scale(0.95)';
          successView.style.pointerEvents = 'none';
        }
        if (redeemBtn) redeemBtn.style.transform = 'scale(1)';
        if (btnNormal && inputWrapper && !inputWrapper.classList.contains('is-error')) {
          btnNormal.classList.add('active');
          if (btnSuccess) btnSuccess.classList.remove('active');
        }
      } else if (t < 2.38) {
        // Auto button click pulse (snappy 130ms)
        const btnP = (t - 2.25) / 0.13;
        if (redeemBtn) redeemBtn.style.transform = `scale(${1 - 0.08 * Math.sin(btnP * Math.PI)})`;
        if (formView) {
          formView.style.opacity = 1;
          formView.style.transform = 'translate3d(0, 0, 0)';
        }
        if (successView) {
          successView.classList.remove('is-visible', 'show');
          successView.style.display = 'none';
          successView.style.opacity = 0;
        }
      } else if (t < 2.70) {
        // Earlier crossfade (2.38s - 2.70s)
        const p = (t - 2.38) / 0.32;
        if (formView) {
          formView.style.opacity = 1 - easeOutCubic(p);
          formView.style.transform = `scale(${1 - 0.05 * easeOutCubic(p)})`;
          formView.style.pointerEvents = 'none';
        }
        if (successView) {
          successView.classList.add('is-visible');
          successView.style.display = 'block';
          successView.style.opacity = easeOutCubic(p);
          successView.style.transform = `scale(${0.95 + 0.05 * easeOutCubic(p)})`;
          successView.style.pointerEvents = 'auto';
        }
        if (btnSuccess) btnSuccess.classList.add('active');
        if (btnNormal) btnNormal.classList.remove('active');
        if (btnError) btnError.classList.remove('active');
      } else {
        if (formView) {
          formView.style.opacity = 0;
          formView.style.transform = 'scale(0.95)';
          formView.style.pointerEvents = 'none';
        }
        if (successView) {
          successView.classList.add('is-visible');
          successView.style.display = 'block';
          successView.style.opacity = 1;
          successView.style.transform = 'scale(1)';
          successView.style.pointerEvents = 'auto';
        }
        if (btnSuccess) btnSuccess.classList.add('active');
        if (btnNormal) btnNormal.classList.remove('active');
        if (btnError) btnError.classList.remove('active');
      }

      // Sync Cup Lottie animation with timeline when t >= 2.5s (earlier sync)
      if (t >= 2.50) {
        const lottieP = Math.min(1, Math.max(0, (t - 2.50) / 1.7));
        const targetFrame = Math.min(101, Math.max(0, Math.round(lottieP * 101)));
        if (cupAnimInstance && cupLottieReady) {
          cupAnimInstance.goToAndStop(targetFrame, true);
        } else {
          window.__pendingFrame = targetFrame;
        }
      } else {
        if (cupAnimInstance && cupLottieReady) {
          cupAnimInstance.goToAndStop(0, true);
        } else {
          window.__pendingFrame = 0;
        }
      }
    }

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    
    // Panel Minimize / Restore Functions
    function minimizeControlsPanel() {
      const panel = document.getElementById('controls-panel');
      const pill = document.getElementById('controls-toggle-pill');
      if (panel) panel.classList.add('is-minimized');
      if (pill) pill.classList.add('visible');
    }

    function restoreControlsPanel() {
      const panel = document.getElementById('controls-panel');
      const pill = document.getElementById('controls-toggle-pill');
      if (panel) panel.classList.remove('is-minimized');
      if (pill) pill.classList.remove('visible');
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Initializer
    window.addEventListener('DOMContentLoaded', () => {
      initOrPlayCupAnimation();

      const urlParams = new URLSearchParams(window.location.search);
      const state = urlParams.get('state');
      const timeParam = urlParams.get('t');
      if (timeParam !== null) {
        applyScrubTime(parseFloat(timeParam));
        timeline.value = parseFloat(timeParam);
        timeLabel.textContent = parseFloat(timeParam).toFixed(2) + 's';
      } else if (state === 'closed') {
        applyScrubTime(0);
        timeline.value = 0;
        timeLabel.textContent = '0.00s';
      } else if (state === 'normal') {
        switchToNormalState();
      } else if (state === 'error') {
        switchToErrorState();
      } else if (state === 'success') {
        switchToSuccessState();
      } else {
        switchToNormalState();
      }
    });
  </script>
</body>
