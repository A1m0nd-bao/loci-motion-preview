<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>付费权益 · Sipplay v2</title><style>
:root{color-scheme:dark;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0b10;color:#f7ece5}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 16px}main{width:min(100%,520px);text-align:center}h1{font-size:19px;font-weight:550;margin:0 0 12px}.hint{font-size:13px;color:#aa9da5;line-height:1.7;margin:0}.panel{margin-top:25px;padding:42px 24px 30px;background:radial-gradient(ellipse at 50% 40%,#4a2a32 0,#21161d 60%,#151217 100%);border:1px solid #4c343b;border-radius:24px}.row{display:flex;justify-content:center;gap:clamp(55px,13vw,105px)}.item{display:grid;justify-items:center;gap:10px;min-width:100px}.reward{position:relative;isolation:isolate;width:67px;height:70px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}.reward:focus-visible{outline:1px solid #f6d1aa;outline-offset:3px;border-radius:6px}.reward[disabled]{cursor:default}.reward img{display:block;width:67px;height:70px;position:absolute;inset:0;pointer-events:none;z-index:2}.paid-light{position:absolute;inset:-4px;z-index:0;pointer-events:none;overflow:visible}.paid-halo,.paid-rays,.paid-glow{position:absolute;inset:0;display:block;pointer-events:none}.paid-halo{background:radial-gradient(ellipse,#ffd78c88 0%,#f3aa7355 24%,#bc718c2e 46%,transparent 73%);filter:blur(3px);animation:paid-breathe 3.6s ease-in-out infinite}.paid-rays{inset:0;background:conic-gradient(from 5deg,transparent 0deg,#ffe5b940 27deg,transparent 35deg,transparent 110deg,#ffd3a238 119deg,transparent 128deg,transparent 205deg,#fff1cc38 213deg,transparent 224deg,transparent 290deg,#f3bb8738 300deg,transparent 311deg);filter:blur(3px);animation:paid-rays 9s linear infinite;opacity:.55}.paid-glow{inset:8px;border-radius:50%;background:radial-gradient(ellipse,#ffe1a655 0%,#e9a76d35 42%,transparent 72%);filter:blur(4px);animation:paid-breathe 3.6s ease-in-out infinite}.paid-spark{position:absolute;width:5px;height:5px;opacity:0;filter:drop-shadow(0 0 2px #ffd795);animation:paid-spark 3.8s ease-in-out infinite}.paid-spark:before,.paid-spark:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff1d0;border-radius:100%}.paid-spark:before{width:1px;height:100%}.paid-spark:after{width:100%;height:1px}.s1{left:4px;top:12px}.s2{right:5px;top:19px;animation-delay:1.1s}.s3{right:11px;bottom:7px;animation-delay:2.1s}@keyframes paid-breathe{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:.9;transform:scale(1.03)}}@keyframes paid-rays{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes paid-spark{0%,12%,38%,100%{opacity:0;transform:scale(.4)}23%{opacity:1;transform:scale(1)}30%{opacity:.55;transform:scale(.75)}}.reward.feedback{animation:claim .4s cubic-bezier(.16,1,.3,1)}@keyframes claim{0%{transform:scale(1)}25%{transform:scale(.94)}65%{transform:scale(1.06)}100%{transform:scale(1)}}.name{font-size:13px;color:#f0d8cd}.detail{font-size:11px;color:#ac9496;line-height:1.5}.status{margin:28px 0 0;font-size:12px;color:#c3aab0;min-height:19px}.actions{margin-top:20px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #6f5157;border-radius:9px;background:#39252d;color:#f8e5dc;font:inherit;font-size:12px;padding:9px 17px;cursor:pointer}.actions button:focus-visible{outline:1px solid #f6d1aa;outline-offset:3px}.caption{font-size:11px;color:#827680;margin:16px 0 0;line-height:1.7}@media(max-width:380px){.panel{padding:34px 12px 24px}.row{gap:35px}}@media(prefers-reduced-motion:reduce){.paid-halo,.paid-rays,.paid-glow,.paid-spark,.reward.feedback{animation:none}.paid-halo{opacity:.55}.paid-rays{opacity:.3}.paid-glow{opacity:.5}.paid-spark{opacity:0}}

.single-stage{height:136px;display:grid;place-items:center}.single-stage .reward{transform:scale(1.6)}.single-stage .reward.feedback{animation:claim-large .4s cubic-bezier(.16,1,.3,1)}@keyframes claim-large{0%{transform:scale(1.6)}25%{transform:scale(1.5)}65%{transform:scale(1.68)}100%{transform:scale(1.6)}}.lock-svg{position:absolute;inset:0;width:67px;height:70px;z-index:3;overflow:visible;pointer-events:none}.lock-shackle{transform-box:fill-box;transform-origin:left bottom}.reward.unlocking .lock-shackle{animation:shackle-open .84s cubic-bezier(.2,.75,.2,1) both}.lock-svg{transform-origin:77% 23%}.reward.unlocking .lock-svg{animation:lock-out 1.02s both}.reward.unlocked .lock-svg{opacity:0}.unlock-flare{position:absolute;inset:4px;z-index:1;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(ellipse,#fff2d3a0 0%,#ffc98670 27%,transparent 70%);filter:blur(3px)}.reward.unlocking .unlock-flare{animation:unlock-flash .85s ease-out both}@keyframes shackle-open{0%,12%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.2,.8,.2,1)}45%{transform:rotate(-34deg);animation-timing-function:ease-in-out}62%{transform:rotate(-25deg);animation-timing-function:ease-in-out}78%{transform:rotate(-31deg);animation-timing-function:ease-out}100%{transform:rotate(-28deg)}}@keyframes lock-out{0%,63%{opacity:1}100%{opacity:0}}@keyframes unlock-flash{0%,18%{opacity:0;transform:scale(.65)}42%{opacity:.9;transform:scale(1.12)}100%{opacity:0;transform:scale(1.25)}}@media(prefers-reduced-motion:reduce){.single-stage .reward.feedback,.reward.unlocking .lock-shackle,.reward.unlocking .lock-svg,.reward.unlocking .unlock-flare{animation:none}}
.card-sheen-window{position:absolute;left:13.43%;top:13.57%;width:71.64%;height:72.86%;border-radius:2px;overflow:hidden;pointer-events:none;z-index:2;mix-blend-mode:screen}.card-sheen{position:absolute;top:-20%;bottom:-20%;width:35%;left:0;background:linear-gradient(90deg,transparent,#fff0cd80,transparent);transform:translateX(-170%) skewX(-16deg);animation:card-sweep 4.8s cubic-bezier(.36,0,.23,1) infinite}@keyframes card-sweep{0%,16%{opacity:0;transform:translateX(-170%) skewX(-16deg)}22%{opacity:.8}56%{opacity:.8}67%,100%{opacity:0;transform:translateX(400%) skewX(-16deg)}}@media(prefers-reduced-motion:reduce){.card-sheen{animation:none;opacity:0}}
.claimed-overlay{position:absolute;left:13.43%;top:13.57%;width:71.64%;height:72.86%;border-radius:2px;background:rgba(0,0,0,.48);opacity:0;z-index:3;pointer-events:none;transition:opacity .22s ease}.claimed-mark{position:absolute;left:19%;top:44%;width:62%;z-index:4;pointer-events:none;color:#fff5e7;font:600 10px -apple-system,BlinkMacSystemFont,sans-serif;transform:rotate(-12deg) scale(.92);opacity:0;transition:opacity .22s .06s,transform .3s .03s cubic-bezier(.16,1,.3,1)}.reward.claimed .claimed-overlay{opacity:1}.reward.claimed .claimed-mark{opacity:1;transform:rotate(-12deg) scale(1)}@media(prefers-reduced-motion:reduce){.claimed-overlay,.claimed-mark{transition:none}}
.compact body{width:260px;height:220px;min-height:0;padding:0;overflow:hidden}.compact main{width:260px;height:220px}.compact h1,.compact .hint,.compact .name,.compact .detail,.compact .status,.compact .actions,.compact .caption,.compact .release-downloads{display:none}.compact .panel{width:260px;height:220px;display:grid;place-items:center;margin:0;padding:0;border:0;border-radius:0;background:#0a0c10}.compact .single-stage{height:180px}.release-downloads{display:flex;justify-content:center;gap:18px;margin-top:24px}.release-downloads a{font-size:12px;color:#bcb4c5}</style><script>if(new URLSearchParams(location.search).has("compact"))document.documentElement.classList.add("compact");</script></head><body><main><h1>付费权益 · 奖励光效</h1><p class="hint">同一个奖励，从未解锁到待领取<br>宝石背后的光层持续流动</p><div class="panel"><div class="single-stage"><button class="reward" id="reward" type="button" disabled aria-label="付费权益未解锁"><span class="paid-light" aria-hidden="true"><i class="paid-halo"></i><i class="paid-rays"></i><i class="paid-glow"></i><i class="paid-spark s1"></i><i class="paid-spark s2"></i><i class="paid-spark s3"></i></span><span class="unlock-flare" aria-hidden="true"></span><img src="./paid-ready.svg?v=inner3" alt=""><span class="card-sheen-window" aria-hidden="true"><span class="card-sheen"></span></span><span class="claimed-overlay" aria-hidden="true"></span><span class="claimed-mark" aria-hidden="true">Claimed</span><svg class="lock-svg" viewBox="284 280 67 70" fill="none" aria-hidden="true"><g opacity=".8"><path class="lock-shackle" d="M333.75 295.75V294.25C333.75 293.753 333.934 293.276 334.263 292.924C334.591 292.573 335.036 292.375 335.5 292.375C335.964 292.375 336.409 292.573 336.737 292.924C337.066 293.276 337.25 293.753 337.25 294.25V295.75" stroke="#FFEBD3" stroke-width="1.4"/><path d="M337.6 294.75H333.4C333.014 294.75 332.7 295.086 332.7 295.5V298.5C332.7 298.914 333.014 299.25 333.4 299.25H337.6C337.987 299.25 338.3 298.914 338.3 298.5V295.5C338.3 295.086 337.987 294.75 337.6 294.75Z" fill="#FFEBD3"/><path d="M335.5 296.25V297.75" stroke="#765546"/></g></svg></button></div><p class="name" id="reward-name">未解锁</p><p class="detail" id="reward-detail">模拟解锁后，可点击奖励预览领取</p><p class="status" id="status" aria-live="polite">光效持续播放</p><div class="actions"><button id="unlock" type="button">模拟解锁</button><button id="reset" type="button">重置预览</button></div></div><p class="caption">放大预览 · 仅演示视觉与交互</p><nav class="release-downloads"><a href="./paid-reward.html" download>下载 HTML</a><a href="./source.zip" download>下载源码包</a></nav></main><script>
const reward=document.querySelector('#reward'),status=document.querySelector('#status'),unlock=document.querySelector('#unlock');let timer=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function finishUnlock(){reward.classList.remove('unlocking');reward.classList.add('unlocked');reward.disabled=false;reward.setAttribute('aria-label','已解锁，领取付费权益奖励');document.querySelector('#reward-name').textContent='待领取';document.querySelector('#reward-detail').textContent='点击奖励预览领取反馈';status.textContent='权益已解锁，可以领取';}
unlock.addEventListener('click',()=>{if(unlock.disabled)return;unlock.disabled=true;status.textContent='正在解锁';if(reduced.matches){finishUnlock();return}reward.classList.add('unlocking');timer=setTimeout(finishUnlock,1020);});
reward.addEventListener('click',()=>{if(reward.classList.contains('claimed'))return;reward.classList.remove('feedback');void reward.offsetWidth;reward.classList.add('feedback','claimed');reward.disabled=true;reward.setAttribute('aria-label','付费权益奖励已领取');document.querySelector('#reward-name').textContent='已领取';document.querySelector('#reward-detail').textContent='奖励已领取';status.textContent='领取成功';});
reward.addEventListener('animationend',event=>{if(event.animationName==='claim-large')reward.classList.remove('feedback')});
document.querySelector('#reset').addEventListener('click',()=>{clearTimeout(timer);reward.classList.remove('unlocking','unlocked','feedback','claimed');reward.disabled=true;reward.setAttribute('aria-label','付费权益未解锁');document.querySelector('#reward-name').textContent='未解锁';document.querySelector('#reward-detail').textContent='模拟解锁后，可点击奖励预览领取';status.textContent='光效持续播放';unlock.disabled=false;});
</script></body></html>
