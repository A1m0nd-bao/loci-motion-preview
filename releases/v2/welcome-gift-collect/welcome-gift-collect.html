<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豪华奖励迸发 · Welcome Gift</title><style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a080c;color:#eee;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
main{height:100%;margin:0;padding:0;max-width:none;position:relative}
.stage-wrap,.stage{position:absolute;inset:0;border:none;border-radius:0;box-shadow:none;background:transparent;overflow:visible}
.stage svg{display:block;width:100%;height:100%;min-height:0}
#claimButton{cursor:pointer}
#claimButton:hover{opacity:.95}
#claimButton:active{transform:translateY(1.5px)!important;opacity:.85}
.ui{position:fixed;left:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.ui>*{pointer-events:auto}
.ui button,button{border:1px solid rgba(74,56,68,.7);color:#e8dce2;background:rgba(22,18,26,.72);border-radius:8px;padding:7px 12px;font-size:12px}
.ui button:hover,button:hover{background:rgba(46,34,48,.9);border-color:#7a5a6e;color:#fff}
.collect-config{background:rgba(16,12,18,.78);border:1px solid rgba(230,170,200,.16);border-radius:10px;color:#cbb8c4;font-size:12px;max-width:280px;backdrop-filter:blur(10px)}
.collect-config summary{cursor:pointer;padding:8px 10px;color:#e8d4dc;list-style:none}
.collect-config summary::-webkit-details-marker{display:none}
.collect-config .fields{display:grid;gap:6px;padding:0 10px 10px}
.collect-config label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.collect-config input[type="text"],.collect-config input[type="number"]{
  border:1px solid #4a3844;color:#eee;background:#1e1720;border-radius:7px;padding:5px 7px;font-size:12px;width:124px}
.collect-config input[type="text"]{width:150px}
.collect-config .hint{margin:4px 0 0;font-size:11px;color:#8d7c86;line-height:1.45}
#collectLayer{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:visible}
#collectTrail{position:fixed;left:0;top:0;display:block;pointer-events:none;z-index:400}
#collectSpark{position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#fff 0 40%,rgba(255,236,200,.0) 70%);
  opacity:0;transform:translate(-40px,-40px) scale(0);pointer-events:none;z-index:401}
#collectAnchor{position:fixed;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;
  border:1px dashed rgba(255,214,160,.8);border-radius:50%;pointer-events:none;z-index:402}
#collectAnchor::before,#collectAnchor::after{content:"";position:absolute;background:rgba(255,214,160,.85)}
#collectAnchor::before{left:50%;top:2px;bottom:2px;width:1px;margin-left:-.5px}
#collectAnchor::after{top:50%;left:2px;right:2px;height:1px;margin-top:-.5px}
.compact .ui{display:none!important}
.compact body,.compact main,.compact .stage-wrap,.compact .stage{width:100%;height:100%;background:transparent}
.compact .stage svg{width:100%;height:100%;min-height:0}

        if (el) {
          const r = el.getBoundingClientRect();
          if (r.width || r.height || el.getClientRects().length) {
            return { x: r.left + r.width / 2, y: r.top + r.height / 2, source: "selector" };
          }
        }
      } catch (err) { /* 非法选择器则回退 */ }
    }
    const x = Number(config.endX);
    const y = Number(config.endY);
    if (Number.isFinite(x) && Number.isFinite(y)) return { x, y, source: "coords" };
    const mr = Number.isFinite(Number(config.marginRight)) ? Number(config.marginRight) : 36;
    const mt = Number.isFinite(Number(config.marginTop)) ? Number(config.marginTop) : 36;
    return { x: window.innerWidth - mr, y: mt, source: "viewport-tr" };
  }

  function autoControls(p0, p3) {
    const dx = p3.x - p0.x;
    const dy = p3.y - p0.y;
    const lift = Math.max(48, Math.abs(dx) * 0.32, Math.abs(dy) * 0.2);
    return {
      p1: { x: p0.x + dx * 0.18, y: p0.y - lift },
      p2: { x: p3.x - Math.max(56, Math.abs(dx) * 0.3), y: p3.y + Math.max(24, Math.abs(dy) * 0.25) }
    };
  }

  function getControls(p0, p3) {
    const auto = autoControls(p0, p3);
    return {
      p1: {
        x: Number.isFinite(Number(config.c1x)) ? Number(config.c1x) : auto.p1.x,
        y: Number.isFinite(Number(config.c1y)) ? Number(config.c1y) : auto.p1.y
      },
      p2: {
        x: Number.isFinite(Number(config.c2x)) ? Number(config.c2x) : auto.p2.x,
        y: Number.isFinite(Number(config.c2y)) ? Number(config.c2y) : auto.p2.y
      }
    };
  }

  function cubic(p0, p1, p2, p3, t) {
    const u = 1 - t, tt = t * t, uu = u * u;
    return {
      x: uu * u * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + tt * t * p3.x,
      y: uu * u * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + tt * t * p3.y
    };
  }

  function easeInCubic(t) { return t * t * t; }
  function easeCollect(t) {
    const u = 1 - t;
    return 3 * u * u * t * 0.16 + 3 * u * t * t * 0.12 + t * t * t;
  }

  function mountLayer() {
    const layer = $id("collectLayer");
    if (!layer || !document.body) return layer;
    if (layer.parentNode !== document.body) document.body.appendChild(layer);
    return layer;
  }

  function clientToSvg(svg, x, y) {
    if (!svg || !svg.createSVGPoint || !svg.getScreenCTM) return { x, y };
    const ctm = svg.getScreenCTM();
    if (!ctm || !ctm.inverse) return { x, y };
    const pt = svg.createSVGPoint();
    pt.x = x; pt.y = y;
    const p = pt.matrixTransform(ctm.inverse());
    return { x: p.x, y: p.y };
  }

  function shrinkGift(progress) {
    const root = $id("collectShrinkRoot") || $id("stageRig");
    if (!root || !state.start) return;
    const svg = root.ownerSVGElement || document.querySelector(".stage svg");
    const origin = clientToSvg(svg, state.start.x, state.start.y);
    const s = Math.max(0.04, 1 - easeInCubic(progress));
    const op = 1 - Math.min(1, progress);
    root.setAttribute("transform",
      `translate(${origin.x} ${origin.y}) scale(${s}) translate(${-origin.x} ${-origin.y})`);
    root.setAttribute("opacity", String(Math.max(0, op)));
    root.style.pointerEvents = progress > 0.15 ? "none" : "";
  }

  function restoreShrinkNode(el, clearTransform) {
    if (!el) return;
    if (clearTransform) el.removeAttribute("transform");
    el.setAttribute("opacity", "1");
    try {
      el.style.pointerEvents = "";
      if (clearTransform) {
        el.style.transform = "";
        el.style.transformOrigin = "";
      }
      el.style.opacity = "";
      el.style.visibility = "";
      el.style.display = "";
    } catch (err) { /* SVG 节点样式写失败时仍保留 opacity=1 */ }
  }

  function clearGiftShrink() {
    const shrinkRoot = $id("collectShrinkRoot");
    restoreShrinkNode(shrinkRoot, true);
    if (!shrinkRoot) restoreShrinkNode($id("stageRig"), true);
    else restoreShrinkNode($id("stageRig"), false);
    const wrap = document.querySelector(".stage-wrap");
    if (wrap) {
      wrap.style.transform = "";
      wrap.style.transformOrigin = "";
      wrap.style.opacity = "";
      wrap.style.pointerEvents = "";
    }
  }

  function syncAnchor() {
    const el = $id("collectAnchor");
    if (!el) return;
    const show = !!config.showAnchor;
    el.hidden = !show;
    if (!show) return;
    const end = getEndPoint();
    el.style.transform = `translate(${end.x}px, ${end.y}px)`;
  }

  function sizeCanvas() {
    const canvas = $id("collectTrail");
    if (!canvas) return null;
    const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
    const w = Math.max(1, window.innerWidth || 0);
    const h = Math.max(1, window.innerHeight || 0);
    const tw = Math.round(w * dpr), th = Math.round(h * dpr);
    if (canvas.width !== tw || canvas.height !== th) {
      canvas.width = tw;
      canvas.height = th;
    }
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.miterLimit = 2.4;
    ctx.imageSmoothingEnabled = true;
    if ("imageSmoothingQuality" in ctx) ctx.imageSmoothingQuality = "high";
    return ctx;
  }

  function clearTrail() {
    const canvas = $id("collectTrail");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    state.travelled = [];
  }

  function cubicDeriv(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return {
      x: 3 * u * u * (p1.x - p0.x) + 6 * u * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x),
      y: 3 * u * u * (p1.y - p0.y) + 6 * u * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y)
    };
  }

  function cubicDeriv2(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return {
      x: 6 * u * (p2.x - 2 * p1.x + p0.x) + 6 * t * (p3.x - 2 * p2.x + p1.x),
      y: 6 * u * (p2.y - 2 * p1.y + p0.y) + 6 * t * (p3.y - 2 * p2.y + p1.y)
    };
  }

  function makeSample(p0, p1, p2, p3, t) {
    const p = cubic(p0, p1, p2, p3, t);
    let d = cubicDeriv(p0, p1, p2, p3, t);
    let len = Math.hypot(d.x, d.y);
    if (len < 1e-5) {
      d = cubicDeriv(p0, p1, p2, p3, t < 1 ? Math.min(1, t + 0.002) : Math.max(0, t - 0.002));
      len = Math.hypot(d.x, d.y) || 1;
    }
    const tx = d.x / len, ty = d.y / len;
    const d2 = cubicDeriv2(p0, p1, p2, p3, t);
    const cross = d.x * d2.y - d.y * d2.x;
    const kappa = Math.abs(cross) / (len * len * len);
    return { x: p.x, y: p.y, t, tx, ty, nx: -ty, ny: tx, kappa, s: 0 };
  }

  function distToChordSq(p, a, b) {
    const abx = b.x - a.x, aby = b.y - a.y;
    const denom = abx * abx + aby * aby;
    const u = denom < 1e-12 ? 0 : Math.max(0, Math.min(1, ((p.x - a.x) * abx + (p.y - a.y) * aby) / denom));
    const x = a.x + abx * u, y = a.y + aby * u;
    const dx = p.x - x, dy = p.y - y;
    return dx * dx + dy * dy;
  }

  function flattenCubic(p0, p1, p2, p3, t0, t1) {
    const out = [];
    if (t1 < t0) { const tmp = t0; t0 = t1; t1 = tmp; }
    t0 = Math.max(0, Math.min(1, t0));
    t1 = Math.max(0, Math.min(1, t1));
    const tol = 0.35;
    const maxChord = 1.15;
    out.push(makeSample(p0, p1, p2, p3, t0));
    if (t1 - t0 < 1e-6) return out;
    function rec(u0, u1, depth) {
      const a = cubic(p0, p1, p2, p3, u0);
      const b = cubic(p0, p1, p2, p3, u1);
      const mid = (u0 + u1) * 0.5;
      const m = cubic(p0, p1, p2, p3, mid);
      const chord = Math.hypot(b.x - a.x, b.y - a.y);
      const dev = Math.sqrt(distToChordSq(m, a, b));
      if (depth < 10 && (dev > tol || chord > maxChord)) {
        rec(u0, mid, depth + 1);
        rec(mid, u1, depth + 1);
      } else {
        out.push(makeSample(p0, p1, p2, p3, u1));
      }
    }
    rec(t0, t1, 0);
    let acc = 0;
    out[0].s = 0;
    for (let i = 1; i < out.length; i++) {
      acc += Math.hypot(out[i].x - out[i - 1].x, out[i].y - out[i - 1].y);
      out[i].s = acc;
    }
    if (acc > 0) {
      for (let i = 0; i < out.length; i++) out[i].s /= acc;
    }
    return out;
  }

  function addSmoothEdge(ctx, pts, startMove) {
    if (!pts.length) return;
    if (startMove) ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 1) return;
    if (pts.length === 2) {
      ctx.lineTo(pts[1].x, pts[1].y);
      return;
    }
    ctx.lineTo((pts[0].x + pts[1].x) * 0.5, (pts[0].y + pts[1].y) * 0.5);
    for (let i = 1; i < pts.length - 1; i++) {
      ctx.quadraticCurveTo(
        pts[i].x, pts[i].y,
        (pts[i].x + pts[i + 1].x) * 0.5, (pts[i].y + pts[i + 1].y) * 0.5
      );
    }
    ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
  }

  function fillSmoothRibbon(ctx, samples, wHead, wTail, rgba) {
    if (!samples || samples.length < 2) return;
    const left = [], right = [];
    let halfHead = 0, halfTail = 0;
    for (let i = 0; i < samples.length; i++) {
      const p = samples[i];
      const k = p.s * p.s;
      let half = (wTail + (wHead - wTail) * k) * 0.5;
      if (p.kappa > 1e-6) half = Math.min(half, 0.82 / p.kappa);
      half = Math.max(0, half);
      if (i === 0) halfTail = half;
      if (i === samples.length - 1) halfHead = half;
      left.push({ x: p.x + p.nx * half, y: p.y + p.ny * half });
      right.push({ x: p.x - p.nx * half, y: p.y - p.ny * half });
    }
    const head = samples[samples.length - 1];
    const tail = samples[0];
    const angH = Math.atan2(head.ty, head.tx);
    const angT = Math.atan2(tail.ty, tail.tx);
    ctx.beginPath();
    addSmoothEdge(ctx, left, true);
    if (halfHead > 0.08) ctx.arc(head.x, head.y, halfHead, angH + Math.PI * 0.5, angH - Math.PI * 0.5, false);
    else ctx.lineTo(right[right.length - 1].x, right[right.length - 1].y);
    addSmoothEdge(ctx, right.slice().reverse(), false);
    if (halfTail > 0.08) ctx.arc(tail.x, tail.y, halfTail, angT - Math.PI * 0.5, angT + Math.PI * 0.5, false);
    ctx.closePath();
    ctx.fillStyle = "rgba(" + rgba[0] + "," + rgba[1] + "," + rgba[2] + "," + Number(rgba[3]).toFixed(3) + ")";
    ctx.fill();
  }

  function drawHead(ctx, p, dir, metrics, scale) {
    const m = metrics || state.metrics || buildSparkMetrics(measureGiftWidth());
    const s = scale == null ? 1 : scale;
    if (s <= 0.001) return;
    const coreR = m.coreR * s;
    const haloR = m.haloR * s;
    const hx = dir ? dir.x : 0, hy = dir ? dir.y : -1;
    let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, haloR);
    g.addColorStop(0, "rgba(255,248,236,0.20)");
    g.addColorStop(0.32, "rgba(255,220,160,0.08)");
    g.addColorStop(1, "rgba(232,170,90,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, haloR, 0, Math.PI * 2);
    ctx.fill();

    const bloomR = coreR * 1.55;
    g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, bloomR);
    g.addColorStop(0, "rgba(255,244,220,0.5)");
    g.addColorStop(0.55, "rgba(255,220,160,0.16)");
    g.addColorStop(1, "rgba(232,170,90,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, bloomR, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(hy, hx));
    g = ctx.createLinearGradient(-2 * coreR, 0, 1.6 * coreR, 0);
    g.addColorStop(0, "rgba(255,236,200,0)");
    g.addColorStop(0.55, "rgba(255,248,230,0.55)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, coreR * 2.08, Math.max(1, coreR * 0.28), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    g = ctx.createRadialGradient(p.x - 0.15 * coreR, p.y - 0.2 * coreR, 0, p.x, p.y, coreR);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.35, "rgba(255,246,226,0.96)");
    g.addColorStop(0.72, "rgba(255,226,180,0.55)");
    g.addColorStop(1, "rgba(255,220,170,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, coreR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTrailFrame(headT, tailT, headScale, fade) {
    const ctx = sizeCanvas();
    if (!ctx) return;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    const m = state.metrics || buildSparkMetrics(measureGiftWidth());
    const p0 = state.start, p3 = state.end;
    if (!p0 || !p3) return;
    const ctrl = getControls(p0, p3);
    const visible = (headT - tailT) > 0.0008;
    const samples = visible ? flattenCubic(p0, ctrl.p1, ctrl.p2, p3, tailT, headT) : [];
    state.travelled = samples;
    // 飞行中拖尾保持主体宽度；仅收尾阶段（尾端已开始追上）随光点一起收细
    const trailScale = (tailT > 0.0008) ? Math.max(0.08, headScale == null ? 1 : headScale) : 1;
    ctx.save();
    ctx.globalAlpha = fade == null ? 1 : Math.max(0, fade);
    if (samples.length >= 2) {
      fillSmoothRibbon(ctx, samples, m.trailOuter * trailScale, 0, [255, 214, 150, 0.13]);
      fillSmoothRibbon(ctx, samples, m.trailMid * trailScale, 0, [255, 236, 200, 0.42]);
      fillSmoothRibbon(ctx, samples, m.trailCore * trailScale, 0, [255, 252, 245, 0.9]);
    }
    if (headScale > 0.001 && fade > 0.001) {
      const head = cubic(p0, ctrl.p1, ctrl.p2, p3, headT);
      const deriv = cubicDeriv(p0, ctrl.p1, ctrl.p2, p3, headT);
      const len = Math.hypot(deriv.x, deriv.y) || 1;
      drawHead(ctx, head, { x: deriv.x / len, y: deriv.y / len }, m, headScale);
    }
    ctx.restore();
  }

  function drawTrail(head, sizeScale) {
    const headT = state.headT == null ? 1 : state.headT;
    const tailT = state.tailT == null ? 0 : state.tailT;
    if (head && !state.start) {
      const ctx = sizeCanvas();
      if (!ctx) return;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      drawHead(ctx, head, { x: 0, y: -1 }, state.metrics, sizeScale == null ? 1 : sizeScale);
      return;
    }
    drawTrailFrame(headT, tailT, sizeScale == null ? 1 : sizeScale, 1);
  }

  function setSpark(p, scale, opacity) {
    const el = $id("collectSpark");
    if (!el || !p) return;
    el.style.opacity = String(opacity);
    el.style.transform = `translate(${p.x}px, ${p.y}px) scale(${scale})`;
  }

  function emit(name, detail) {
    document.dispatchEvent(new CustomEvent(name, { bubbles: true, detail: detail || {} }));
  }

  function smoothstep(u) {
    const t = Math.max(0, Math.min(1, u));
    return t * t * (3 - 2 * t);
  }

  function coastScale(u) {
    if (u <= 0.12) return arrivalScale(1);
    return arrivalScale(1) * (1 - smoothstep((u - 0.12) / 0.88));
  }

  function coastFade(u) {
    if (u <= 0.5) return 1;
    return 1 - smoothstep((u - 0.5) / 0.5);
  }

  function finish(start, end, source, runId) {
    if (runId != null && runId !== state.runId) return;
    if (state.phase !== "collecting") return;
    state.phase = "collected";
    state.raf = 0;
    state.headT = 1;
    state.tailT = 1;
    clearTrail();
    setSpark(end, 0, 0);
    emit("welcome-gift:collect-complete", { start, end, source });
  }

  function coast(start, end, source, runId) {
    const t0 = performance.now();
    const coastMs = scaledMs(COAST_MS);
    const tick = (now) => {
      if (state.phase !== "collecting" || state.runId !== runId) return;
      const liveEnd = getEndPoint();
      end.x = liveEnd.x;
      end.y = liveEnd.y;
      source = liveEnd.source;
      state.end = { x: end.x, y: end.y };
      state.endSource = source;
      const u = Math.min(1, (now - t0) / coastMs);
      const tailT = easeInCubic(u);
      const headScale = coastScale(u);
      const fade = coastFade(u);
      state.headT = 1;
      state.tailT = tailT;
      const q = { x: end.x, y: end.y };
      setSpark(q, headScale, 0);
      if (u >= 1) {
        finish(start, end, source, runId);
        return;
      }
      drawTrailFrame(1, tailT, headScale, fade);
      state.raf = requestAnimationFrame(tick);
    };
    state.raf = requestAnimationFrame(tick);
  }

  function fly(start, end, source, runId) {
    const t0 = performance.now();
    const flyMs = state.reduce ? 0 : scaledMs(Number(config.flyMs) || 840);
    if (state.reduce || flyMs <= 0) {
      state.headT = 1;
      state.tailT = 1;
      setSpark(end, 0, 0);
      finish(start, end, source, runId);
      return;
    }
    const tick = (now) => {
      if (state.phase !== "collecting" || state.runId !== runId) return;
      const liveEnd = getEndPoint();
      end.x = liveEnd.x;
      end.y = liveEnd.y;
      source = liveEnd.source;
      const t = Math.min(1, (now - t0) / flyMs);
      const e = easeCollect(t);
      state.end = { x: end.x, y: end.y };
      state.endSource = source;
      state.headT = e;
      state.tailT = 0;
      const ctrl = getControls(start, end);
      const q = cubic(start, ctrl.p1, ctrl.p2, end, e);
      const headScale = arrivalScale(t);
      setSpark(q, headScale, 0);
      drawTrailFrame(e, 0, headScale, 1);
      if (t < 1) state.raf = requestAnimationFrame(tick);
      else coast(start, end, source, runId);
    };
    state.raf = requestAnimationFrame(tick);
  }

  function startCollect() {
    const t = typeof window.__giftNow === "function" ? window.__giftNow() : 1;
    if (!canCollect(t)) return false;
    mountLayer();
    const runId = ++state.runId;
    state.phase = "collecting";
    if (typeof window.__giftPause === "function") window.__giftPause();
    const start = getStartPoint();
    const endInfo = getEndPoint();
    const end = { x: endInfo.x, y: endInfo.y };
    let source = endInfo.source;
    state.start = start;
    state.end = end;
    state.endSource = source;
    state.travelled = [];
    state.headT = 0;
    state.tailT = 0;
    sizeCanvas();
    clearTrail();
    captureSparkMetrics();
    emit("welcome-gift:collect-start", { start, end, source });

    if (state.reduce) {
      shrinkGift(1);
      setSpark(end, 0, 0);
      finish(start, end, source, runId);
      return true;
    }

    const t0 = performance.now();
    const shrinkMs = scaledMs(Number(config.shrinkMs) || 280);
    setSpark(start, 1, 0);
    const shrinkTick = (now) => {
      if (state.phase !== "collecting" || state.runId !== runId) return;
      const p = Math.min(1, (now - t0) / shrinkMs);
      shrinkGift(p);
      const q = start;
      state.headT = 0;
      state.tailT = 0;
      state.travelled = [q];
      const ctx = sizeCanvas();
      if (ctx) {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        drawHead(ctx, q, { x: 0, y: -1 }, state.metrics, 1);
      }
      if (p < 1) state.raf = requestAnimationFrame(shrinkTick);
      else {
        shrinkGift(1);
        fly(start, end, source, runId);
      }
    };
    state.raf = requestAnimationFrame(shrinkTick);
    return true;
  }

  function resetCollect() {
    state.runId += 1;
    if (state.raf) cancelAnimationFrame(state.raf);
    state.raf = 0;
    state.phase = "opening";
    state.start = null;
    state.end = null;
    state.metrics = null;
    state.headT = 0;
    state.tailT = 0;
    try { clearTrail(); } catch (err) { /* 先恢复礼盒 */ }
    clearGiftShrink();
    const spark = $id("collectSpark");
    if (spark) {
      spark.style.opacity = "0";
      spark.style.transform = "translate(-40px, -40px) scale(0)";
    }
    emit("welcome-gift:collect-reset", {});
    syncAnchor();
    if (typeof window.__giftRewind === "function") window.__giftRewind();
  }

  function onClaimClick(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (e && e.stopPropagation) e.stopPropagation();
    startCollect();
  }

  function bindControls() {
    mountLayer();
    const sel = $id("collectSelector");
    const ex = $id("collectEndX");
    const ey = $id("collectEndY");
    const mr = $id("collectMarginRight");
    const mt = $id("collectMarginTop");
    const show = $id("collectShowAnchor");
    const scaleSel = $id("collectTimeScale");
    if (sel && !sel.value.trim() && config.endSelector) sel.value = config.endSelector;
    if (ex && ex.value === "" && Number.isFinite(Number(config.endX))) ex.value = String(config.endX);
    if (ey && ey.value === "" && Number.isFinite(Number(config.endY))) ey.value = String(config.endY);
    if (scaleSel && Number.isFinite(Number(config.motionTimeScale)) && Number(config.motionTimeScale) !== 1) {
      scaleSel.value = String(config.motionTimeScale);
    }
    const apply = () => {
      if (sel) config.endSelector = sel.value.trim();
      if (ex) config.endX = ex.value === "" ? NaN : Number(ex.value);
      if (ey) config.endY = ey.value === "" ? NaN : Number(ey.value);
      if (mr) config.marginRight = Number(mr.value);
      if (mt) config.marginTop = Number(mt.value);
      if (show) config.showAnchor = show.checked;
      if (scaleSel) {
        const s = Number(scaleSel.value);
        config.motionTimeScale = Number.isFinite(s) && s > 0 ? s : 1;
      }
      syncAnchor();
    };
    [sel, ex, ey, mr, mt, show, scaleSel].forEach((el) => {
      if (!el) return;
      el.addEventListener("input", apply);
      el.addEventListener("change", apply);
    });
    apply();
    ["claimHit", "claimButton", "btnBg"].forEach((id) => {
      const el = $id(id);
      if (el) el.addEventListener("click", onClaimClick);
    });
    sizeCanvas();
  }

  window.GiftCollect = {
    config,
    start: startCollect,
    reset: resetCollect,
    getEndPoint,
    getStartPoint,
    getControls,
    cubic,
    canCollect,
    get phase() { return state.phase; },
    markReady,
    syncAnchor,
    mountLayer,
    shrinkGift,
    clearGiftShrink,
    timeScale,
    scaledMs,
    sizeCanvas,
    drawTrail,
    drawTrailFrame,
    measureGiftWidth,
    buildSparkMetrics,
    captureSparkMetrics,
    arrivalScale,
    flattenCubic,
    cubicDeriv,
    fillSmoothRibbon,
    coastScale,
    coastFade,
    GIFT_VB_WIDTH,
    MIN_GIFT_W,
    COAST_MS,
    get metrics() { return state.metrics; },
    get headT() { return state.headT; },
    get tailT() { return state.tailT; }
  };

  window.addEventListener("resize", () => {
    if (state.phase === "collecting" && state.end) {
      const live = getEndPoint();
      state.end = { x: live.x, y: live.y };
      state.endSource = live.source;
    }
    sizeCanvas();
    syncAnchor();
  });
  window.addEventListener("scroll", syncAnchor, { passive: true });
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", () => { sizeCanvas(); syncAnchor(); });
    visualViewport.addEventListener("scroll", syncAnchor);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindControls);
  else bindControls();
})();
</script></html>
