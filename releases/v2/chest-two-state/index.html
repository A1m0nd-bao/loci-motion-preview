<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎁 豪华奖励迸发页 · Welcome Gift</title><style>
*{box-sizing:border-box}
body{margin:0;background:#09070d;color:#eee;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:1080px;margin:auto;padding:16px 24px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:18px;font-weight:600;letter-spacing:0.5px;color:#fce4d8;margin:0}
#phase{font-size:13px;color:#d8aabf;background:rgba(216,170,191,0.12);padding:4px 10px;border-radius:12px;border:1px solid rgba(216,170,191,0.2)}
.stage-wrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(230,170,200,0.18);box-shadow:0 18px 48px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.08)}
.stage{background:radial-gradient(ellipse at 50% 48%, #1f1425 0%, #130d19 55%, #08060b 100%);position:relative}
.stage svg{display:block;width:100%;height:min(76vh,780px);min-height:480px}
#claimButton{cursor:pointer;transition:transform 0.08s ease,opacity 0.08s ease}
#claimButton:hover{opacity:0.95}
#claimButton:active{transform:translateY(1.5px) !important;opacity:0.85}
nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0}
button,select{border:1px solid #4a3844;color:#eee;background:#1e1720;border-radius:8px;padding:8px 14px;font-size:13px;transition:all 0.15s}
button:hover{background:#2e2230;border-color:#7a5a6e;color:#fff}
button:active{transform:scale(0.97)}
input[type="range"]{min-width:180px;flex:1;accent-color:#f5b8d0}
#clock{font-variant-numeric:tabular-nums;color:#d8cbd3;font-weight:500;min-width:90px}


footer{font-size:12px;color:#857582;line-height:1.7;margin-top:6px}

  /* v2 iframe compact preview adaptation & download nav */
  .release-downloads {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 18px;
  }
  .release-downloads a {
    font-size: 12px;
    color: #bcb4c5;
    text-decoration: none;
    border-bottom: 1px solid #51475b;
    padding-bottom: 3px;
    transition: all 0.2s ease;
  }
  .release-downloads a:hover {
    color: #f5ebf8;
    border-color: #d48bd4;
  }
  .compact body {
    width: 760px;
    height: 685px;
    min-height: 0;
    padding: 0;
    margin: 0;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .compact main {
    width: 760px;
    height: 685px;
    max-width: 100%;
    padding: 0;
    margin: 0;
  }
  .compact header,
  .compact nav,
  .compact footer,
  .compact .release-downloads {
    display: none !important;
  }
  .compact .stage-wrap {
    width: 760px;
    height: 685px;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
  }
  .compact .stage {
    width: 760px;
    height: 685px;
    background: transparent;
  }
  .compact .stage svg {
    width: 760px;
    height: 685px;
    min-height: 0;
  }

function motion(t){
 // 1. Anticipation (蓄力 / 挤压): 0.15s - 0.48s
 const pressure = pr(t, 0.15, 0.44) * (1 - pr(t, 0.48, 0.52));
 const recoil = key(t, [[0,0], [0.48,0], [0.55,-0.38], [0.68,0.12], [0.85,0]]);
 const press = pressure + recoil;
 
 // Pre-blast rumble jitter inside chest
 let jitter = 0;
 if (t >= 0.32 && t <= 0.48) {
   jitter = Math.sin((t - 0.32) * 85.0) * pr(t, 0.32, 0.46) * 1.6;
 }
 
 // 2. Explosive Burst Snap Lid Morph u (0.50s - 0.64s)
 const u = key(t, [[0, 0], [0.50, 0], [0.54, 0.48], [0.62, 0.94], [0.70, 1.0]]);
 
 // Lid hinge angle overshoot & recoil oscillation
 const angle = key(t, [[0, 0], [0.51, 0], [0.66, 7.5], [0.82, -2.4], [0.98, 0.8], [1.18, 0]]);
 
 // Camera screen shake impulse at burst moment (0.50s)
 let shake_x = 0, shake_y = 0;
 if (t >= 0.50) {
   const dt = t - 0.50;
   const env = Math.exp(-17.0 * dt);
   shake_y = env * Math.sin(78.0 * dt) * 5.5;
   shake_x = env * Math.cos(90.0 * dt) * 2.2;
 }
 
 // Yellow spherical ambient glow behind chest: ABSENT initially, fades in when box opens
 const glow_op = pr(t, 0.50, 0.75);
 
 // Striped background light shafts (burst rays): NO rotation, clean scale
 const ray = key(t, [[0, 0.50], [0.50, 0.50], [0.66, 1.05], [0.82, 0.99], [0.98, 1.0]]);
 const ray_op = pr(t, 0.50, 0.64);
 
 // Core burst flare
 const flash_scale = key(t, [[0, 0.2], [0.50, 0.2], [0.53, 1.6], [0.65, 2.2]]);
 const flash_op = pr(t, 0.50, 0.52) * (1 - pr(t, 0.55, 0.68));
 
 // 3. Dispersed Gem Motion (宝石解耦独立飞跃，底部始终饱满不漏底)
 // Burst impulse curve
 const gem_k = key(t, [[0, 0], [0.50, 0], [0.66, 1.0], [0.82, -0.12], [0.96, 0.04], [1.10, 0]]);
 
 // Ticket rockets out of chest: ty from 80px (hidden) -> -32px (apex) -> 0
 const ty = key(t, [[0, 100], [0.50, 100], [0.68, -28.0], [0.86, 5.0], [1.02, -1.2], [1.18, 0]]);
 const tx = 12.0 * (1 - pr(t, 0.50, 0.95));
 const ta = key(t, [[0, 0], [0.50, 0], [0.68, -4.5], [0.88, 2.0], [1.05, -0.6], [1.20, 0]]);
 const ticket_text_op = pr(t, 0.54, 0.68);
 const ticket_op = pr(t, 0.48, 0.52);
 
 // Reward badge (+200 Gems): pops out alongside gems with punchy elastic scale
 const reward_scale = key(t, [[0, 0], [0.56, 0], [0.68, 1.20], [0.80, 0.94], [0.92, 1.0]]);
 const reward_ty = key(t, [[0, 24], [0.56, 24], [0.70, -6], [0.86, 0]]);
 const reward_lp = pr(t, 0.58, 0.76);
 const reward_text_op = pr(t, 0.64, 0.78);
 
 // Sparkles
 const sparkles_op = pr(t, 0.65, 0.82);
 
 // 4. Title & Sleek Lighter CTA Button Entrance
 const title_ty = key(t, [[0, -22], [0.35, -22], [0.66, 0]]);
 const title_op = pr(t, 0.35, 0.62);
 
 // Refined button: base scale 0.85 (sleek & lightweight, not bulky), smooth lift
 const btn_ty = key(t, [[0, 28], [0.78, 28], [0.94, -3], [1.06, 0]]);
 const btn_scale = key(t, [[0, 0.82], [0.78, 0.82], [0.94, 1.04], [1.06, 0.985], [1.14, 1.0]]);
 const btn_op = pr(t, 0.78, 0.92);
 
 const btn_sheen_x = lerp(430, 930, pr(t, 1.10, 1.52));
 const btn_sheen_op = pr(t, 1.10, 1.18) * (1 - pr(t, 1.44, 1.52));
 
 const idle_bob = t > 1.4 ? Math.sin((t - 1.4) * 3.5) * 1.5 : 0;
 
 return {
   u, press, jitter, angle,
   shake_x, shake_y,
   glow_op,
   flash_scale, flash_op,
   ray, ray_op,
   gem_k,
   idle_bob,
   ty: ty + idle_bob, tx, ta, ticket_op, ticket_text_op,
   reward_scale, reward_ty, reward_lp, reward_text_op,
   sparkles_op,
   title_ty, title_op,
   btn_ty, btn_scale, btn_op,
   btn_sheen_x, btn_sheen_op,
   release: t >= 0.50 ? 1 : 0
 };
