:root {

* { box-sizing: border-box; margin: 0; padding: 0; }

.mode-btn:hover {

.action-btn {

}
.action-btn:hover {
  background: rgba(249, 222, 167, 0.32);
  transform: translateY(-1px);
}
.toggle-btn {
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.85);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  padding: 5px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.15);

}
.toggle-btn:hover {
  background: rgba(255, 255, 255, 0.15);
}
.toggle-btn.active {
  background: rgba(249, 222, 167, 0.35);
  color: #FFF3D1;
  border-color: #F9DEA7;
}
.stage-container {
  position: relative;

  height: 420px;
  border: 1px solid #24212b;
  border-radius: 24px;
  background: radial-gradient(ellipse at 50% 60%, #1e1529 0%, #0b0813 75%);

  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
}
.stage-hint {
  margin-top: 14px;
  font-size: 12px;
  color: #c9bccc;
  line-height: 1.6;
  background: rgba(255, 255, 255, 0.05);

.release-downloads a {

    .ribbon-wrapper {
      position: relative;

      overflow: visible;

    /* 元素基础：默认隐藏，严格按几何中心进行位移旋转 */
    .ribbon-elem {
      opacity: 0;
      pointer-events: none;
      transform-box: fill-box;
      transform-origin: center center;
      will-change: transform, opacity;
    }

      animation-duration: 3.8s !important;

    .mode-cannons .ribbon-bl {

        animation-timing-function: cubic-bezier(0.12, 0.92, 0.22, 1);

      32% {

    /* 严格限制位移在画布 [15, 540] 内，绝不出界；单拐点连续曲线，零卡顿 */

    /* --------------------------------------------------------- */

    .mode-radial .ribbon-bl {
      animation: radialBLRibbon 1.60s forwards 0.01s;
    }

    @keyframes radialBLRibbon {
      0% {
        transform: translate(246px, -189px) scale(0.08) rotate(45deg);
        opacity: 0;
        animation-timing-function: cubic-bezier(0.12, 0.92, 0.22, 1);

<script>
  const ribbonScene = document.getElementById("ribbonScene");
  const stageContainer = document.getElementById("stageContainer");
  const btnModeCannons = document.getElementById("btnModeCannons");
  const btnModeRadial = document.getElementById("btnModeRadial");
  const btnSpray = document.getElementById("btnSpray");
  const btnSlow = document.getElementById("btnSlow");
  const btnAuto = document.getElementById("btnAuto");
  const hintBar = document.getElementById("hintBar");

  let currentMode = "cannons"; // 'cannons' | 'radial'
  let isSlow = false;
  let isAuto = false;
  let autoInterval = null;
  const isCompact = document.documentElement.classList.contains("compact");

  function triggerSpray() {
    ribbonScene.classList.remove("mode-cannons", "mode-radial");
    void ribbonScene.offsetWidth;
    ribbonScene.classList.add(currentMode === "cannons" ? "mode-cannons" : "mode-radial");
  }

  function setMode(mode) {
    currentMode = mode;
    btnModeCannons.classList.toggle("active", mode === "cannons");
    btnModeRadial.classList.toggle("active", mode === "radial");
    if (hintBar) {
      if (mode === "cannons") {
        hintBar.innerHTML = "<strong>【四角礼花筒】</strong> 0.3s 极速斜冲高空 (-220px) ➜ 滞空翻卷 ➜ 重力优雅飘落漫天消散 (点击屏幕触发)";
      } else {
        hintBar.innerHTML = "<strong>【中心放射爆开】</strong> 所有图元从中心弹芯 360° 爆射展开 ➜ 舒展翻飞 ➜ 重力漫天消散 (点击屏幕触发)";
      }
    }
    triggerSpray();
  }

  btnModeCannons.addEventListener("click", (e) => {
    e.stopPropagation();
    setMode("cannons");
  });

  btnModeRadial.addEventListener("click", (e) => {
    e.stopPropagation();
    setMode("radial");
  });

  btnSlow.addEventListener("click", (e) => {
    e.stopPropagation();
    isSlow = !isSlow;
    btnSlow.classList.toggle("active", isSlow);
    btnSlow.textContent = "⏱ 慢放: " + (isSlow ? "开 (0.4x)" : "关");
    ribbonScene.classList.toggle("slow-motion", isSlow);
    triggerSpray();
  });

  btnSpray.addEventListener("click", (e) => {
    e.stopPropagation();
    triggerSpray();
  });

  function startAuto() {
    if (autoInterval) clearInterval(autoInterval);
    autoInterval = setInterval(triggerSpray, isSlow ? 4500 : 2400);
  }

  btnAuto.addEventListener("click", (e) => {
    e.stopPropagation();
    isAuto = !isAuto;
    btnAuto.classList.toggle("active", isAuto);
    btnAuto.textContent = "自动连喷: " + (isAuto ? "开" : "关");
    if (isAuto) {
      triggerSpray();
      startAuto();
    } else {
      clearInterval(autoInterval);
    }
  });

  stageContainer.addEventListener("click", () => {
    triggerSpray();
  });

  // 在画廊预览模式下，自动开启循环连喷
  if (isCompact) {
    setTimeout(() => {
      triggerSpray();
      startAuto();
    }, 200);
  } else {
    setTimeout(triggerSpray, 180);
  }
</script>
