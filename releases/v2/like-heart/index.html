<script type="module">
import {animate} from '../vendor/motion-components.js';
import {defineLikeHeart} from './like-heart.js';
defineLikeHeart(animate);
const hearts=[...document.querySelectorAll('sipplay-like-heart')],status=document.querySelector('output');
for(const heart of hearts)heart.addEventListener('motion-change',e=>{
 for(const other of hearts)if(other!==heart)other.active=e.detail.active;
 status.textContent=e.detail.active?'已点赞':'未点赞';
});
document.querySelector('.replay').onclick=()=>{hearts.forEach(h=>h.replay());status.textContent='已点赞';};
for(const button of document.querySelectorAll('[data-size]'))button.onclick=()=>{
 const size=button.dataset.size;
 for(const b of document.querySelectorAll('[data-size]'))b.setAttribute('aria-pressed',String(b===button));
 document.querySelector('#large').setAttribute('size',size);
 const ref=document.querySelector('.source');ref.style.width=ref.style.height=(Number(size)*4)+'px';
};
</script>
