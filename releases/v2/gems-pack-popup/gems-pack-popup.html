<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Popup</title>
  <style>
    :root {
      --enter-ms: 80ms;
      --exit-ms: 200ms;
      --enter-ease: ease-out;
      --ray-swing: 8deg;
      --sai-top: env(safe-area-inset-top, 0px);
      --sai-right: env(safe-area-inset-right, 0px);
      --sai-bottom: env(safe-area-inset-bottom, 0px);
      --sai-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    .stage, .enter, .artwork, .artwork svg {
      overflow: visible;
    }
    .artwork svg { overflow: visible !important; }
    .stage {
      position: absolute;
      background: transparent;
    }
    .enter {
      position: relative;
      width: 100%;
      height: 100%;
      opacity: 0;
    }
    .is-ready.is-open .enter {
      animation: popup-fade var(--enter-ms) var(--enter-ease) both;
    }
    .is-ready.is-open.is-closing .enter {
      animation: popup-out var(--exit-ms) var(--enter-ease) both;
    }
    @keyframes popup-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popup-out { from { opacity: 1; } to { opacity: 0; } }
    .artwork {
      position: absolute;
      background: transparent;
      pointer-events: none;
    }
    .artwork svg {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .fg-ui, .cta-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-origin: 50% 50%;
    }
    .close-btn, .cta-btn { pointer-events: auto; }
    .cta-ui:not(.is-cta-armed),
    .cta-ui:not(.is-cta-armed) .cta-btn { pointer-events: none !important; }
    #popup-rays, #popup-foreground, #popup-cta-art, #popup-rays-spin, .popup-ray {
      pointer-events: none;
    }
    #popup-rays-spin, .popup-ray {
      transform-box: view-box;
      transform-origin: 50% 47.76786%;
    }
    .is-ready.is-open.is-rays-loop:not(.is-closing):not(.is-reduced):not(.is-page-hidden) #popup-rays-spin {
      animation: ray-spin 16s ease-in-out -8s infinite alternate;
    }
    .is-ready.is-open.is-rays-loop:not(.is-closing):not(.is-reduced):not(.is-page-hidden) .popup-ray {
      animation: ray-fan 14s ease-in-out infinite;
    }
    .popup-ray[data-ray="0"] { animation-duration: 12.8s; animation-delay: 0s; }
    .popup-ray[data-ray="1"] { animation-duration: 14.4s; animation-delay: 0s; }
    .popup-ray[data-ray="2"] { animation-duration: 16s; animation-delay: 0s; }
    .popup-ray[data-ray="3"] { animation-duration: 13.6s; animation-delay: 0s; }
    .popup-ray[data-ray="4"] { animation-duration: 15.2s; animation-delay: 0s; }
    .popup-ray[data-ray="5"] { animation-duration: 16.8s; animation-delay: 0s; }
    @keyframes ray-spin {
      from { transform: rotate(calc(-1 * var(--ray-swing))); }
      to { transform: rotate(var(--ray-swing)); }
    }
    @keyframes ray-fan {
      0% { transform: scale(1) rotate(0deg); opacity: 1; animation-timing-function: ease-in-out; }
      25% { transform: scale(1.06) rotate(1.4deg); opacity: 1; animation-timing-function: ease-in-out; }
      50% { transform: scale(1) rotate(0deg); opacity: 1; animation-timing-function: ease-in-out; }
      75% { transform: scale(0.97) rotate(-1.4deg); opacity: 0.62; animation-timing-function: ease-in-out; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .close-btn {
      position: absolute;
      z-index: 2;
      width: 36px;
      height: 36px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }
    .close-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
    }
    .close-btn svg { display: block; pointer-events: none; }
    .cta-btn {
      position: absolute;
      z-index: 3;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      transform-origin: 50% 50%;
    }
    .cta-btn.is-pressed { transform: scale(0.97); filter: brightness(1.16); }
    .cta-btn.is-releasing { animation: cta-release 220ms ease-out; }
    @keyframes cta-release {
      0% { transform: scale(0.97); filter: brightness(1.16); }
      55% { transform: scale(1.025); filter: brightness(1.07); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .cta-btn .label, .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .close-btn:focus, .cta-btn:focus, .replay-btn:focus { outline: none; }
    .close-btn:focus-visible,
    .cta-btn:focus-visible,
    .replay-btn:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.9);
      outline-offset: 3px;
    }
    .close-btn[hidden], .cta-btn[hidden], .replay-btn[hidden] { display: none !important; }
    .replay-btn {
      position: fixed;
      z-index: 4;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: max(16px, env(safe-area-inset-bottom, 0px));
      width: 36px;
      height: 36px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-reduced-motion: reduce) {
      .cta-btn.is-pressed { transform: none; }
      .cta-btn.is-releasing { animation: none; }
    }
  </style>

const RAY_ENTER_MS = 380;
const RAY_ENTER_DELAY_MS = 400;
const CTA_ENTER_DELAY_MS = 400;
const CTA_ENTER_MS = 300;

const SCALE_SEARCH_ITERS = 40;

const DEFAULT_CONTENT_BBOX = { x: 513, y: 168, width: 444, height: 535 };
const DEFAULT_CLOSE = { x: 915, y: 214, width: 36, height: 36 };
const DEFAULT_CTA = { x: 545, y: 646, width: 349, height: 51 };

    y: Number(src.y || 0),

function asPoint(value, defaults) {

  const y = bbox.y;
  const w = bbox.width;
  const h = bbox.height;

    [x + w, y],
    [x, y + h],

  ];
}

function rayMotionOverflowVb(origin, bbox, angleDeg, radialScale) {
  if (bbox.width <= 0 || bbox.height <= 0) return 0;
  const scale = Math.max(1, Number(radialScale));
  const ox = Number(origin.x);
  const oy = Number(origin.y);

  const minY = bbox.y;
  const maxX = bbox.x + bbox.width;
  const maxY = bbox.y + bbox.height;

  const rad = (Math.max(0, Number(angleDeg)) * Math.PI) / 180;
  const angles = rad > 0 ? [0, rad, -rad] : [0];

      const ry = oy + dx * sinA + dy * cosA;

      const b = keys[i];
      const span = b[0] - a[0];

        y: a[2] + (b[2] - a[2]) * p,

        opacity: a[4] + (b[4] - a[4]) * p,

}

}

function raysEntrance(tMs, delayMs) {
  if (delayMs == null) delayMs = RAY_ENTER_DELAY_MS;

function ctaEntrance(tMs, delayMs) {
  if (delayMs == null) delayMs = CTA_ENTER_DELAY_MS;

    SUBJECT_KEYS[SUBJECT_KEYS.length - 1][0],

      artwork: { x: 0, y: 0, width: 0, height: 0 },

      motionPad: 0,
      rotationOverflowVb: rotOverflow,

      hasClose: hasClose,
      hasCta: hasCta,

    const stageH = content.height * scaleValue;

      x: inner.x + (inner.width - stageW) / 2,
      y: inner.y + (inner.height - stageH) / 2,

        const cx = rect.x + rect.width / 2;
        const cy = rect.y + rect.height / 2;

        const maxCx = inner.x + inner.width - half;
        const minCy = inner.y + half;

        let dy = 0;

      closeRel: { x: closeVisualRect.x - stage.x, y: closeVisualRect.y - stage.y },
      ctaVisual: ctaVisual,
      ctaHitbox: ctaHit,

        x: ctaHit.x - stage.x,
        y: ctaHit.y - stage.y,

        y: ctaVisual.y - stage.y,
        width: ctaVisual.width,
        height: ctaVisual.height,

  if (!best.ok && scale > 0) {
    let lo = 0;
    let hi = scale;
    let found = null;
    for (let i = 0; i < SCALE_SEARCH_ITERS; i++) {
      const mid = (lo + hi) / 2;
      const cand = place(mid);
      if (cand.ok) {
        found = cand;
        lo = mid;
      } else {
        hi = mid;
      }
    }
    if (found) best = found;
    else {
      best = place(scale);
      best.ok = false;
      best.reason = "could-not-fit-controls-and-stage";
    }
  }

  const widthRatio = fitW ? availW / fitW : 0;
  const heightRatio = fitH ? availH / fitH : 0;
  let constrainedBy = "max";
  if (best.scale >= maxScale - EPSILON) constrainedBy = "max";
  else if (heightRatio < widthRatio) constrainedBy = "height";
  else constrainedBy = "width";

  best.gutter = { top: gt, right: gr, bottom: gb, left: gl };
  best.available = { width: availW, height: availH };
  best.safeBounds = pad;
  best.hasClose = hasClose;
  best.hasCta = hasCta;
  best.constrainedBy = constrainedBy;
  best.rotationOverflowVb = rotOverflow;
  best.rayOrigin = rayOrigin;
  best.sizeFactor = sizeFactor;
  best.maxScale = maxScale;
  best.raySwingDeg = raySwing;
  best.rayBurstScale = rayBurst;
  best.rayFanScale = rayFan;
  return best;
}
  /* LAYOUT_MATH_END */

  var EXIT_MS = 200;
  var SVG_NS = "http://www.w3.org/2000/svg";
  var viewportEl = document.getElementById("viewport");
  var stageEl = document.getElementById("stage");
  var enterEl = document.getElementById("enter");
  var artworkEl = document.getElementById("artwork");
  var fgUi = document.getElementById("fgUi");
  var ctaUi = document.getElementById("ctaUi");
  var closeBtn = document.getElementById("closeBtn");
  var ctaBtn = document.getElementById("ctaBtn");
  var replayBtn = document.getElementById("replayBtn");
  var liveEl = document.getElementById("live");
  var root = document.documentElement;
  var isOpen = false;
  var isClosing = false;
  var layoutRaf = 0;
  var motionRaf = 0;
  var motionGen = 0;
  var closeTimer = 0;
  var currentLayout = null;
  var currentConfig = null;
  var enterStarted = 0;
  var entranceDone = false;
  var raysLoopArmed = false;
  var pressScale = 1;
  var pressBright = 1;

  function parseRectAttr(value) {
    var parts = String(value || "").trim().split(/[\s,]+/).map(Number);
    if (parts.length !== 4 || parts.some(function (n) { return !Number.isFinite(n); })) return null;
    return { x: parts[0], y: parts[1], width: parts[2], height: parts[3] };
  }
  function parsePointAttr(value) {
    var parts = String(value || "").trim().split(/[\s,]+/).map(Number);
    if (parts.length !== 2 || parts.some(function (n) { return !Number.isFinite(n); })) return null;
    return { x: parts[0], y: parts[1] };
  }
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function currentMotion() {
    return motionState(isOpen && !isClosing, reducedMotion(), !!document.hidden);
  }

  function readConfig() {
    var cfg = {};
    var jsonEl = document.getElementById("popup-config");
    if (jsonEl) {
      try { cfg = JSON.parse(jsonEl.textContent || "{}") || {}; }
      catch (err) { cfg = {}; }
    }
    var viewBox = cfg.viewBox || parseRectAttr(viewportEl.getAttribute("data-view-box"));
    var contentBBox = cfg.contentBBox || parseRectAttr(viewportEl.getAttribute("data-content-bbox"));
    var closeButton = cfg.closeButton || parseRectAttr(viewportEl.getAttribute("data-close-button"));
    var ctaButton = cfg.ctaButton || parseRectAttr(viewportEl.getAttribute("data-cta-button"));
    var rayOrigin = cfg.rayOrigin || parsePointAttr(viewportEl.getAttribute("data-ray-origin"));
    var svg = artworkEl.querySelector("svg");
    if (svg && svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width) {
      var vb = svg.viewBox.baseVal;
      if (!viewBox || !viewBox.width) viewBox = { x: vb.x, y: vb.y, width: vb.width, height: vb.height };
    }
    if (!viewBox || !viewBox.width) viewBox = { x: 0, y: 0, width: 1440, height: 896 };
    if (!contentBBox || !contentBBox.width) contentBBox = viewBox;
    if (!closeButton) closeButton = { x: 0, y: 0, width: 0, height: 0 };
    if (!ctaButton) ctaButton = { x: 0, y: 0, width: 0, height: 0 };
    if (!rayOrigin) rayOrigin = { x: 720, y: 428 };
    return {
      viewBox: viewBox,
      contentBBox: contentBBox,
      closeButton: closeButton,
      ctaButton: ctaButton,
      rayOrigin: rayOrigin,
      maxScale: cfg.maxScale != null ? Number(cfg.maxScale) : Number(viewportEl.getAttribute("data-max-scale") || MAX_SCALE),
      sizeFactor: cfg.sizeFactor != null ? Number(cfg.sizeFactor) : SIZE_FACTOR,
      raySwingDeg: cfg.raySwingDeg != null ? Number(cfg.raySwingDeg) : RAY_SWING_DEG,
      rayBurstScale: cfg.rayBurstScale != null ? Number(cfg.rayBurstScale) : RAY_BURST_SCALE,
      rayFanScale: cfg.rayFanScale != null ? Number(cfg.rayFanScale) : RAY_FAN_SCALE,
    };
  }

  function getViewportSize() {
    var vv = window.visualViewport;
    if (vv && vv.width && vv.height) {
      return { width: vv.width, height: vv.height, offsetLeft: vv.offsetLeft || 0, offsetTop: vv.offsetTop || 0 };
    }
    return {
      width: window.innerWidth || document.documentElement.clientWidth,
      height: window.innerHeight || document.documentElement.clientHeight,
      offsetLeft: 0,
      offsetTop: 0,
    };
  }

  function safeInsets() {
    var raw = viewportEl.getAttribute("data-safe-area");
    if (raw) {
      var parts = String(raw).trim().split(/[\s,]+/).map(Number);
      if (parts.length === 4 && parts.every(function (n) { return Number.isFinite(n); })) return parts;
    }
    var styles = window.getComputedStyle(document.documentElement);
    function px(name) {
      var v = parseFloat(styles.getPropertyValue(name));
      return Number.isFinite(v) ? v : 0;
    }
    return [px("--sai-top"), px("--sai-right"), px("--sai-bottom"), px("--sai-left")];
  }

  function applyViewportBox(size) {
    viewportEl.style.position = "fixed";
    viewportEl.style.left = size.offsetLeft + "px";
    viewportEl.style.top = size.offsetTop + "px";
    viewportEl.style.width = size.width + "px";
    viewportEl.style.height = size.height + "px";
  }

  function layer(id) {
    return artworkEl.querySelector("#" + id);
  }

  function prepareSvg() {
    var svg = artworkEl.querySelector("svg");
    if (!svg) return;
    svg.setAttribute("overflow", "visible");
    svg.style.overflow = "visible";
    if (svg.style.clipPath !== undefined) svg.style.clipPath = "none";
  }

  function ensureRayWrappers() {
    var spin = layer("popup-rays-spin");
    if (!spin) return 0;
    if (spin.getAttribute("data-ray-wrapped") === "1") return 0;
    var kids = [];
    var nodes = spin.childNodes;
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.nodeType === 1 && isWrappableRayTag(el.tagName) && !isRayWrapGroup(el)) kids.push(el);
    }
    kids.forEach(function (el, idx) {
      var g = document.createElementNS((spin.namespaceURI || SVG_NS), "g");
      g.setAttribute("class", "popup-ray");
      g.setAttribute("data-popup-ray-wrap", "1");
      g.setAttribute("data-ray", String(idx));
      spin.insertBefore(g, el);
      g.appendChild(el);
    });
    spin.setAttribute("data-ray-wrapped", "1");
    return kids.length;
  }

  function applyRayOrigins() {
    if (!currentConfig || !currentConfig.viewBox.width) return;
    var origin =
      (currentConfig.rayOrigin.x / currentConfig.viewBox.width) * 100 + "% " +
      (currentConfig.rayOrigin.y / currentConfig.viewBox.height) * 100 + "%";
    var swing = (currentConfig.raySwingDeg != null ? currentConfig.raySwingDeg : RAY_SWING_DEG) + "deg";
    root.style.setProperty("--ray-swing", swing);
    var spin = layer("popup-rays-spin");
    var nodes = [];
    if (spin) nodes.push(spin);
    artworkEl.querySelectorAll(".popup-ray").forEach(function (el) { nodes.push(el); });
    nodes.forEach(function (el) {
      el.style.transformBox = "view-box";
      el.style.transformOrigin = origin;
    });
  }

  function setRaysLoop(on) {
    root.classList.toggle("is-rays-loop", !!on);
    raysLoopArmed = !!on;
  }

  function setSvgPose(el, tx, ty, sc, rot, ox, oy, press, px, py) {
    if (!el) return;
    var parts = ["translate(" + tx + ", " + ty + ")"];
    if (sc !== 1 || rot) {
      parts.push("translate(" + ox + ", " + oy + ")");
      if (rot) parts.push("rotate(" + rot + ")");
      if (sc !== 1) parts.push("scale(" + sc + ")");
      parts.push("translate(" + (-ox) + ", " + (-oy) + ")");
    }
    if (press && press !== 1) {
      parts.push("translate(" + px + ", " + py + ")", "scale(" + press + ")", "translate(" + (-px) + ", " + (-py) + ")");
    }
    if (parts.length === 1 && tx === 0 && ty === 0) el.removeAttribute("transform");
    else el.setAttribute("transform", parts.join(" "));
  }

  function setCtaArmed(on) {
    ctaUi.style.pointerEvents = on ? "auto" : "none";
    ctaBtn.style.pointerEvents = on ? "auto" : "none";
    ctaBtn.tabIndex = on ? 0 : -1;
    if (on) ctaBtn.removeAttribute("aria-hidden");
    else ctaBtn.setAttribute("aria-hidden", "true");
    ctaUi.classList.toggle("is-cta-armed", !!on);
  }

  function clearLayerMotion() {
    ["popup-rays", "popup-foreground", "popup-cta-art"].forEach(function (id) {
      var el = layer(id);
      if (!el) return;
      el.removeAttribute("transform");
      el.style.opacity = "";
      el.style.filter = "";
    });
    fgUi.style.transform = "";
    fgUi.style.opacity = "";
    ctaUi.style.transform = "";
    ctaUi.style.opacity = "";
  }

  function entranceNow(now, motion) {
    var rest = { scale: 1, y: 0, rotate: 0, opacity: 1, done: true };
    if (!isOpen) {
      return { subject: { scale: 1, y: 0, rotate: 0, opacity: 0, done: true }, rays: rest, cta: rest, done: true };
    }
    if (!motion.entranceMotionEnabled) {
      return { subject: rest, rays: rest, cta: rest, done: true };
    }
    var t = enterStarted ? now - enterStarted : 0;
    var subject = subjectEntrance(t);
    var rays = raysEntrance(t, RAY_ENTER_DELAY_MS);
    var cta = ctaEntrance(t, CTA_ENTER_DELAY_MS);
    return {
      subject: subject,
      rays: rays,
      cta: cta,
      done: !!(subject.done && rays.done && cta.done),
    };
  }

  function applyLayerMotion(now) {
    var motion = currentMotion();
    var layout = currentLayout;
    var cfg = currentConfig;
    if (!layout || !cfg) return { motion: motion, moving: false };
    var ent = entranceNow(now || performance.now(), motion);
    var scale = layout.scale || 1;
    var toVb = function (css) { return scale ? css / scale : 0; };
    var ox = cfg.contentBBox.x + cfg.contentBBox.width / 2;
    var oy = cfg.contentBBox.y + cfg.contentBBox.height / 2;
    var cta = cfg.ctaButton;
    var ctaOx = cta.x + cta.width / 2;
    var ctaOy = cta.y + cta.height / 2;
    var rayOx = cfg.rayOrigin.x;
    var rayOy = cfg.rayOrigin.y;
    var fg = ent.subject;
    var ray = ent.rays;
    var ctaE = ent.cta;
    setSvgPose(layer("popup-foreground"), 0, toVb(fg.y), fg.scale, 0, ox, oy);
    setSvgPose(layer("popup-cta-art"), 0, toVb(ctaE.y), ctaE.scale, 0, ox, oy, pressScale, ctaOx, ctaOy);
    setSvgPose(layer("popup-rays"), 0, 0, ray.scale, 0, rayOx, rayOy);
    var fgEl = layer("popup-foreground");
    var ctaArt = layer("popup-cta-art");
    var raysEl = layer("popup-rays");
    if (fgEl) fgEl.style.opacity = String(fg.opacity);
    if (ctaArt) {
      ctaArt.style.opacity = String(ctaE.opacity);
      ctaArt.style.filter = pressBright === 1 ? "" : "brightness(" + pressBright + ")";
    }
    if (raysEl) raysEl.style.opacity = String(ray.opacity);
    fgUi.style.transform = "translate(0px, " + fg.y + "px) scale(" + fg.scale + ")";
    fgUi.style.opacity = String(fg.opacity);
    ctaUi.style.transform = "translate(0px, " + ctaE.y + "px) scale(" + ctaE.scale + ")";
    ctaUi.style.opacity = String(ctaE.opacity);
    var ctaOn = currentMotion().entranceMotionEnabled
      ? ctaE.opacity > 0
      : isCtaInteractive(enterStarted ? (now || performance.now()) - enterStarted : 0, isOpen, isClosing, reducedMotion());
    if (isClosing || !isOpen) ctaOn = false;
    if (!layout.hasCta) ctaOn = false;
    setCtaArmed(ctaOn);
    if (ent.done) {
      entranceDone = true;
      if (!raysLoopArmed && motion.raysLoopEnabled) {
        window.requestAnimationFrame(function () {
          if (!isOpen || isClosing || !entranceDone || raysLoopArmed) return;
          if (!currentMotion().raysLoopEnabled) return;
          setRaysLoop(true);
        });
      }
    }
    return { motion: motion, moving: !ent.done, ent: ent };
  }

  function tickMotion(now) {
    motionRaf = 0;
    var info = applyLayerMotion(now);
    if (isOpen && !isClosing && info && info.moving) {
      motionRaf = window.requestAnimationFrame(function (t) {
        if (tickMotion._gen !== motionGen) return;
        tickMotion(t);
      });
    }
  }
  tickMotion._gen = 0;

  function requestMotion() {
    tickMotion._gen = motionGen;
    if (!motionRaf) {
      motionRaf = window.requestAnimationFrame(function (t) {
        if (tickMotion._gen !== motionGen) return;
        tickMotion(t);
      });
    }
  }

  function syncMotionClasses() {
    var motion = currentMotion();
    root.classList.toggle("is-reduced", reducedMotion());
    root.classList.toggle("is-page-hidden", !!document.hidden);
    if (!motion.raysLoopEnabled && raysLoopArmed) setRaysLoop(false);
    if (motion.raysLoopEnabled && entranceDone && !raysLoopArmed) setRaysLoop(true);
  }

  function applyLayout() {
    var size = getViewportSize();
    applyViewportBox(size);
    currentConfig = readConfig();
    currentLayout = computePopupLayout({
      viewport: { width: size.width, height: size.height },
      viewBox: currentConfig.viewBox,
      contentBBox: currentConfig.contentBBox,
      closeButton: currentConfig.closeButton,
      ctaButton: currentConfig.ctaButton,
      rayOrigin: currentConfig.rayOrigin,
      maxScale: currentConfig.maxScale,
      sizeFactor: currentConfig.sizeFactor,
      raySwingDeg: currentConfig.raySwingDeg,
      rayBurstScale: currentConfig.rayBurstScale,
      rayFanScale: currentConfig.rayFanScale,
      safe: safeInsets(),
    });
    var layout = currentLayout;
    stageEl.style.left = layout.stage.x + "px";
    stageEl.style.top = layout.stage.y + "px";
    stageEl.style.width = layout.stage.width + "px";
    stageEl.style.height = layout.stage.height + "px";
    artworkEl.style.left = layout.artwork.x + "px";
    artworkEl.style.top = layout.artwork.y + "px";
    artworkEl.style.width = layout.artwork.width + "px";
    artworkEl.style.height = layout.artwork.height + "px";
    closeBtn.hidden = !layout.hasClose;
    if (layout.hasClose) {
      closeBtn.style.left = layout.closeRel.x + "px";
      closeBtn.style.top = layout.closeRel.y + "px";
    }
    ctaBtn.hidden = !layout.hasCta;
    if (layout.hasCta) {
      ctaBtn.style.left = layout.ctaRel.x + "px";
      ctaBtn.style.top = layout.ctaRel.y + "px";
      ctaBtn.style.width = layout.ctaRel.width + "px";
      ctaBtn.style.height = layout.ctaRel.height + "px";
      var vis = layout.ctaVisualRel;
      var hit = layout.ctaRel;
      ctaBtn.style.transformOrigin =
        (vis.x - hit.x + vis.width / 2) + "px " +
        (vis.y - hit.y + vis.height / 2) + "px";
    }
    prepareSvg();
    ensureRayWrappers();
    applyRayOrigins();
    applyLayerMotion(performance.now());
    return layout;
  }

  function requestLayout() {
    if (layoutRaf) return;
    layoutRaf = window.requestAnimationFrame(function () {
      layoutRaf = 0;
      applyLayout();
    });
  }

  function openPopup(replay) {
    if (closeTimer) { window.clearTimeout(closeTimer); closeTimer = 0; }
    motionGen += 1;
    isClosing = false;
    isOpen = true;
    pressScale = 1;
    pressBright = 1;
    entranceDone = false;
    root.classList.remove("is-closing");
    replayBtn.hidden = true;
    stageEl.hidden = false;
    setCtaArmed(false);
    if (replay) {
      root.classList.remove("is-open", "is-ready");
      setRaysLoop(false);
      clearLayerMotion();
      void enterEl.offsetWidth;
    } else {
      setRaysLoop(false);
    }
    applyLayout();
    enterStarted = performance.now();
    root.classList.add("is-ready", "is-open");
    syncMotionClasses();
    requestMotion();
    window.setTimeout(function () {
      if (isOpen && !closeBtn.hidden) closeBtn.focus({ preventScroll: true });
    }, 0);
  }

  function finishClose() {
    isOpen = false;
    isClosing = false;
    enterStarted = 0;
    entranceDone = false;
    motionGen += 1;
    root.classList.remove("is-open", "is-closing");
    setRaysLoop(false);
    setCtaArmed(false);
    clearLayerMotion();
    stageEl.hidden = true;
    replayBtn.hidden = false;
    replayBtn.focus({ preventScroll: true });
    syncMotionClasses();
  }

  function closePopup() {
    if (!isOpen || isClosing) return;
    isClosing = true;
    setRaysLoop(false);
    setCtaArmed(false);
    root.classList.add("is-closing");
    syncMotionClasses();
    var ms = reducedMotion() ? Math.min(EXIT_MS, 160) : EXIT_MS;
    closeTimer = window.setTimeout(finishClose, ms);
  }

  function onKey(event) {
    if (event.key === "Escape" && isOpen) {
      event.preventDefault();
      closePopup();
      return;
    }
    if (event.key !== "Tab" || !isOpen) return;
    var focusable = [];
    if (!closeBtn.hidden && !stageEl.hidden) focusable.push(closeBtn);
    if (!ctaBtn.hidden && !stageEl.hidden && ctaBtn.tabIndex >= 0) focusable.push(ctaBtn);
    if (!focusable.length) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (event.shiftKey) {
      if (document.activeElement === first) { event.preventDefault(); last.focus(); }
    } else if (document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function setPressed(on) {
    pressScale = on ? 0.97 : 1;
    pressBright = on ? 1.16 : 1;
    ctaBtn.classList.toggle("is-pressed", on);
    if (!on) {
      ctaBtn.classList.remove("is-releasing");
      void ctaBtn.offsetWidth;
      if (!reducedMotion()) ctaBtn.classList.add("is-releasing");
    }
    applyLayerMotion(performance.now());
  }

  function onCtaPointerDown(event) {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    try { ctaBtn.setPointerCapture(event.pointerId); } catch (err) {}
    setPressed(true);
  }
  function onCtaPointerUp() {
    if (pressScale === 1 && pressBright === 1) return;
    setPressed(false);
  }
  function onCtaClick(event) {
    event.preventDefault();
    ctaBtn.dispatchEvent(new CustomEvent("popup:primary", { bubbles: true, cancelable: false, detail: { source: "cta" } }));
    if (liveEl) {
      liveEl.textContent = "";
      liveEl.textContent = "演示点击已触发";
    }
  }
  function onCtaKeyDown(event) {
    if (event.key === " " || event.key === "Enter") setPressed(true);
  }
  function onCtaKeyUp(event) {
    if (event.key === " " || event.key === "Enter") setPressed(false);
  }

  closeBtn.addEventListener("click", closePopup);
  replayBtn.addEventListener("click", function () { openPopup(true); });
  ctaBtn.addEventListener("pointerdown", onCtaPointerDown);
  ctaBtn.addEventListener("pointerup", onCtaPointerUp);
  ctaBtn.addEventListener("pointercancel", onCtaPointerUp);
  ctaBtn.addEventListener("lostpointercapture", onCtaPointerUp);
  ctaBtn.addEventListener("click", onCtaClick);
  ctaBtn.addEventListener("keydown", onCtaKeyDown);
  ctaBtn.addEventListener("keyup", onCtaKeyUp);
  ctaBtn.addEventListener("animationend", function () { ctaBtn.classList.remove("is-releasing"); });
  document.addEventListener("keydown", onKey);
  window.addEventListener("resize", requestLayout);
  document.addEventListener("visibilitychange", function () {
    syncMotionClasses();
  });
  if (window.matchMedia) {
    window.matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", function () {
      syncMotionClasses();
      requestMotion();
    });
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", requestLayout);
    window.visualViewport.addEventListener("scroll", requestLayout);
  }

  openPopup(false);
})();
  </script>
</body>
