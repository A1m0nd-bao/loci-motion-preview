const guideArt=document.querySelector('#guide'),popup=guideArt.querySelector('.popup-window'),demo=guideArt.querySelector('.demo-content'),control=guideArt.querySelector('.actual-control'),play=document.querySelector('#play'),replayButton=document.querySelector('#replay'),steps=[document.querySelector('#step1'),document.querySelector('#step2'),document.querySelector('#step3')],scrub=document.querySelector('#scrub'),collapse=document.querySelector('#collapse'),flowToggle=document.querySelector('#flow-toggle'),actualHit=document.querySelector('.actual-hit'),actualLabelHit=document.querySelector('.actual-label-hit');
function createGuideController(element,content){const tracks=content.getAnimations({subtree:true}).filter(a=>a instanceof CSSAnimation),primary=tracks.find(a=>a.animationName==='feature-out');let paused=false,collapsed=false,completed=false,speed=1,restartEffect=null,restartToken=0;function update(ms){scrub.value=Math.min(5599,ms);steps[0].classList.toggle('active',ms<1844);steps[1].classList.toggle('active',ms>=1844&&ms<2944);steps[2].classList.toggle('active',ms>=2944)}function cancelRestart(){restartToken++;if(restartEffect){restartEffect.cancel();restartEffect=null}}function setComplete(next){completed=next;element.classList.toggle('is-demo-complete',next)}function setDisabled(next){play.disabled=next;replayButton.disabled=next;scrub.disabled=next;for(const s of steps)s.disabled=next}function resetContent(){setComplete(false);paused=false;play.textContent='暂停引导';for(const a of tracks){a.currentTime=0;a.playbackRate=speed;collapsed?a.pause():a.play()}update(0)}function seek(ms){cancelRestart();for(const a of tracks){a.pause();a.currentTime=ms}paused=true;setComplete(ms>=5600);play.textContent=completed?'重播演示':'播放引导';update(ms)}function setCollapsed(next){if(next===collapsed)return;cancelRestart();collapsed=next;element.classList.toggle('is-collapsed',next);element.setAttribute('aria-hidden',String(next));actualLabelHit.setAttribute('aria-expanded',String(!next));collapse.textContent=next?'展开引导':'收起引导';collapse.setAttribute('aria-expanded',String(!next));scrub.classList.toggle('hidden-progress',next);setDisabled(next);if(next){for(const a of tracks)a.pause()}else resetContent()}function replay(){if(collapsed)return;const current=Number(getComputedStyle(content).opacity);cancelRestart();setComplete(false);const token=restartToken;for(const a of tracks)a.pause();if(matchMedia('(prefers-reduced-motion:reduce)').matches){resetContent();return}restartEffect=content.animate([{opacity:current},{opacity:0}],{duration:100,easing:'ease-out',fill:'forwards'});restartEffect.f const guideController=createGuideController(popup,demo),flowController=createFlowController(control);let actualOn=false;function toggleActual(){actualOn=!actualOn;control.classList.toggle('is-on',actualOn);actualHit.setAttribute('aria-checked',String(actualOn))}actualHit.onclick=toggleActual;actualLabelHit.onclick=()=>{if(guideController.collapsed)guideController.setCollapsed(false)};for(const target of [actualHit,actualLabelHit])target.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();target.onclick()}};play.onclick=guideController.togglePlay;replayButton.onclick=guideController.replay;steps[0].onclick=()=>guideController.seek(1050);steps[1].onclick=()=>guideController.seek(2664);steps[2].onclick=()=>guideController.seek(3964);collapse.onclick=()=>guideController.setCollapsed(!guideController.collapsed);flowToggle.onclick=()=>flowController.setEnabled(!flowController.enabled);document.querySelector('#speed').onchange=e=>guideController.setSpeed(Number(e.target.value));scrub.oninput=e=>guideController.seek(Number(e.target.value));window.preview={guide:guideController,flow:flowController,seek:guideController.seek,reset:guideController.replay,setCollapsed:guideController.setCollapsed,toggleActual};
