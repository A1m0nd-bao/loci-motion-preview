<body><main>
<h1>纸飞机起飞</h1>
<p class="hint">点击纸飞机<br>轻轻蓄力，向右上飞出，再从左下柔和归位</p>
<div class="zoom"><sipplay-paper-plane label="播放纸飞机动效，四倍预览"></sipplay-paper-plane></div>
<p class="caption">4× 细节预览</p>

</div>
<p class="note">单次约 0.76 秒 · 常态静止，交互触发</p>
<nav class="release-downloads"><a href="./paper-plane.html" download>下载 HTML</a><a href="./source.zip" download>下载源码包</a></nav></main><script type="module">
import './paper-plane.js?v=click2';
const icons=[...document.querySelectorAll('sipplay-paper-plane')];
document.addEventListener('visibilitychange',()=>{
  for(const icon of icons){
    if(document.visibilityState==='visible')icon.resume();
    else icon.pause();
  }
});
