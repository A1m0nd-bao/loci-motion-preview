  }

 function saveState(){

 function restore(s,initial=false){
  let i=s?.privateContent?.selected;

  const level=[0,2,5,10,12,15,20].includes(savedLevel)?savedLevel:0;

   newlyUnlocked=level===0?-1:Number.isInteger(newest)&&newest>=-1&&newest<items.length?newest:items.reduce((last,item,index)=>item.level<=level?index:last,-1);
