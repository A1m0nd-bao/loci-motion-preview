#updated-hockey input {accent-color:#8e1e1e}
@media(pointer:coarse){#updated-hockey .ub-replay,#updated-hockey label {min-height:44px}}
</style>
<script>
(()=>{
const root=document.getElementById('updated-hockey');
const config=JSON.parse(root.querySelector('.ub-data').textContent);
const button=root.querySelector('.ub-trigger'),status=root.querySelector('.ub-status'),slow=root.querySelector('input');
const a=root.querySelector('.ub-bg-a'),b=root.querySelector('.ub-bg-b'),top=root.querySelector('.ub-top'),icon=root.querySelector('.ub-icon'),text=root.querySelector('.ub-text');
const scene=root.querySelector('.ub-scene'),contour=root.querySelector('.ub-contour');
const warped=root.querySelector('.ub-warp'),canvas=warped.querySelector('canvas');
const ctx=config.tieWarp?canvas.getContext('2d'):null;
const cloth0=config.tieWarp?new Image():null,cloth1=config.tieWarp?new Image():null;
const columns0=[0,4,8,16,28,45,65,config.w],columns1=[0,17,21,29,38,49,65,config.w];
let clothReady=false;
const labelGradient=root.querySelector('.ub-label-gradient');
const number=/[-+]?(?:\d*\.\d+|\d+)/g;
const va=config.path0.match(number).map(Number),vb=config.path1.match(number).map(Number),chunks=config.path0.split(number);
const frames=320,paths=new Array(frames+1);
for(let f=0;f<=frames;f++){
const t=f/frames;let d=chunks[0];
for(let i=0;i<va.length;i++)d+=(va[i]+(vb[i]-va[i])*t).toFixed(4)+chunks[i+1];
paths[f]=d;
}
const start=[6,0,config.w-6,0,config.w-2.686,0,config.w,2.686,config.w,6,config.w,45,config.w,48.314,config.w-2.686,51,config.w-6,51,6,51,2.686,51,0,48.314,0,45,0,6,0,2.686,2.686,0,6,0];
const end=[0,0,config.w,0,config.w-20,0,config.w-24,16,config.w-32,34,config.w-32,34,config.w-37,48,config.w-41,51,config.w-55,51,42,51,28,51,24,48,19,34,19,34,11,16,15,0,0,0];
const commands=['M',' ','L',' ','C',' ',' ',' ',' ',' ','L',' ','C',' ',' ',' ',' ',' ','L',' ','C',' ',' ',' ',' ',' ','L',' ','C',' ',' ',' ',' ',' ','Z'];
const media=matchMedia('(prefers-reduced-motion: reduce)');
let selected=false,p=0,target=0,velocity=0,frame=0,previous=0,timer=0,lastPath=-1;
const lerp=(a,b,t)=>a+(b-a)*t;
function draw(value){
const t=Math.max(0,Math.min(1,value));
const x=(config.w-config.nw)/2*(1-t),y=9*(1-t),w=lerp(config.nw,config.w,t),h=33+18*t;
scene.style.transform=`translate(${x}px,${y}px) scale(${w/config.w},${h/51})`;
a.setAttribute('opacity',1-t);b.setAttribute('opacity',t);
top.setAttribute('opacity',t);
icon.style.transform=`translate(${lerp(11+(config.w-config.nw)/2,config.ix,t)}px,${lerp(17.62,config.iy,t)}px) scale(${(16+2*t)/18})`;
const pathIndex=Math.round(t*frames);
if(pathIndex!==lastPath){text.setAttribute('d',paths[pathIndex]);lastPath=pathIndex;}
text.setAttribute('transform',`translate(${x} ${y})`);
let edge='';for(let i=0;i<start.length;i++)edge+=commands[i]+lerp(start[i],end[i],t).toFixed(3);
contour.setAttribute('d',edge+'Z');
if(clothReady){
ctx.setTransform(4,0,0,4,0,0);ctx.clearRect(0,0,config.w,51);
if(t===0||t===1)ctx.drawImage(t===0?cloth0:cloth1,0,0,config.w,51);
else{
const cut=new Path2D(edge+'Z');
for(let source=0;source<2;source++){
const image=source===0?cloth0:cloth1,columns=source===0?columns0:columns1;
ctx.save();if(source===0)ctx.clip(cut);
ctx.globalAlpha=source===0?1-t:t;
ctx.globalCompositeOperation=source===0?'source-over':'lighter';
for(let i=0;i<columns.length-1;i++){
const left=lerp(columns0[i],columns1[i],t),right=lerp(columns0[i+1],columns1[i+1],t);
ctx.save();ctx.beginPath();ctx.rect(left,0,right-left,51);ctx.clip();
const sx=columns[i]/config.w*image.naturalWidth,sw=(columns[i+1]-columns[i])/config.w*image.naturalWidth;
ctx.drawImage(image,sx,0,sw,image.naturalHeight,left,0,right-left,51);
ctx.restore();
}
ctx.restore();
}
}
}
if(labelGradient){labelGradient.setAttribute('x1',lerp(31,57,t));labelGradient.setAttribute('x2',lerp(98,138,t));}
else text.setAttribute('fill',`rgb(${lerp(142,166,t)} ${lerp(30,40,t)} ${lerp(30,40,t)})`);
root.dataset.progress=t.toFixed(5);
}
function tick(now){
const dt=(now-previous)/1000/(slow.checked?2.8:1);previous=now;
const omega=20,z=p-target,c=velocity+omega*z,decay=Math.exp(-omega*dt);
p=target+(z+c*dt)*decay;velocity=(velocity-omega*c*dt)*decay;
draw(p);
if(Math.abs(target-p)<.00015&&Math.abs(velocity)<.006){p=target;velocity=0;draw(p);frame=0;scene.style.willChange=icon.style.willChange='auto';}
else frame=requestAnimationFrame(tick);
}
function set(value,persist=true){
selected=value;target=value?1:0;button.setAttribute('aria-pressed',String(value));status.textContent=value?'已选中':'未选中';
if(media.matches){cancelAnimationFrame(frame);frame=0;p=target;velocity=0;draw(p);}
else if(!frame){scene.style.willChange=icon.style.willChange='transform';previous=performance.now();frame=requestAnimationFrame(tick);}
if(persist&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{...window.openai.widgetState?.modelContent,[root.id]:value}}).catch(()=>{});
}
button.addEventListener('click',()=>{clearTimeout(timer);set(!selected);});
root.querySelector('.ub-replay').addEventListener('click',()=>{clearTimeout(timer);cancelAnimationFrame(frame);frame=0;p=0;velocity=0;set(false,false);draw(0);timer=setTimeout(()=>set(true),media.matches?0:160);});
const saved=window.openai?.widgetState?.modelContent?.[root.id];
if(saved===true){selected=true;p=target=1;button.setAttribute('aria-pressed','true');status.textContent='已选中';}
draw(p);
if(config.tieWarp){
cloth0.src=a.getAttribute('href');
cloth1.src=root.querySelector('#updated-hockey-active-texture').getAttribute('href');
Promise.all([cloth0.decode(),cloth1.decode()]).then(()=>{
clothReady=true;a.style.display=b.style.display='none';warped.style.display='block';draw(p);
}).catch(()=>{});
}
window.addEventListener('openai:set_globals',e=>{
const saved=e.detail?.globals?.widgetState?.modelContent?.[root.id];
if(typeof saved==='boolean'&&saved!==selected){clearTimeout(timer);cancelAnimationFrame(frame);frame=0;p=saved?1:0;velocity=0;set(saved,false);draw(p);}
});
})();
</script></body></html>
