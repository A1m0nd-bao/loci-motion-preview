</main><script>
/**
 * sipplay reward ticket runtime orange-easeout (full visible easeOutCubic grow)
 *
 * - Single-layer ribbon flow only (no glow+core stack; harvest has no card sliding-beam).
 * - Grow: mostly linear on visible path; final 15–25% visible eases to rest; then
 *   discrete jump to full mask (offset 0) with no off-card tail time.
 */
(function (global) {
  "use strict";

  const TAG = "sipplay-reward-ticket";
  const RIBBON_SEL = ".ribbon-unified-growth-stroke";
  const DEFAULT_GIFT_SEC = 0.85;
  const DEFAULT_RIBBON_SEC = 1.36;
  const DEFAULT_GIFT_MS = Math.round(DEFAULT_GIFT_SEC * 1000);
  const DEFAULT_RIBBON_MS = Math.round(DEFAULT_RIBBON_SEC * 1000);
  const BACK_PAUSE_MS = 64;
  const MIN_SEC = 0.4;
  const MAX_SEC = 6;

  const MASK_VIS_START = 0.32; // ~x40 on-card ribbon start
  const MASK_VIS_END = 0.79; // ~x157 on-card ribbon end
  const HIDE_MS_TARGET = 350;
  const GROW_MS_TARGET = 900; // visible growth window (~850–950)
  const GROW_SAMPLES = 16; // piecewise-linear approx of easeOutCubic

  const HIDE_EASE = "linear";

  const SUPPLEMENTAL_CSS = `
:host {
  display: inline-block;
  width: 166px;
  height: 36px;
  line-height: 0;
  vertical-align: top;
  --duration: ${DEFAULT_GIFT_SEC}s;
}
:host([variant="harvest"]) { width: 167px; }
button {
  display: block; width: 100%; height: 100%;
  padding: 0; margin: 0; border: 0; background: transparent;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
button:focus-visible {
  outline: 2px solid rgba(255, 214, 120, 0.85);
  outline-offset: 2px;
}
svg { display: block; width: 100%; height: 100%; overflow: visible; }

.playing ${RIBBON_SEL},
${RIBBON_SEL} {
  animation: none !important;
  stroke-linecap: round;
}

.dark-aurora-stream {
  animation: dark-aurora-flow 5.6s linear infinite;
}
.sliding-beam {
  animation: slide-beam-sweep 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.ribbon-spine-idle-glow {
  stroke-dasharray: 20 80;
  stroke-dashoffset: 100;
  animation: ribbon-idle-flow 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  opacity: 0.7;
}
/* single-layer purple silk — cores removed in parts-v5 */
.ribbon-spine-idle-core { display: none !important; }

.ribbon-flow {
  animation: none !important; /* WAAPI real-L loop */
}

/* Harvest: no card diagonal sweep — ribbon-flow is the only moving light */
:host([variant="harvest"]) .sliding-beam,
:host([variant="harvest"]) .sliding-beam-clip {
  display: none !important;
}

:host([variant="harvest"]) .star-right {
  transform-origin: 156.85px 18.17px;
}

.harvest-art {
  transform-box: fill-box;
  transform-origin: center bottom;
  /* pulse via WAAPI — never CSS restart on .playing */
}
.harvest-tag {
  transform-box: fill-box;
  transform-origin: top center;
}

@media (prefers-reduced-motion: reduce) {
  :host *, :host *::before, :host *::after {
    animation: none !important;
    transition: none !important;
  }
}
`.trim();

  let shared = { styles: "", arts: { purple: "", harvest: "" } };

  function parseDurationSec(raw, fallbackSec) {
    if (raw == null || raw === "") return fallbackSec;
    const n = Number(raw);
    if (!Number.isFinite(n) || n <= 0) return fallbackSec;
    return Math.min(MAX_SEC, Math.max(MIN_SEC, n));
  }

  function sanitizeStyles(css) {
    let out = String(css || "");
    out = out.replace(/:host\(\s*:hover\s*\)/g, ":host([data-sipplay-no-hover])");
    out = out.replace(/\bbutton:hover\b/g, "button:not(*)");
    out = out.replace(
      /\.playing\s+\.ribbon-unified-growth-stroke\s*\{[^}]*\}/g,
      "/* ribbon CSS anim removed */"
    );
    out = out.replace(
      /@keyframes\s+ribbon-unified-grow\s*\{[\s\S]*?\n\}/g,
      "/* ribbon-unified-grow removed */"
    );
    out = out.replace(
      /\.playing\s+\.ribbon-spine-idle\s*\{[^}]*\}/g,
      "/* playing idle opacity kill removed */"
    );
    // Hide idle-core even if styles mention it
    out = out.replace(
      /\.ribbon-spine-idle-core\s*\{[^}]*\}/g,
      ".ribbon-spine-idle-core{display:none!important}"
    );
    out = out.replace(
      /\.ribbon-unified-growth-stroke\s*\{[^}]*\}/g,
      (block) =>
        block.replace(
          /stroke-dasharray\s*:\s*[^;]+;?/gi,
          "/* growth dasharray owned by WAAPI */"
        )
    );
    return out;
  }

  function prefersReducedMotion() {
    try {
      return !!(
        global.matchMedia &&
        global.matchMedia("(prefers-reduced-motion: reduce)").matches
      );
    } catch (_) {
      return false;
    }
  }

  function prepareRibbon(el) {
    if (!el) return 0;
    try {
      el.removeAttribute("pathLength");
    } catch (_) {}
    let L = 0;
    try {
      if (typeof el.getTotalLength === "function") L = el.getTotalLength();
    } catch (_) {}
    if (!(L > 0) || !Number.isFinite(L)) {
      const dataL = Number(el.getAttribute("data-length"));
      L = dataL > 0 ? dataL : 100;
    }
    el.__sipplayRibbonL = L;
    el.setAttribute("stroke-linecap", "round");
    el.style.strokeLinecap = "round";
    el.style.strokeDasharray = L + " " + L;
    return L;
  }

  function ribbonLength(el) {
    if (!el) return 100;
    if (el.__sipplayRibbonL > 0) return el.__sipplayRibbonL;
    return prepareRibbon(el);
  }

  function resetRibbonVisible(el) {
    if (!el) return;
    if (el.__sipplayRibbonAnim) {
      try {
        el.__sipplayRibbonAnim.cancel();
      } catch (_) {}
      el.__sipplayRibbonAnim = null;
    }
    const L = ribbonLength(el);
    el.style.strokeDasharray = L + " " + L;
    el.style.strokeDashoffset = "0";
  }

  function pathToOffset(L, pathProgress) {
    const p = Math.min(1, Math.max(0, pathProgress));
    return L * (1 - p);
  }

  function visibleFromPath(p) {
    if (p <= MASK_VIS_START) return 0;
    if (p >= MASK_VIS_END) return 1;
    return (p - MASK_VIS_START) / (MASK_VIS_END - MASK_VIS_START);
  }

  function sampleCubicBezierEase(t, x1, y1, x2, y2) {
    const steps = 64;
    let prevX = 0;
    let prevY = 0;
    for (let i = 1; i <= steps; i++) {
      const u = i / steps;
      const a = 1 - u;
      const x = 3 * a * a * u * x1 + 3 * a * u * u * x2 + u * u * u;
      const y = 3 * a * a * u * y1 + 3 * a * u * u * y2 + u * u * u;
      if (x >= t) {
        const w = (t - prevX) / Math.max(1e-6, x - prevX);
        return prevY * (1 - w) + y * w;
      }
      prevX = x;
      prevY = y;
    }
    return 1;
  }

  function easeOutCubic(t) {
    const u = Math.min(1, Math.max(0, t));
    return 1 - Math.pow(1 - u, 3);
  }

  /**
   * Grow: ENTIRE visible span uses easeOutCubic (fast→slow), not linear+last20%.
   *   lead: path 0→vis0 (short)
   *   visible: vis0→vis1 with p = vis0 + easeOutCubic(u)*(vis1-vis0)
   *   snap: dashoffset→0 at vis complete (no off-card tail time)
   * Hide ~350ms; visible grow ~850–950ms when ribbonMs≈1.36s.
   */
  function buildRibbonKeyframes(L, ribbonMs) {
    const pause = Math.min(70, Math.max(48, ribbonMs * 0.045));
    let hideMs = Math.min(380, Math.max(320, HIDE_MS_TARGET));
    let growMs = Math.min(960, Math.max(850, GROW_MS_TARGET));
    // Fit into ribbonMs if needed, prefer keeping grow in 850–950.
    const budget = Math.max(1, ribbonMs - pause);
    if (hideMs + growMs > budget) {
      const scale = budget / (hideMs + growMs);
      hideMs = Math.max(300, hideMs * scale);
      growMs = Math.max(820, budget - hideMs);
    }

    const vis0 = MASK_VIS_START;
    const vis1 = MASK_VIS_END;
    const leadMs = Math.min(40, growMs * 0.04);
    const growVisMs = growMs - leadMs;

    const hideEnd = hideMs / ribbonMs;
    const growStart = (hideMs + pause) / ribbonMs;
    const g = (localMs) => growStart + localMs / ribbonMs;

    const keyframes = [
      // HIDE L→R
      { offset: 0, strokeDashoffset: 0, easing: HIDE_EASE },
      {
        offset: (hideMs * 0.1) / ribbonMs,
        strokeDashoffset: -L * vis0,
        easing: HIDE_EASE,
      },
      {
        offset: (hideMs * 0.85) / ribbonMs,
        strokeDashoffset: -L * vis1,
        easing: HIDE_EASE,
      },
      { offset: hideEnd, strokeDashoffset: -L },

      // Invisible hop
      { offset: hideEnd, strokeDashoffset: L, easing: "linear" },
      { offset: growStart, strokeDashoffset: L, easing: "linear" },

      // Lead onto card
      {
        offset: g(leadMs),
        strokeDashoffset: pathToOffset(L, vis0),
        easing: "linear",
      },
    ];

    // Sample easeOutCubic across the full visible interval (no linear body).
    for (let i = 1; i <= GROW_SAMPLES; i++) {
      const u = i / GROW_SAMPLES;
      const vis = easeOutCubic(u);
      const pathP = vis0 + vis * (vis1 - vis0);
      const localMs = leadMs + u * growVisMs;
      const kf = {
        offset: g(localMs),
        strokeDashoffset: pathToOffset(L, pathP),
      };
      if (i < GROW_SAMPLES) kf.easing = "linear";
      keyframes.push(kf);
    }

    const tDone = g(leadMs + growVisMs);
    // Snap off-card remainder instantly (same timestamp) — no tail drag.
    keyframes.push({ offset: tDone, strokeDashoffset: 0 });
    keyframes.push({ offset: 1, strokeDashoffset: 0 });

    keyframes.forEach((k) => {
      k.offset = Math.min(1, Math.max(0, Number(k.offset.toFixed(6))));
    });

    function pathProgressAtGrowLocal(gLocal) {
      const t = gLocal * growMs;
      if (t <= 0) return 0;
      if (t >= leadMs + growVisMs) return 1;
      if (t <= leadMs) return (t / leadMs) * vis0;
      const u = (t - leadMs) / growVisMs;
      const vis = easeOutCubic(u);
      return vis0 + vis * (vis1 - vis0);
    }

    function visibleProgressAtGrowLocal(gLocal) {
      return visibleFromPath(pathProgressAtGrowLocal(gLocal));
    }

    /** Speeds over the visible grow window (visible-fill per grow-local unit). */
    function sampleVisibleSpeeds(steps) {
      const n = steps || 20;
      const g0 = leadMs / growMs;
      const g1 = (leadMs + growVisMs) / growMs;
      const speeds = [];
      for (let i = 0; i < n; i++) {
        const a = g0 + (g1 - g0) * (i / n);
        const b = g0 + (g1 - g0) * ((i + 1) / n);
        const va = visibleProgressAtGrowLocal(a);
        const vb = visibleProgressAtGrowLocal(b);
        speeds.push((vb - va) / (b - a));
      }
      return speeds;
    }

    /** Report visible fill at fractions of *visible grow time* (after lead). */
    function sampleVisibleAtTimeFractions(fracs) {
      return fracs.map((f) => {
        const gLocal = (leadMs + f * growVisMs) / growMs;
        const pathP = pathProgressAtGrowLocal(gLocal);
        const vis = visibleFromPath(pathP);
        return {
          timeFrac: f,
          pathProgress: pathP,
          visibleFill: vis,
          remainingVisible: 1 - vis,
        };
      });
    }

    return {
      pauseMs: pause,
      hideMs,
      growMs,
      leadMs,
      growVisMs,
      vis0,
      vis1,
      hideEase: HIDE_EASE,
      easeName: "easeOutCubic",
      keyframes,
      pathProgressAtGrowLocal,
      visibleProgressAtGrowLocal,
      sampleVisibleSpeeds,
      sampleVisibleAtTimeFractions,
      tDone,
    };
  }

  function animateRibbonCycle(el, ribbonMs, signal) {
    return new Promise((resolve, reject) => {
      if (!el) {
        resolve();
        return;
      }
      const L = prepareRibbon(el);
      el.style.strokeDasharray = L + " " + L;
      el.style.strokeDashoffset = "0";

      if (!(ribbonMs > 0) || typeof el.animate !== "function") {
        resolve();
        return;
      }

      const { keyframes } = buildRibbonKeyframes(L, ribbonMs);
      const anim = el.animate(keyframes, {
        duration: ribbonMs,
        fill: "forwards",
        easing: "linear",
      });
      el.__sipplayRibbonAnim = anim;

      const onAbort = () => {
        try {
          anim.cancel();
        } catch (_) {}
        el.__sipplayRibbonAnim = null;
        reject(new DOMException("Aborted", "AbortError"));
      };

      if (signal) {
        if (signal.aborted) {
          onAbort();
          return;
        }
        signal.addEventListener("abort", onAbort, { once: true });
      }

      anim.onfinish = () => {
        try {
          anim.commitStyles();
        } catch (_) {}
        try {
          anim.cancel();
        } catch (_) {}
        el.style.strokeDashoffset = "0";
        el.__sipplayRibbonAnim = null;
        resolve();
      };
    });
  }

  function startRibbonFlowLoops(root) {
    if (!root || prefersReducedMotion()) return;
    root.querySelectorAll(".ribbon-flow").forEach((el) => {
      if (el.__sipplayFlowAnim) {
        try {
          el.__sipplayFlowAnim.cancel();
        } catch (_) {}
      }
      let L = Number(el.getAttribute("data-flow-len"));
      if (!(L > 0) && typeof el.getTotalLength === "function") {
        try {
          L = el.getTotalLength();
        } catch (_) {}
      }
      if (!(L > 0)) return;
      el.__sipplayFlowAnim = el.animate(
        [{ strokeDashoffset: 0 }, { strokeDashoffset: -L }],
        { duration: 2400, iterations: Infinity, easing: "linear" }
      );
    });
  }

  function stopRibbonFlowLoops(root) {
    if (!root) return;
    root.querySelectorAll(".ribbon-flow").forEach((el) => {
      if (el.__sipplayFlowAnim) {
        try {
          el.__sipplayFlowAnim.cancel();
        } catch (_) {}
        el.__sipplayFlowAnim = null;
      }
    });
  }

  function collectPlayTargets(root, variant) {
    if (variant === "harvest") {
      return root.querySelectorAll(".harvest-art, .harvest-tag");
    }
    return root.querySelectorAll(".gift-box, .gift-lid, .gift-tag");
  }

  function restartCssAnimations(nodes) {
    nodes.forEach((node) => {
      node.style.animation = "none";
      void node.offsetWidth;
      node.style.animation = "";
      node.style.animationPlayState = "";
    });
  }


  function setAnimPlayState(nodes, state) {
    nodes.forEach((node) => {
      node.style.animationPlayState = state;
    });
  }

  /**
   * Icon pulse independent of ribbon cycle.
   * Re-click: commitStyles keeps current transform, then continues a new pop
   * from that pose — no hard snap back to keyframe 0% / identity.
   * Segment easing lives on each keyframe; overall timing is linear so
   * those curves are not flattened.
   */
  function pulseFromCurrent(el, peakFrames, durationMs, restTransform) {
    if (!el || typeof el.animate !== "function") return null;
    if (el.__sipplayPulse) {
      try {
        el.__sipplayPulse.commitStyles();
      } catch (_) {}
      try {
        el.__sipplayPulse.cancel();
      } catch (_) {}
      el.__sipplayPulse = null;
    }
    var cur = "";
    try {
      cur = global.getComputedStyle(el).transform;
    } catch (_) {}
    if (!cur || cur === "none") cur = "matrix(1, 0, 0, 1, 0, 0)";
    var rest =
      restTransform || "translate(0px, 0px) rotate(0deg) scale(1, 1)";
    var frames = [
      {
        transform: cur,
        offset: 0,
        easing: "cubic-bezier(0.4, 0, 0.65, 1)",
      },
    ]
      .concat(peakFrames)
      .concat([{ transform: rest, offset: 1 }]);
    var anim = el.animate(frames, {
      duration: durationMs,
      easing: "linear",
      fill: "forwards",
    });
    el.__sipplayPulse = anim;
    anim.onfinish = function () {
      try {
        anim.commitStyles();
      } catch (_) {}
      try {
        anim.cancel();
      } catch (_) {}
      el.style.transform = "";
      el.__sipplayPulse = null;
    };
    return anim;
  }

  /** Keep poses inside the 167×36 card clip (transform-origin: center bottom). */
  function pumpkinPose(tx, ty, rot, sx, sy) {
    return (
      "translate(" +
      tx +
      "px, " +
      ty +
      "px) rotate(" +
      rot +
      "deg) scale(" +
      sx +
      ", " +
      sy +
      ")"
    );
  }

  /**
   * One hop: anticipation squash, takeoff, a single apex, one landing squash, then settle.
   * No second hop and no rebound after the landing. Leaf/stem stay in .harvest-art.
   * The hanging tag makes one small lagged swing and returns, without extra swings.
   */
  function pulseHarvestIcons(root, giftMs) {
    if (!root) return;
    var ms = Math.max(800, giftMs || 850);
    var art = root.querySelector(".harvest-art");
    var tag = root.querySelector(".harvest-tag");
    pulseFromCurrent(
      art,
      [
        {
          transform: pumpkinPose(0, 0.25, -0.4, 1.05, 0.94),
          offset: 0.12,
          easing: "cubic-bezier(0.45, 0, 0.75, 1)",
        },
        {
          transform: pumpkinPose(0, 0.45, -1.1, 1.12, 0.84),
          offset: 0.24,
          easing: "cubic-bezier(0.2, 0.45, 0.2, 1)",
        },
        {
          transform: pumpkinPose(0.1, -1.35, 0.2, 0.96, 1.035),
          offset: 0.4,
          easing: "cubic-bezier(0.22, 0.4, 0.3, 1)",
        },
        {
          transform: pumpkinPose(0.2, -2.85, 1.35, 0.985, 1.012),
          offset: 0.54,
          easing: "cubic-bezier(0.4, 0, 0.75, 0.55)",
        },
        {
          transform: pumpkinPose(0.05, -0.55, 0.3, 0.99, 1.015),
          offset: 0.68,
          easing: "cubic-bezier(0.45, 0, 0.9, 0.7)",
        },
        {
          transform: pumpkinPose(0, 0.4, -0.7, 1.09, 0.88),
          offset: 0.78,
          easing: "cubic-bezier(0.25, 0.7, 0.3, 1)",
        },
        {
          transform: pumpkinPose(0, 0, 0.15, 1.025, 0.98),
          offset: 0.9,
          easing: "cubic-bezier(0.33, 0, 0.2, 1)",
        },
      ],
      ms
    );
    pulseFromCurrent(
      tag,
      [
        {
          transform: "rotate(1.5deg)",
          offset: 0.22,
          easing: "cubic-bezier(0.35, 0, 0.4, 1)",
        },
        {
          transform: "rotate(-5.5deg)",
          offset: 0.58,
          easing: "cubic-bezier(0.4, 0, 0.7, 1)",
        },
        {
          transform: "rotate(-1deg)",
          offset: 0.82,
          easing: "cubic-bezier(0.33, 0, 0.2, 1)",
        },
      ],
      ms,
      "rotate(0deg)"
    );
  }


  class RewardTicketElement extends HTMLElement {
    static get observedAttributes() {
      return ["variant", "label", "duration", "ribbon-duration", "continuous"];
    }

const ticket=document.getElementById('harvest-ticket');
ticket.addEventListener('motion-start',()=>document.getElementById('harvest-status').textContent='飘带绕行中');
ticket.addEventListener('motion-finish',()=>document.getElementById('harvest-status').textContent='就绪');
document.getElementById('replay').addEventListener('click',()=>ticket.play());
document.getElementById('slow').addEventListener('change',e=>{ticket.setAttribute('duration',e.target.checked?'1.7':'.85');ticket.setAttribute('ribbon-duration',e.target.checked?'2.4':'1.36');});
</script></body></html>
