<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邀请码 · 秋日邀请函</title><style>
    :root {
      --stage-width: 375px;
      --stage-height: 812px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout wrapper: ensures controls NEVER overlap or obstruct the animation */
    .page-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 100vh;
      padding: 24px 16px 60px;
      box-sizing: border-box;
      gap: 28px;
    }

    /* Desktop View: Wide screens place controls side-by-side on the right, completely clear of animation */
    @media (min-width: 960px) {
      .page-layout {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 60px;
        padding: 40px;
      }
      .controls-panel {
        margin: 0 !important;
        max-width: 440px !important;
        flex-shrink: 0;
      }
    }

    /* Transparent Motion Stage */
    .motion-stage {
      position: relative;
      width: var(--stage-width);
      height: var(--stage-height);
      background: transparent;
      user-select: none;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* ========================================================
       THE INVITATION LETTER CARD (HTML + SF Pro Typography)
       ======================================================== */
    .letter-card {
      position: absolute;
      left: 24px;
      top: 151px;
      width: 327px;
      height: 573px;
      border-radius: 16px;
      background: linear-gradient(180deg, #F2E1C9 0%, #D7B2C9 100%);
      box-shadow: 0 20px 48px -10px rgba(78, 33, 80, 0.25),
                  0 0 0 1px rgba(255, 255, 255, 0.4) inset;
      z-index: 2;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate3d(0, 560px, 0); /* Initial state: deep inside envelope */
      will-change: transform;
    }

    /* Card background wavy curves */
    .card-curves-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Title: Invitation Letter */
    .card-title {
      position: relative;
      z-index: 3;
      margin-top: 48px;
      font-size: 20px;
      font-weight: 700;
      color: #1D1D1F;
      letter-spacing: -0.2px;
      line-height: 1.2;
      text-align: center;
    }

    /* Gift box graphic with 3D sapphires */
    .gift-box-wrap {
      position: relative;
      z-index: 3;
      margin-top: 22px;
      width: 131px;
      height: 107px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gift-box-img {
      width: 131px;
      height: 107px;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(113, 70, 114, 0.2));
    }

    /* Swooping ribbon banner */
    #card-ribbon {
      transform-origin: 187.5px 260.75px;
      transform: rotate(-29deg) scale(0.85);
      opacity: 0;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* Description text */
    .card-desc {
      position: relative;
      z-index: 3;
      margin-top: 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: #4A4A4A;
      text-align: center;
      font-weight: 400;
      letter-spacing: -0.1px;
      width: 260px;
    }
    .card-desc .bold-highlight {
      font-weight: 700;
      color: #1A1A1A;
    }

    /* Input Box Container */
    .input-wrapper {
      position: relative;
      z-index: 4;
      margin-top: 32px;
      width: 278px;
      height: 54px;
    }
    .invite-input {
      width: 100%;
      height: 54px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.05);
      border: 1.5px solid transparent;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #1D1D1F;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      text-align: center;
      box-sizing: border-box;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .invite-input::placeholder {
      color: rgba(0, 0, 0, 0.28);
      font-weight: 600;
      letter-spacing: 2px;
    }
    .invite-input:focus {
      border-color: rgba(237, 120, 244, 0.6);
      background: rgba(255, 255, 255, 0.4);
    }
    .error-row {
      position: absolute;
      top: 58px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      color: #E05252;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .input-wrapper.is-error .invite-input {
      border-color: rgba(255, 107, 107, 0.65);
      background: rgba(255, 107, 107, 0.08);
      color: rgba(180, 140, 150, 0.9);
    }
    .input-wrapper.is-error .error-row {
      opacity: 1;
    }
    .error-icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    /* Redeem Now Button & Speech Bubble */
    .btn-container {
      position: relative;
      z-index: 4;
      width: 278px;
      margin-top: 44px; /* Fixed distance below input; error message occupies the gap */
    }
    .redeem-btn {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      background: linear-gradient(90deg, #ED78F4 0%, #FF6F4E 100%);
      border: none;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(237, 120, 244, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .redeem-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(237, 120, 244, 0.45);
    }
    .redeem-btn:active {
      transform: scale(0.97);
    }
    .speech-bubble {
      position: absolute;
      top: -16px;
      right: 4px;
      background: #FFE4F2;
      color: #8A3A8A;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px 12px 12px 2px;
      box-shadow: 0 4px 12px rgba(113, 70, 114, 0.15);
      display: flex;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s;
      animation: bubbleFloat 2.8s ease-in-out infinite;
    }
    /* Hide speech bubble when error state is active to prevent overlap */
    .input-wrapper.is-error ~ .btn-container .speech-bubble {
      opacity: 0 !important;
      visibility: hidden !important;
      transform: translateY(4px) scale(0.9) !important;
    }
    .bubble-gem-svg {
      width: 12px;
      height: 12px;
    }

    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* ========================================================
       ENVELOPE LAYERS (Z-Index Ordered Overlays)
       ======================================================== */
    .env-svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 375px;
      height: 812px;
      pointer-events: none;
    }

    /* Flap Back (Open Triangle pointing UP) */
    #flap-back {
      transform-origin: 187.5px 560px;
      transform: scaleY(0);
      z-index: 1;
    }

    /* Envelope Back Cavity */
    #env-back {
      z-index: 1;
    }

    /* Envelope Front Triangular Flaps (Occludes bottom of card) */
    #env-front {
      z-index: 3;
    }

    /* Flap Front (User's Exact Vector Top Flap) */
    #flap-front {
      position: absolute;
      left: -8px;
      top: 556.4px;
      width: 391px;
      height: 180px;
      transform-origin: 195.5px 6px;
      transform: scaleY(1);
      z-index: 4;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Wax Seal Stamp */
    #wax-seal {
      position: absolute;
      left: 150.5px;
      top: 672px;
      width: 74px;
      height: 76px;
      z-index: 5;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 0.15s;
    }
    #wax-seal:hover {
      transform: scale(1.05);
    }

    /* ========================================================
       ANIMATION TIMELINE (Hardware-Accelerated CSS Keyframes)
       ======================================================== */
    .animating #wax-seal {
      animation: sealFade 0.42s 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes sealFade {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate3d(0, -8px, 0) scale(0.7);
        pointer-events: none;
      }
    }

    .animating #flap-front {
      animation: flapFrontFold 0.22s 0.42s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes flapFrontFold {
      0% {
        transform: scaleY(1);
        opacity: 1;
      }
      99% {
        transform: scaleY(0.01);
        opacity: 1;
      }
      100% {
        transform: scaleY(0);
        opacity: 0;
      }
    }

    .animating #flap-back {
      animation: flapBackOpen 0.24s 0.64s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes flapBackOpen {
      0% {
        transform: scaleY(0);
        opacity: 0;
      }
      1% {
        transform: scaleY(0.01);
        opacity: 1;
      }
      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    /* Card Slides Up with Spring Overshoot */
    .animating #letter-card {
      animation: cardSlideUp 1.05s 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cardSlideUp {
      0% {
        transform: translate3d(0, 560px, 0);
      }
      68% {
        transform: translate3d(0, -20px, 0);
      }
      84% {
        transform: translate3d(0, 5px, 0);
      }
      100% {
        transform: translate3d(0, 0px, 0);
      }
    }

    /* Ribbon Banner swoops from -29deg to 0deg */
    .animating #card-ribbon {
      animation: ribbonReveal 0.75s 1.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes ribbonReveal {
      0% {
        opacity: 0;
        transform: rotate(-29deg) scale(0.85);
      }
      100% {
        opacity: 1;
        transform: rotate(0deg) scale(1);
      }
    }


    /* Idle subtle floating loop after animation completes */
    .animating.completed #letter-card {
      animation: cardIdleFloat 4s ease-in-out infinite;
    }
    @keyframes cardIdleFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -5px, 0); }
    }

    /* ========================================================
       CONTROL DASHBOARD
       ======================================================== */
    .controls-panel {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 20px;
      padding: 16px 20px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .controls-panel.is-minimized {

    }
    .controls-header-bar {
      display: flex;

      margin-bottom: 12px;

    .controls-title {

    }

    .controls-toggle-pill {

    }

    .btn {
      background: rgba(0, 0, 0, 0.06);

    .btn:hover {

      transform: translateY(-1px);
    }
    
    .btn.primary {

    .btn.danger {

    .btn.success {
      background: rgba(46, 204, 113, 0.12);

    .speed-pills {

    .speed-pill.active {

    .timeline-container {

    }

    }
    
    input[type=range] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
      outline: none;
    }
    
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #a855f7;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.85);
      transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {

    }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      background: rgba(26, 18, 40, 0.95);
      color: #fff;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  
    /* Views inside Letter Card */
    .card-form-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .card-form-view.hide,
    .card-form-view.is-hidden {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .card-form-view.fading-out {
      opacity: 0 !important;
      transform: scale(0.95) !important;
      pointer-events: none !important;
    }

    .card-success-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 3;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
      overflow: hidden;
    }
    .card-success-view.show,
    .card-success-view.is-visible {
      display: block !important;
      opacity: 1 !important;
      transform: scale(1) !important;
      pointer-events: auto !important;
    }

    /* Card Background SVG with Texture */
    .card-bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 327px;
      height: 573px;
      pointer-events: none;
      z-index: 0;
    }

    /* Purple Light Rays Vector Layer (Exact 327x136 SVG) */
    .success-rays-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 327px;
      height: 136px;
      pointer-events: none;
      z-index: 1;
    }
    .card-success-view.show .success-rays-svg g,
    .card-success-view.is-visible .success-rays-svg g {
      animation: rayPulse 4s ease-in-out infinite alternate;
    }
    @keyframes rayPulse {
      0% { opacity: 0.55; }
      100% { opacity: 0.85; }
    }

    /* +100 Badge with Upward Slide & Fade */
    .success-badge {
      position: absolute;
      top: 42px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 3;
      opacity: 1;
      transform: translateY(0);
      }
    .card-success-view.show .success-badge,
    .card-success-view.is-visible .success-badge {
      animation: slideUpFade 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }
    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .success-badge-num {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", sans-serif;
      font-size: 34px;
      font-weight: 700;
      font-style: italic;
      line-height: 1;
      letter-spacing: -0.5px;
      color: #60293E;
    }
    .success-badge-gem {
      width: 25px;
      height: 27px;
      object-fit: contain;
      transform: rotate(6deg);
      filter: drop-shadow(0 2px 6px rgba(21, 101, 192, 0.35));
    }

    /* Cup Lottie Container (Pixel-calibrated to 105px top, 271px bottom) */
    .cup-lottie-container {
      position: absolute;
      top: 29px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 258px;
      z-index: 3;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.2s ease;
    }
    .cup-lottie-container:active {
      transform: translateX(-50%) scale(0.96);
    }
    #cup-lottie {
      width: 100%;
      height: 100%;
    }

    /* Success Description (SF Pro Text) */
    .success-desc {
      position: absolute;
      top: 332px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      line-height: 20px;
      color: rgba(60, 40, 60, 0.65);
      text-align: center;
      z-index: 3;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      }
    .card-success-view.show .success-desc,
    .card-success-view.is-visible .success-desc {
      animation: descFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }
    @keyframes descFadeIn {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

  
    .btn.info {
      background: rgba(237, 120, 244, 0.15);
      border-color: rgba(237, 120, 244, 0.35);
      color: #D6308F;
    }
    
    .btn.active {
      box-shadow: 0 0 0 2px #ED78F4 inset;
      font-weight: 700;
    }

<div class="controls-row"><button class="btn" onclick="switchToClosedState()">未开启</button><button class="btn" onclick="switchToEmptyState()">空白输入</button></div>
<!-- Row 1: State switches -->
    <div class="controls-row">
      <button class="btn success active" id="btn-state-normal" onclick="switchToNormalState()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span>正常状态</span>
      </button>
      <button class="btn danger" id="btn-state-error" onclick="switchToErrorState()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span>错误状态</span>
      </button>
      <button class="btn" id="btn-state-success" onclick="switchToSuccessState()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span>兑换成功</span>
      </button>
      <button class="btn" onclick="startAnimation()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span>重播动效</span>
      </button>
    </div>
    <!-- Row 2: Playback & Speed -->
    <div class="controls-row">
      <button class="btn" id="btn-play-pause" onclick="togglePlayPause()">
        <span id="play-pause-icon">▶ 播放</span>
      </button>
      <div class="speed-pills">
        <button class="speed-pill" onclick="setSpeed(0.5, this)">0.5x</button>
        <button class="speed-pill active" onclick="setSpeed(1.0, this)">1x</button>
        <button class="speed-pill" onclick="setSpeed(2.0, this)">2x</button>
      </div>
    </div>
    <!-- Row 3: Scrubber Timeline -->
    <div class="controls-row">
      <div class="timeline-container">
        <span class="time-label" id="time-current">0.00s</span>
        <input type="range" id="timeline" min="0" max="2.0" step="0.01" value="2.0" oninput="scrubTimeline(this.value)" />
        <span class="time-label" style="text-align:right;">2.00s</span>
      </div>
    </div>
