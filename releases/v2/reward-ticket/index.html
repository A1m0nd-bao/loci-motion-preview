<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>邀请奖励卡券 · Sipplay v2</title>
<style>
:root{color-scheme:dark;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0c10;color:#f5f2fa}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 18px}
main{width:min(100%,560px);text-align:center}
h1{font-size:20px;font-weight:600;margin:0 0 10px;color:#fcfaff}
.hint{color:#9c96a3;font-size:13px;line-height:1.7;margin:0 0 20px}
.zoom{display:grid;place-items:center;height:180px;margin:20px 0 0;border:1px solid #24212b;border-radius:20px;background:radial-gradient(ellipse at 50% 60%,#251d2d 0%,#121117 65%)}
.zoom sipplay-reward-ticket{transform:scale(2.2);transform-origin:center}
.caption{font-size:11px;color:#79737f;margin:12px 0 24px}
.originals{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin-bottom:24px}
.sample{display:grid;justify-items:center;gap:10px;color:#928b99;font-size:12px;background:#121117;padding:16px 20px;border-radius:14px;border:1px solid #24212b}
.reference{width:166px;height:36px;display:grid;place-items:center}
.reference img{display:block;width:166px;height:36px}
.controls{display:flex;justify-content:center;gap:10px;margin:20px 0 16px}
.controls button{border:1px solid #3d3447;background:#211b29;color:#f0e6f7;border-radius:10px;padding:8px 18px;font:inherit;font-size:12px;cursor:pointer;transition:all .15s ease}
.controls button:hover{background:#30273c;border-color:#534661}
.controls button:focus-visible{outline:1px solid #dbc48a;outline-offset:3px}
.note{font-size:11px;color:#79737f;line-height:1.8;margin:20px 0 0}
.release-downloads{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin-top:24px}
.release-downloads a{font-size:12px;color:#bcb4c5;text-decoration:none;border-bottom:1px solid #51475b;padding-bottom:3px}
.release-downloads a:hover{color:#fff;border-color:#9572a9}

/* Compact layout for v2 gallery embeds */
.compact body{width:260px;height:220px;min-height:0;padding:0;overflow:hidden}
.compact main{width:260px;height:220px}
.compact h1,.compact .hint,.compact .caption,.compact .originals,.compact .note,.compact .release-downloads,.compact .controls{display:none}
.compact .zoom{width:260px;height:220px;margin:0;border:0;border-radius:0;background:#0a0c10;display:grid;place-items:center}
.compact .zoom sipplay-reward-ticket{transform:scale(1.3);transform-origin:center}
</style>
<script>if(new URLSearchParams(location.search).has("compact"))document.documentElement.classList.add("compact");</script>
</head>
<body>
<main>
  <h1>邀请奖励卡券</h1>
  <p class="hint">常态月光银丝微芒 · 悬停或点击礼盒轻弹掀盖<br>标签微摆、彩带向右伸展、白色斜光穿梭</p>
  <div class="zoom"><sipplay-reward-ticket label="播放卡券动效，2.2倍细节预览"></sipplay-reward-ticket></div>
  <p class="caption">2.2× 细节预览</p>
  <div class="originals">
    <div class="sample"><sipplay-reward-ticket label="播放卡券动效，原始尺寸"></sipplay-reward-ticket><span>动态组件 · 166 × 36</span></div>
    <div class="sample"><div class="reference"><img src="./reference.svg" width="166" height="36" alt="奖励卡券原始设计稿"></div><span>原稿对照 · 166 × 36</span></div>
  </div>
  <div class="controls">
    <button type="button" id="btnPlay">播放动效</button>
    <button type="button" id="btnPause">暂停</button>
    <button type="button" id="btnResume">恢复</button>
  </div>
  <p class="note">动画时长 0.85 秒 · 纯净黑曜梅紫底色与月光银丝闪烁</p>
  <nav class="release-downloads" aria-label="下载与接入">
    <a href="./reward-ticket.html" download>下载 HTML</a>
    <a href="./source.zip" download>下载源码包</a>
    <a href="./USAGE.md">接入说明</a>
  </nav>
</main>
<script type="module">
import './reward-ticket.js?v=20261110';
const tickets = [...document.querySelectorAll('sipplay-reward-ticket')];
document.querySelector('#btnPlay')?.addEventListener('click', () => {
  tickets.forEach(t => t.play());
});
document.querySelector('#btnPause')?.addEventListener('click', () => {
  tickets.forEach(t => t.pause());
});
document.querySelector('#btnResume')?.addEventListener('click', () => {
  tickets.forEach(t => t.resume());
});
document.addEventListener('visibilitychange', () => {
  for (const t of tickets) {
    if (document.visibilityState === 'visible') t.resume();
    else t.pause();
  }
});
</script>
</body>
</html>
