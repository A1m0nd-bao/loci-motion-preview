<section class="cards"><article class="card"><div class="card-head"><i class="dot"></i>冰蓝道具<small>BLUE</small></div><div class="stage"><div class="zoom"><item-counter id="blue" value="200" label="冰蓝道具"></item-counter></div></div><div class="card-foot"><span>2.6 × 细节预览</span><div class="stepper"><button data-item="blue" data-delta="-1" aria-label="冰蓝道具减少1">−</button><button data-item="blue" data-delta="1" aria-label="冰蓝道具增加1">+</button><button data-item="blue" data-delta="10">+10</button></div></div><div class="item-controls"><form data-counter="blue"><label for="blue-quantity">指定数量</label><input id="blue-quantity" aria-label="冰蓝道具数量" type="number" min="0" max="999999999" step="1" value="200" inputmode="numeric" required><button>应用</button></form></div></article>
<article class="card pink"><div class="card-head"><i class="dot"></i>绯红道具<small>PINK</small></div><div class="stage"><div class="zoom"><item-counter id="pink" theme="pink" value="0" label="绯红道具"></item-counter></div></div><div class="card-foot"><span>2.6 × 细节预览</span><div class="stepper"><button data-item="pink" data-delta="-1" aria-label="绯红道具减少1">−</button><button data-item="pink" data-delta="1" aria-label="绯红道具增加1">+</button><button data-item="pink" data-delta="10">+10</button></div></div><div class="item-controls"><form data-counter="pink"><label for="pink-quantity">指定数量</label><input id="pink-quantity" aria-label="绯红道具数量" type="number" min="0" max="999999999" step="1" value="0" inputmode="numeric" required><button>应用</button></form></div></article></section>
<div class="toolbar"><button id="play" class="play">▶ 循环演示</button><button id="speed" class="rate">速度 1×</button><form id="set"><label for="quantity">指定数量</label><input id="quantity" type="number" min="0" max="999999999" step="1" value="200" inputmode="numeric" required><button>应用到两枚</button></form></div>
<div class="scenarios"><span>试试位数变化</span><button data-from="9" data-to="10">9 → 10</button><button data-from="99" data-to="100">99 → 100</button><button data-from="999" data-to="1000">999 → 1000</button><button data-from="100" data-to="99">100 → 99</button><button id="burst">连续 +1</button><button id="reset">还原</button></div>
<div class="bottom"><div class="actual"><item-counter id="small-blue" value="200" label="冰蓝道具"></item-counter><item-counter id="small-pink" theme="pink" value="0" label="绯红道具"></item-counter></div><div class="caption"><strong>1 × 实际尺寸</strong><br>左侧图案与圆角保持原样，数字增加向上滚动、减少向下滚动。</div></div>
<div id="status" class="status" role="status">两枚道具可分别输入数量；下方工具栏可同步演示。</div><footer><span>外框约 460 ms · 数字按位滚动 · 连续点击合并到最新数量</span><span>支持 0—999,999,999</span></footer>

 if(!was)this._animate(column,[{opacity:0},{opacity:1}],{duration:duration*.65,easing});
 if(!will){this._animate(column,[{opacity:1},{opacity:0}],{duration:duration*.35,easing,fill:'forwards'});continue;}
 const quotientDelta=Math.abs(Math.floor(to/10**p)-Math.floor(from/10**p));
 let steps=quotientDelta>19?10+quotientDelta%10:quotientDelta;
 if(!was)steps=Math.max(1,newDigit);
 if(steps===0){reel.innerHTML=`<span class="cell">${newDigit}</span>`;continue;}
 const values=[];
 if(!was){values.push(oldDigit,newDigit);steps=1;}else{for(let n=0;n<=steps;n++)values.push((oldDigit+direction*n%10+10)%10);}
 if(values[values.length-1]!==newDigit)values[values.length-1]=newDigit;
 const cells=direction>0?values:[...values].reverse();reel.innerHTML=cells.map(d=>`<span class="cell">${d}</span>`).join('');
 const yStart=direction>0?0:-steps*20,yEnd=direction>0?-steps*20:0;
 this._animate(reel,[{transform:`translateY(${yStart}px)`},{transform:`translateY(${yEnd}px)`}],{duration:duration*(.78+Math.min(p,4)*.045),easing,fill:'forwards'});
 }
 this._animate(this.shadowRoot.querySelector('.art'),[{transform:'translateY(0) scale(1)'},{transform:`translateY(${direction>0?-1.2:.7}px) scale(${direction>0?1.07:.97})`,offset:.24},{transform:'translateY(0) scale(1)'}],{duration,easing});
 this._animate(this.shadowRoot.querySelector('.pulse'),[{opacity:0},{opacity:.30,offset:.25},{opacity:0}],{duration,easing});
 await Promise.allSettled(this._animations.map(a=>a.finished));if(generation!==this._generation)return;
 this._animations.forEach(a=>a.cancel());this._animations=[];this._shown=to;this._paint(to);this._busy=false;this.dispatchEvent(new CustomEvent('counter-settled',{detail:{value:to},bubbles:true}));
 if(this._wanted!==to)this._run();else this._resolve();
 }
}
if(!customElements.get('item-counter'))customElements.define('item-counter',ItemCounter);
})();
</script><script>
const blue=document.querySelector('#blue'),pink=document.querySelector('#pink'),smallBlue=document.querySelector('#small-blue'),smallPink=document.querySelector('#small-pink');
const all=[blue,pink,smallBlue,smallPink];const play=document.querySelector('#play'),status=document.querySelector('#status');let playing=false,token=0,slow=false;
function pause(){playing=false;token++;play.textContent='▶ 循环演示';}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function setItem(theme,value,immediate=false){const main=theme==='blue'?blue:pink;const small=theme==='blue'?smallBlue:smallPink;const tasks=[main.setValue(value,{immediate}),small.setValue(value,{immediate})];document.querySelector('#'+theme+'-quantity').value=main.value;return Promise.all(tasks);}
function setPair(a,b=a,immediate=false){return Promise.all([setItem('blue',a,immediate),setItem('pink',b,immediate)]);}
document.querySelectorAll('[data-counter]').forEach(form=>form.onsubmit=e=>{e.preventDefault();pause();const theme=form.dataset.counter;setItem(theme,Number(form.querySelector('input').value));status.textContent=`${theme==='blue'?'冰蓝':'绯红'}道具 · 数量 ${theme==='blue'?blue.value:pink.value}`;});
async function scenario(a,b){pause();const run=token;await setPair(a,a,true);status.textContent=`${a} → ${b} · ${String(b).length>String(a).length?'外框展开':String(b).length<String(a).length?'外框收拢':'数字滚动'}`;await sleep(260);if(run===token)await setPair(b);}
async function loop(){playing=true;const run=++token;play.textContent='Ⅱ 暂停演示';await setPair(8,8,true);await sleep(700);const values=[9,10,11,99,100,101,999,1000,999,99,9,0,200];while(playing&&run===token){for(const v of values){if(!playing||run!==token)return;status.textContent=`循环演示 · ${blue.value} → ${v}`;await setPair(v);await sleep(850*(slow?2:1));}}}
play.onclick=()=>playing?pause():loop();
document.querySelectorAll('[data-delta]').forEach(button=>button.onclick=()=>{pause();const main=document.querySelector('#'+button.dataset.item);const small=main===blue?smallBlue:smallPink;const value=main.value+Number(button.dataset.delta);setItem(button.dataset.item,value);status.textContent=`${main===blue?'冰蓝':'绯红'}道具 · 数量 ${main.value}`;});
document.querySelectorAll('[data-from]').forEach(button=>button.onclick=()=>scenario(Number(button.dataset.from),Number(button.dataset.to)));
document.querySelector('#set').onsubmit=e=>{e.preventDefault();pause();const v=Number(document.querySelector('#quantity').value);setPair(v);status.textContent=`两枚道具 · 数量 ${Math.max(0,Math.min(999999999,Math.trunc(v)))}`;};
document.querySelector('#speed').onclick=()=>{slow=!slow;all.forEach(c=>c.setAttribute('duration-scale',slow?2:1));document.querySelector('#speed').textContent=slow?'速度 0.5×':'速度 1×';};
document.querySelector('#reset').onclick=()=>{pause();setPair(200,0);status.textContent='已还原 · 冰蓝 200 / 绯红 0';};
document.querySelector('#burst').onclick=async()=>{pause();const run=token;await setPair(95,95,true);status.textContent='连续 +1 · 95 → 105';for(let i=96;i<=105;i++){if(run!==token)return;setPair(i);await sleep(65);}};
window.counterPreview={setItem,setPair,scenario,pause,get playing(){return playing;},get counters(){return all;}};
</script></body></html>
