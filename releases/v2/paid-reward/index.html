 const select=(list,minW,minH)=>{
  const valid=list.filter(z=>z.right-z.left>=minW&&z.bottom-z.top>=minH);
  const full=valid.filter(z=>z.right-z.left>=desired);
  // Prefer a complete side gutter; then bottom/top band. All placements remain disjoint from the protected region.
  const z=(full.length?full:valid)[0];if(!z)return null;

window.addEventListener('resize',positionReviewTool);
window.addEventListener('scroll',positionReviewTool,{passive:true});

controller=GemSingle.create({}, {onChange:render,reducedMotion:()=>media.matches});get('unlock').addEventListener('click',()=>controller.update({membership:true}));get('reset').addEventListener('click',()=>controller.reset());reward.addEventListener('click',()=>controller.claim());reward.addEventListener('animationend',e=>{if(e.animationName==='claim-large')reward.classList.remove('feedback');});$('art').addEventListener('change',()=>controller.update({artKey:$('art').value}));$('membership').addEventListener('change',()=>controller.update({membership:$('membership').value==='true'}));$('locked').addEventListener('change',()=>controller.update({locked:$('locked').value==='auto'?null:$('locked').value==='true'}));for(const k of ['eligible','claimed'])$(k).addEventListener('change',()=>controller.update({[k]:$(k).checked}));$('amount').addEventListener('change',()=>{const result=$('amount').value.trim()===''?{ok:false}:controller.update({amount:Number($('amount').value)});$('amount').setCustomValidity(result.ok?'':controller.getSnapshot().config.strings.invalid);if(!result.ok)$('amount').reportValidity();});$('locale').addEventListener('change',()=>controller.update({locale:$('locale').value}));$('claimed-label').addEventListener('change',()=>controller.update({strings:{claimed:$('claimed-label').value}}));if(typeof media.addEventListener==='function')media.addEventListener('change',()=>controller.reset());window.gemReward=Object.freeze({update:controller.update,claim:controller.claim,reset:controller.reset,getSnapshot:controller.getSnapshot});render();
const reviewScale = document.getElementById("review-scale");
if (reviewScale) {
  reviewScale.addEventListener("change", () => {
    document.documentElement.style.setProperty("--reward-scale", reviewScale.value);
  });
}
})();
</script></body></html>
