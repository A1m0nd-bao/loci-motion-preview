function setGuide(next){if(collapsed===next)return;collapsed=next;art.classList.toggle('is-collapsed',collapsed);guideToggle.textContent=collapsed?'展开引导':'收起引导';guideToggle.setAttribute('aria-expanded',String(!collapsed));guideHit.setAttribute('aria-expanded',String(!collapsed));guide.setAttribute('aria-hidden',String(collapsed));closeGuide.setAttribute('tabindex',collapsed?'-1':'0');document.querySelector('#mode').textContent=collapsed?'引导已收起':'引导动效 · 3.6s 循环';document.querySelector('.progress').style.visibility=collapsed?'hidden':'visible';for(const a of animations()){if(a.effect.target.closest('.guide')||a.effect.target.classList.contains('flow-light')){if(collapsed)a.pause();else{a.currentTime=0;a.playbackRate=speed;if(!paused)a.play()}}}}
function reset(){paused=false;document.body.classList.remove('stopped');play.textContent='暂停';for(const a of animations()){a.currentTime=0;a.playbackRate=speed;if(collapsed&&(a.effect.target.closest('.guide')||a.effect.target.classList.contains('flow-light')))a.pause();else a.play()}}
play.onclick=()=>{paused=!paused;for(const a of animations()){if(paused||collapsed&&(a.effect.target.closest('.guide')||a.effect.target.classList.contains('flow-light')))a.pause();else a.play()}document.body.classList.toggle('stopped',paused);play.textContent=paused?'播放':'暂停'};replay.onclick=reset;interact.onclick=toggle;hit.onclick=toggle;guideToggle.onclick=()=>setGuide(!collapsed);closeGuide.onclick=()=>{setGuide(true);guideHit.focus()};guideHit.onclick=()=>setGuide(false);for(const target of [hit,closeGuide,guideHit])target.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();target.onclick()}};document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);for(const a of animations())a.playbackRate=speed};window.preview={seek:ms=>{for(const a of animations()){a.pause();a.currentTime=ms}},reset,toggle,setGuide};
</script></body></html>
