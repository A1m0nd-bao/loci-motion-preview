      this.dispatchEvent(new CustomEvent('motion-finish', {bubbles: true, composed: true}));
    }
    if (this.queued && !this.reduced.matches) {
      this.queued = false;
      this.play();
      return;
    }
    this.queued = false;
    if (!this.isPaused && this.autoPlay && !this.reduced.matches) {
      this.scheduleNext(this.intervalMs);
    }
  }
}

if (!customElements.get('sipplay-maple-gift')) customElements.define('sipplay-maple-gift', SipplayMapleGift);

const icons = [...document.querySelectorAll('sipplay-maple-gift')];
document.addEventListener('visibilitychange', () => {
  for (const icon of icons) {
    if (document.visibilityState === 'visible') icon.resume();
    else icon.pause();
  }
});

const replay = document.getElementById('replay');
const autoBtn = document.getElementById('auto');
if (replay) {
  replay.addEventListener('click', () => {
    for (const icon of icons) icon.playOrQueue();
  });
}
if (autoBtn) {
  autoBtn.addEventListener('click', () => {
    const on = autoBtn.getAttribute('aria-pressed') !== 'true';
    autoBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    autoBtn.textContent = on ? '自动：开' : '自动：关';
    for (const icon of icons) icon.setAutoPlay(on);
  });
}

</script>
